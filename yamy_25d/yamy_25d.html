<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yamy 2.5D 数字宠物</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26242c;
      --muted: #746d79;
      --line: #eadfe8;
      --paper: #fffafc;
      --panel: rgba(255, 255, 255, .86);
      --pink: #d96d9f;
      --pink-dark: #a74478;
      --gold: #e8b451;
      --shadow: 0 22px 70px rgba(105, 57, 93, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(247, 206, 225, .44), transparent 34%),
        radial-gradient(circle at 90% 12%, rgba(246, 225, 184, .52), transparent 28%),
        linear-gradient(135deg, #fffdfd 0%, #fff6fa 46%, #f8f3fb 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    button, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 0 42px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid #f0c7dc;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 8px 20px rgba(122, 55, 96, .1);
      color: var(--pink-dark);
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #82bf9a;
      box-shadow: 0 0 0 4px rgba(130, 191, 154, .16);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, .8fr);
      gap: 20px;
    }

    .stage, .controls {
      border: 1px solid rgba(234, 223, 232, .9);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .stage {
      min-height: 650px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      display: grid;
      place-items: center;
      padding: 38px;
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }

    .stage::before {
      inset: 12% 12% auto auto;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: rgba(250, 223, 235, .62);
      filter: blur(5px);
    }

    .stage::after {
      inset: auto auto 4% 8%;
      width: 310px;
      height: 120px;
      border-radius: 50%;
      background: rgba(231, 206, 232, .58);
      filter: blur(15px);
    }

    .stage-head {
      position: absolute;
      inset: 24px 28px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .stage-head strong {
      color: var(--ink);
      font-size: 13px;
    }

    .character-wrap {
      position: relative;
      width: min(54%, 390px);
      min-width: 235px;
      aspect-ratio: 192 / 208;
      display: grid;
      place-items: end center;
      transform: translateY(15px);
    }

    .character-wrap.talking {
      animation: breathe .9s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from { transform: translateY(15px) scale(1); }
      to { transform: translateY(8px) scale(1.012); }
    }

    #avatarCanvas {
      width: 100%;
      height: 100%;
      image-rendering: auto;
      filter: drop-shadow(0 22px 18px rgba(56, 27, 53, .17));
    }

    .platform {
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 82%;
      height: 34px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(63, 40, 62, .2), rgba(63, 40, 62, 0) 70%);
      filter: blur(2px);
    }

    .speech {
      position: absolute;
      top: 17%;
      right: 9%;
      max-width: 240px;
      padding: 14px 16px;
      border: 1px solid #f0d3e2;
      border-radius: 16px 16px 4px 16px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 14px 28px rgba(107, 54, 93, .12);
      color: #5d4559;
      font-size: 14px;
      line-height: 1.55;
    }

    .speech::after {
      content: "";
      position: absolute;
      right: 20px;
      bottom: -9px;
      width: 16px;
      height: 16px;
      border-right: 1px solid #f0d3e2;
      border-bottom: 1px solid #f0d3e2;
      background: #fff;
      transform: rotate(45deg);
    }

    .speech.empty {
      color: #a996a5;
      font-size: 12px;
    }

    .talking-pill {
      position: absolute;
      left: 28px;
      bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid #ecd9e5;
      color: var(--muted);
      background: rgba(255,255,255,.76);
      font-size: 11px;
    }

    .talking-pill .eq {
      display: inline-flex;
      gap: 2px;
      align-items: end;
      height: 12px;
    }

    .eq i {
      display: block;
      width: 2px;
      height: 6px;
      border-radius: 2px;
      background: var(--pink);
    }

    .talking .eq i:nth-child(1) { animation: eq .55s ease-in-out infinite alternate; }
    .talking .eq i:nth-child(2) { animation: eq .4s .1s ease-in-out infinite alternate; }
    .talking .eq i:nth-child(3) { animation: eq .7s .18s ease-in-out infinite alternate; }

    @keyframes eq {
      from { height: 4px; }
      to { height: 12px; }
    }

    .controls {
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 11px;
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,.74);
      transition: border-color .2s, box-shadow .2s;
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      padding: 13px 14px;
      line-height: 1.6;
    }

    select {
      height: 42px;
      padding: 0 12px;
    }

    textarea:focus, select:focus {
      border-color: #d99abd;
      box-shadow: 0 0 0 4px rgba(217, 109, 159, .12);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 0 14px;
      font-weight: 700;
      transition: transform .16s, box-shadow .16s, background .16s;
    }

    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translateY(0); }

    .button.primary {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 20px rgba(167, 68, 120, .2);
    }

    .button.secondary {
      border-color: var(--line);
      color: #654d60;
      background: rgba(255,255,255,.74);
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .meter-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .meter {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #f2e8ef;
    }

    .meter > i {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #e89bbd, var(--gold));
      transition: width .18s ease;
    }

    .meter-row small {
      color: var(--muted);
      font-size: 11px;
    }

    .notes {
      margin-top: auto;
      padding-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .notes strong { color: #644e61; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      border: 1px solid #ead8e5;
      border-radius: 10px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 30px rgba(78, 43, 73, .14);
      color: #6b5266;
      font-size: 12px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 620px); padding-top: 22px; }
      .topbar { align-items: flex-start; }
      .status { padding-top: 8px; }
      .workspace { grid-template-columns: 1fr; }
      .stage { min-height: 540px; }
      .character-wrap { width: min(64%, 340px); }
      .speech { top: 14%; right: 4%; max-width: 200px; }
    }

    @media (max-width: 480px) {
      .brand p { display: none; }
      .stage { min-height: 500px; padding: 24px 16px; }
      .stage-head { inset: 18px 18px auto; }
      .character-wrap { width: 75%; min-width: 210px; }
      .speech { top: 12%; right: 3%; max-width: 174px; font-size: 12px; }
      .controls { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">Y</div>
        <div>
          <h1>Yamy 2.5D</h1>
          <p>桌面宠物 · 语音互动原型</p>
        </div>
      </div>
      <div class="status"><i class="status-dot"></i><span id="readyStatus">素材已加载</span></div>
    </header>

    <section class="workspace">
      <section class="stage" aria-label="Yamy 数字宠物预览">
        <div class="stage-head">
          <strong>Live avatar</strong>
          <span id="frameReadout">idle · 01</span>
        </div>
        <div class="speech empty" id="speechBubble">输入一句话，让 Yamy 说出来。</div>
        <div class="character-wrap" id="characterWrap">
          <canvas id="avatarCanvas" width="384" height="416" aria-label="Yamy 动画角色"></canvas>
          <div class="platform"></div>
        </div>
        <div class="talking-pill" id="talkingPill">
          <span class="eq"><i></i><i></i><i></i></span>
          <span id="talkingLabel">待机中</span>
        </div>
      </section>

      <aside class="controls">
        <div class="section-title">
          <h2>对话</h2>
          <span id="supportLabel">浏览器语音</span>
        </div>

        <div>
          <label class="field-label" for="textInput">Yamy 要说的话</label>
          <textarea id="textInput">你好，我是 Yamy。今天也要记得好好休息。</textarea>
        </div>

        <div class="actions">
          <button class="button primary" id="speakButton" type="button">播放语音</button>
          <button class="button secondary" id="stopButton" type="button">停止</button>
        </div>

        <div class="divider"></div>

        <div>
          <label class="field-label" for="voiceSelect">声音</label>
          <select id="voiceSelect" aria-label="选择语音"></select>
        </div>

        <div class="meter-row">
          <div class="meter" aria-label="播放进度"><i id="progressBar"></i></div>
          <small id="progressLabel">0%</small>
        </div>

        <div class="actions">
          <button class="button secondary" id="listenButton" type="button">开始听我说</button>
          <button class="button secondary" id="clearButton" type="button">清空气泡</button>
        </div>

        <div class="notes">
          <strong>当前版本：</strong>使用 Yamy 精灵图进行 2.5D 动画和语音播报。声音由浏览器本地语音引擎提供，不会上传文本。
        </div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const SHEET = "assets/yamy-spritesheet.png";
      const COLS = 8;
      const ROWS = 11;
      const FRAME_W = 192;
      const FRAME_H = 208;
      const canvas = document.querySelector("#avatarCanvas");
      const ctx = canvas.getContext("2d");
      const image = new Image();
      const characterWrap = document.querySelector("#characterWrap");
      const speechBubble = document.querySelector("#speechBubble");
      const talkingPill = document.querySelector("#talkingPill");
      const talkingLabel = document.querySelector("#talkingLabel");
      const frameReadout = document.querySelector("#frameReadout");
      const textInput = document.querySelector("#textInput");
      const voiceSelect = document.querySelector("#voiceSelect");
      const progressBar = document.querySelector("#progressBar");
      const progressLabel = document.querySelector("#progressLabel");
      const readyStatus = document.querySelector("#readyStatus");
      const toast = document.querySelector("#toast");
      const listenButton = document.querySelector("#listenButton");
      let currentFrame = 0;
      let currentRow = 0;
      let speaking = false;
      let animationTimer = 0;
      let speechTimer = 0;
      let recognition = null;

      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2400);
      };

      const setSpeaking = (value) => {
        speaking = value;
        characterWrap.classList.toggle("talking", value);
        talkingPill.classList.toggle("talking", value);
        talkingLabel.textContent = value ? "正在说话" : "待机中";
        if (!value) {
          progressBar.style.width = "0%";
          progressLabel.textContent = "0%";
        }
      };

      const drawFrame = () => {
        if (!image.complete || !image.naturalWidth) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const sx = currentFrame * FRAME_W;
        const sy = currentRow * FRAME_H;
        ctx.drawImage(image, sx, sy, FRAME_W, FRAME_H, 0, 0, canvas.width, canvas.height);
        frameReadout.textContent = `${speaking ? "speaking" : "idle"} · ${String(currentFrame + 1).padStart(2, "0")}`;
      };

      const tick = () => {
        currentFrame = (currentFrame + 1) % COLS;
        if (speaking) {
          currentRow = [3, 4, 5, 6][Math.floor(currentFrame / 2) % 4];
        } else {
          currentRow = 0;
        }
        drawFrame();
        animationTimer = window.setTimeout(tick, speaking ? 110 : 220);
      };

      const populateVoices = () => {
        const voices = window.speechSynthesis?.getVoices?.() || [];
        voiceSelect.innerHTML = "";
        const zh = voices.filter((voice) => /^zh/i.test(voice.lang) || /Chinese|中文|普通话|Mandarin/i.test(voice.name));
        const choices = zh.length ? zh : voices;
        if (!choices.length) {
          const option = document.createElement("option");
          option.textContent = "使用系统默认声音";
          option.value = "";
          voiceSelect.appendChild(option);
          return;
        }
        choices.forEach((voice) => {
          const option = document.createElement("option");
          option.value = voices.indexOf(voice);
          option.textContent = `${voice.name} · ${voice.lang}`;
          voiceSelect.appendChild(option);
        });
      };

      const speak = () => {
        const text = textInput.value.trim();
        if (!text) {
          showToast("先输入一句话");
          textInput.focus();
          return;
        }
        if (!("speechSynthesis" in window)) {
          showToast("当前浏览器不支持语音播报");
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const selected = voices[Number(voiceSelect.value)];
        if (selected) {
          utterance.voice = selected;
          utterance.lang = selected.lang;
        } else {
          utterance.lang = "zh-CN";
        }
        utterance.rate = 0.98;
        utterance.pitch = 1.08;
        speechBubble.textContent = text;
        speechBubble.classList.remove("empty");
        utterance.onstart = () => {
          setSpeaking(true);
          const startedAt = performance.now();
          const duration = Math.max(1400, text.length * 170);
          window.clearInterval(speechTimer);
          speechTimer = window.setInterval(() => {
            const percent = Math.min(100, Math.round(((performance.now() - startedAt) / duration) * 100));
            progressBar.style.width = `${percent}%`;
            progressLabel.textContent = `${percent}%`;
          }, 80);
        };
        utterance.onend = () => {
          setSpeaking(false);
          window.clearInterval(speechTimer);
          progressBar.style.width = "100%";
          progressLabel.textContent = "100%";
        };
        utterance.onerror = () => {
          setSpeaking(false);
          window.clearInterval(speechTimer);
          showToast("语音播放失败，请检查系统声音设置");
        };
        window.speechSynthesis.speak(utterance);
      };

      const stop = () => {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        window.clearInterval(speechTimer);
        setSpeaking(false);
      };

      const initRecognition = () => {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
          listenButton.disabled = true;
          listenButton.title = "当前浏览器不支持语音识别";
          return;
        }
        recognition = new Recognition();
        recognition.lang = "zh-CN";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = () => {
          listenButton.textContent = "正在聆听";
          showToast("请说话");
        };
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          textInput.value = transcript;
          speak();
        };
        recognition.onerror = () => showToast("没有听清，请再试一次");
        recognition.onend = () => { listenButton.textContent = "开始听我说"; };
      };

      image.onload = () => {
        readyStatus.textContent = "Yamy 已就绪";
        drawFrame();
        window.clearTimeout(animationTimer);
        tick();
      };
      image.onerror = () => {
        readyStatus.textContent = "素材加载失败";
        showToast("找不到 Yamy 精灵图");
      };
      image.src = SHEET;

      document.querySelector("#speakButton").addEventListener("click", speak);
      document.querySelector("#stopButton").addEventListener("click", stop);
      document.querySelector("#clearButton").addEventListener("click", () => {
        speechBubble.textContent = "输入一句话，让 Yamy 说出来。";
        speechBubble.classList.add("empty");
        stop();
      });
      listenButton.addEventListener("click", () => recognition?.start());
      textInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") speak();
      });
      window.speechSynthesis?.addEventListener?.("voiceschanged", populateVoices);
      populateVoices();
      initRecognition();
    })();
  </script>
</body>
</html>
