<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Human Driver - LiveTalking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="common.css">
    <style>
        .main-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
            margin-top: 24px;
        }
        @media (max-width: 992px) { .main-layout { grid-template-columns: 1fr; } }
        video { width: 100%; border-radius: 8px; background: #000; min-height: 200px; }
        #videoPlaceholder {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 8px; min-height: 300px; color: #64748b;
        }
        #videoPlaceholder i { font-size: 48px; opacity: 0.5; }
        .param-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 768px) { .param-row { grid-template-columns: 1fr; } }
        .driver-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
        .text-driver textarea { min-height: 70px; }
    </style>
</head>
<body>

<nav id="lt-nav-container"></nav>

<div class="container">
    <div class="main-layout">
        <div>
            <div class="glass-card">
                <div class="card-header">
                    <i class="bi bi-broadcast"></i> WebRTC Connection
                    <span id="connectionBadge" class="status-badge offline ms-auto">Disconnected</span>
                </div>
                <div class="card-body">
                    <div class="param-row mb-3">
                        <div class="form-group">
                            <label class="form-label">Avatar ID</label>
                            <input type="text" class="form-control" id="offerAvatar"
                                   placeholder="wav2lip256_avatar1" value="wav2lip256_avatar1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Reference Audio</label>
                            <input type="text" class="form-control" id="offerRefAudio"
                                   placeholder="zh-CN-YunxiaNeural">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ref Text <span class="form-hint">(optional)</span></label>
                            <input type="text" class="form-control" id="offerRefText"
                                   placeholder="For improved lip-sync accuracy">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" id="btnConnect" onclick="start()">
                            <i class="bi bi-play-fill"></i> Connect
                        </button>
                        <button class="btn btn-danger" id="btnDisconnect" onclick="stop()" style="display:none;">
                            <i class="bi bi-stop-fill"></i> Disconnect
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="checkSpeaking()" id="btnCheckSpeak" disabled>
                            <i class="bi bi-info-circle"></i> Speaking Status
                        </button>
                    </div>
                    <div class="mt-3">
                        <div id="videoPlaceholder">
                            <div class="text-center">
                                <i class="bi bi-camera-video-off d-block mb-2"></i>
                                <span>Click "Connect" to start the digital human</span>
                            </div>
                        </div>
                        <video id="video" autoplay playsinline muted controls style="display:none;"></video>
                        <audio id="audio" autoplay style="display:none;"></audio>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="glass-card text-driver">
                <div class="card-header"><i class="bi bi-chat-text-fill"></i> Text Driver</div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Enter text to speak</label>
                        <textarea class="form-control" id="txtMessage" rows="2"
                                  placeholder="Enter text for the digital human to speak...">Hello, welcome to LiveTalking</textarea>
                    </div>
                    <div class="driver-actions">
                        <select class="form-select" id="txtType" style="width:130px;">
                            <option value="echo">Echo</option>
                            <option value="chat">Chat LLM</option>
                        </select>
                        <label class="form-check">
                            <input type="checkbox" id="txtInterrupt" checked>
                            <span>Interrupt</span>
                        </label>
                        <button class="btn btn-primary btn-sm" onclick="sendText()">
                            <i class="bi bi-send"></i> Send
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="interrupt()">
                            <i class="bi bi-stop-circle"></i> Interrupt
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header"><i class="bi bi-mic-fill"></i> Audio Driver</div>
                <div class="card-body">
                    <div class="d-flex gap-2 align-items-center">
                        <input type="file" class="form-control" id="audioFile" accept="audio/*" style="flex:1;">
                        <button class="btn btn-primary btn-sm" onclick="uploadAudio()">
                            <i class="bi bi-upload"></i> Upload &amp; Play
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header"><i class="bi bi-record-circle"></i> Recording</div>
                <div class="card-body">
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline btn-sm" id="btnRecToggle" onclick="toggleRecord()">
                            <i class="bi bi-record-circle"></i> Start Recording
                        </button>
                        <button class="btn btn-outline btn-sm" id="btnDownload" onclick="downloadRecord()" disabled>
                            <i class="bi bi-download"></i> Download Video
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header"><i class="bi bi-sliders"></i> Custom State</div>
                <div class="card-body">
                    <div class="d-flex gap-2 align-items-end">
                        <div class="form-group mb-0" style="flex:1;">
                            <label class="form-label">Audiotype Index</label>
                            <input type="number" class="form-control" id="audiotypeVal" value="2" min="2">
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="setAudiotype()">
                            <i class="bi bi-arrow-right-circle"></i> Switch State
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
LT.Nav.current = 'index';
LT.Nav.inject('#lt-nav-container');

let pc = null;
let sessionid = null;

function showVideo(show) {
    document.getElementById('videoPlaceholder').style.display = show ? 'none' : 'flex';
    document.getElementById('video').style.display = show ? 'block' : 'none';
    document.getElementById('audio').style.display = show ? 'block' : 'none';
}

function updateConnectionUI(connected) {
    const badge = document.getElementById('connectionBadge');
    if (connected) {
        badge.className = 'status-badge online ms-auto';
        badge.innerHTML = '<span class="status-dot on"></span> Connected';
    } else {
        badge.className = 'status-badge offline ms-auto';
        badge.innerHTML = '<span class="status-dot off"></span> Disconnected';
    }
    LT.Nav.updateStatus(connected);
    document.getElementById('btnCheckSpeak').disabled = !connected;
}

function negotiate() {
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    return pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
        return new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                const check = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); } };
                pc.addEventListener('icegatheringstatechange', check);
            }
        });
    }).then(() => {
        const offer = pc.localDescription;
        return LT.Api.post('/offer', {
            sdp: offer.sdp, type: offer.type,
            avatar: document.getElementById('offerAvatar').value || undefined,
            refaudio: document.getElementById('offerRefAudio').value || undefined,
            reftext: document.getElementById('offerRefText').value || undefined,
        }, { showError: false });
    }).then(answer => {
        if (answer.sessionid) { sessionid = answer.sessionid; LT.Nav.updateSessionId(sessionid); }
        return pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
    }).catch(e => {
        LT.Toast.error('Connection Failed', e.message);
        if (pc) { pc.close(); pc = null; }
        updateConnectionUI(false);
        document.getElementById('btnConnect').style.display = 'inline-flex';
        document.getElementById('btnDisconnect').style.display = 'none';
        showVideo(false);
    });
}

function start() {
    LT.Loading.button('#btnConnect', true);
    const config = { sdpSemantics: 'unified-plan' };
    pc = new RTCPeerConnection(config);
    pc.addEventListener('track', evt => {
        showVideo(true);
        if (evt.track.kind === 'video') document.getElementById('video').srcObject = evt.streams[0];
        else document.getElementById('audio').srcObject = evt.streams[0];
    });
    pc.addEventListener('connectionstatechange', () => {
        const state = pc.connectionState;
        if (state === 'connected') { updateConnectionUI(true); LT.Toast.success('Connected', 'Digital human session established'); }
        else if (state === 'disconnected' || state === 'failed') { updateConnectionUI(false); if (state === 'failed') LT.Toast.error('Disconnected', 'Please check your network and try again'); }
    });
    negotiate().finally(() => LT.Loading.button('#btnConnect', false));
    document.getElementById('btnConnect').style.display = 'none';
    document.getElementById('btnDisconnect').style.display = 'inline-flex';
}

function stop() {
    if (pc) { pc.close(); pc = null; }
    updateConnectionUI(false);
    sessionid = null;
    LT.Nav.updateSessionId(null);
    document.getElementById('btnConnect').style.display = 'inline-flex';
    document.getElementById('btnDisconnect').style.display = 'none';
    document.getElementById('video').srcObject = null;
    document.getElementById('audio').srcObject = null;
    showVideo(false);
    LT.Toast.info('Disconnected', 'Session ended');
}

function sendText() {
    const text = document.getElementById('txtMessage').value.trim();
    if (!text) return LT.Toast.warning('Please enter text');
    if (!sessionid) return LT.Toast.warning('Please connect first');
    LT.Api.post('/human', { text, type: document.getElementById('txtType').value, interrupt: document.getElementById('txtInterrupt').checked, sessionid: String(sessionid) })
        .then(() => { document.getElementById('txtMessage').value = ''; LT.Toast.success('Sent', 'Speaking now'); });
}

function uploadAudio() {
    const file = document.getElementById('audioFile').files[0];
    if (!file) return LT.Toast.warning('Please select an audio file');
    if (!sessionid) return LT.Toast.warning('Please connect first');
    LT.Api.upload('/humanaudio', file, { sessionid: String(sessionid) })
        .then(() => LT.Toast.success('Uploaded', 'Audio is playing'));
}

function interrupt() {
    if (!sessionid) return LT.Toast.warning('Please connect first');
    LT.Api.post('/interrupt_talk', { sessionid: String(sessionid) })
        .then(() => LT.Toast.info('Interrupted', 'Current speech stopped'));
}

function checkSpeaking() {
    if (!sessionid) return LT.Toast.warning('Please connect first');
    LT.Api.post('/is_speaking', { sessionid: String(sessionid) })
        .then(d => LT.Toast.info('Speaking Status', d.data && d.data.is_speaking ? 'Digital human is speaking' : 'Digital human is silent'));
}

let recording = false;
function toggleRecord() {
    if (!sessionid) return LT.Toast.warning('Please connect first');
    const btn = document.getElementById('btnRecToggle');
    const type = recording ? 'end_record' : 'start_record';
    LT.Api.post('/record', { type, sessionid: String(sessionid) }).then(() => {
        recording = !recording;
        if (recording) {
            btn.className = 'btn btn-danger btn-sm'; btn.innerHTML = '<i class="bi bi-stop-circle"></i> Stop Recording';
            document.getElementById('btnDownload').disabled = true;
            LT.Toast.info('Recording', 'Digital human is being recorded');
        } else {
            btn.className = 'btn btn-outline btn-sm'; btn.innerHTML = '<i class="bi bi-record-circle"></i> Start Recording';
            document.getElementById('btnDownload').disabled = false;
            LT.Toast.success('Recording Complete', 'You can download the video now');
        }
    });
}
function downloadRecord() { if (!sessionid) return; window.open('/record/' + sessionid, '_blank'); }

function setAudiotype() {
    if (!sessionid) return LT.Toast.warning('Please connect first');
    const val = parseInt(document.getElementById('audiotypeVal').value) || 0;
    LT.Api.post('/set_audiotype', { audiotype: val, sessionid: String(sessionid) })
        .then(() => LT.Toast.success('Switched', `Audiotype set to ${val}`));
}

document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); sendText(); }
});
</script>
</body>
</html>
