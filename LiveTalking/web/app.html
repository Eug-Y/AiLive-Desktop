<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="sky" data-nav="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI 数字人</title>
<!-- 本文件由 tmp/assemble_app.py 生成：外壳（左导航/工具栏/多标签/设置/关于）新写，业务面板与接口层从 desktop.html 复用；不要手工改本文件，改 tmp/app_parts/* 后重新装配。 -->

<style>
/* ═══════════════════════════ 1. 设计令牌（主题变量） ═══════════════════════════ */
:root{
  /* 主色：浅蓝（默认）。可在“设置 → 外观 → 主色”切换，只改这一组变量 */
  --brand:#38bdf8; --brand-strong:#0ea5e9; --brand-deep:#0284c7;
  --brand-soft:#e0f2fe; --brand-tint:rgba(56,189,248,.16); --brand-ring:rgba(14,165,233,.34);
  --on-brand:#062a3d;

  --text:#0f2438; --text-2:#4a6076; --text-3:#7d90a4;
  --line:rgba(15,40,70,.10); --line-strong:rgba(15,40,70,.18);
  --surface:#ffffff; --surface-2:#f4f8fc; --surface-3:#e9f1f8;
  --glass:rgba(250,253,255,.82); --glass-solid:#f8fbfe;
  --ok:#0f9d6e; --ok-bg:#e6f7f0; --warn:#c47f0a; --warn-bg:#fdf3e2;
  --err:#d64545; --err-bg:#fdecec; --info:#2f7fd8; --info-bg:#e8f1fd;
  --shadow-win:0 22px 56px rgba(12,38,66,.26), 0 3px 10px rgba(12,38,66,.14);
  --shadow-soft:0 8px 24px rgba(12,38,66,.12);
  --shadow-pop:0 16px 44px rgba(12,38,66,.22);
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --title-h:38px; --taskbar-h:52px;
  --font:'Segoe UI Variable','Segoe UI','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'Cascadia Mono','JetBrains Mono',Consolas,'Courier New',monospace;
  --t-fast:.14s cubic-bezier(.2,.7,.3,1); --t-base:.22s cubic-bezier(.2,.7,.3,1);
}
/* 深色主题：只需覆盖下面这些变量 */
html[data-theme="dark"]{
  --text:#e8f1fa; --text-2:#a9bccd; --text-3:#7d92a6;
  --line:rgba(160,196,226,.16); --line-strong:rgba(160,196,226,.26);
  --surface:#161f2b; --surface-2:#1d2836; --surface-3:#243040;
  --glass:rgba(20,29,40,.82); --glass-solid:#141d28;
  --ok:#3fcf9a; --ok-bg:rgba(24,160,120,.16); --warn:#f0b45c; --warn-bg:rgba(196,127,10,.18);
  --err:#f08a8a; --err-bg:rgba(214,69,69,.18); --info:#7fb6f0; --info-bg:rgba(47,127,216,.18);
  --shadow-win:0 22px 56px rgba(0,0,0,.55), 0 3px 10px rgba(0,0,0,.45);
  --shadow-soft:0 8px 24px rgba(0,0,0,.4);
  --shadow-pop:0 16px 44px rgba(0,0,0,.5);
  --on-brand:#04222f;
}
/* 主色备选（默认 sky＝浅蓝，符合“主色调：浅蓝色”） */
html[data-accent="azure"]{--brand:#60a5fa;--brand-strong:#3b82f6;--brand-deep:#2563eb;--brand-soft:#e8f0fe;--brand-tint:rgba(96,165,250,.16);--brand-ring:rgba(59,130,246,.34)}
html[data-accent="cyan"]{--brand:#22d3ee;--brand-strong:#06b6d4;--brand-deep:#0891b2;--brand-soft:#e0fbfe;--brand-tint:rgba(34,211,238,.16);--brand-ring:rgba(6,182,212,.34)}
html[data-accent="teal"]{--brand:#2dd4bf;--brand-strong:#14b8a6;--brand-deep:#0d9488;--brand-soft:#e2fbf6;--brand-tint:rgba(45,212,191,.16);--brand-ring:rgba(20,184,166,.34)}
html[data-accent="indigo"]{--brand:#818cf8;--brand-strong:#6366f1;--brand-deep:#4f46e5;--brand-soft:#eef0fe;--brand-tint:rgba(129,140,248,.16);--brand-ring:rgba(99,102,241,.34)}

/* ═══════════════════════════ 2. 基础重置 ═══════════════════════════ */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--font); color:var(--text); background:#8fb6d6;
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  user-select:none; /* 桌面软件观感：默认不可选中文本，正文区域再放开 */
}
body.no-anim *{transition:none!important;animation:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand-strong);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}


/* ═══════════ 外壳布局（app.html 新增，复用上面的设计令牌）═══════════ */
/* ═══════════════════════════════════════════════════════════════════
   常规桌面软件布局：顶部标题/菜单行 + 左侧导航 + 多标签内容区 + 状态栏
   令牌与控件样式复用 desktop.html 第 1/2/9 节，这里只补“应用外壳”骨架。
   实际使用到的令牌名：--brand/--brand-strong/--brand-deep/--brand-soft/--brand-ring
   --on-brand/--text/--text-2/--text-3/--line/--line-strong/--surface/--surface-2/
   --surface-3/--ok/--ok-bg/--warn/--warn-bg/--err/--err-bg/--radius/--radius-sm/--t-fast
   ═══════════════════════════════════════════════════════════════════ */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr; }

/* ── 标题行：品牌 + 模块名 + 服务状态 + 账号 ───────────────── */
#titlebar {
  display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
#titlebar .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; }
#titlebar .brand .logo {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 26px;
  background: linear-gradient(135deg, var(--brand), var(--brand-strong)); color: var(--on-brand);
  box-shadow: 0 2px 8px var(--brand-ring);
}
#titlebar .brand .logo svg { width: 17px; height: 17px; }
/* 版本/端标记做成小胶囊：直接跟在“AI 数字人”后面会被读成“AI 数字人网页端”一个词 */
#titlebar .brand small { font-weight: 500; color: var(--text-3); font-size: 10.5px; margin-left: 6px;
  padding: 1px 7px; border-radius: 999px; background: var(--surface-3); }
#titlebar .brand small:empty { display: none; }
#titlebar .crumb { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#titlebar .crumb h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
#titlebar .crumb .sub { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#titlebar .grow { flex: 1 1 auto; }

/* 标题行按钮（自包含，不依赖任务栏样式） */
.app-btn {
  height: 30px; padding: 0 11px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--text); font-size: 12.5px;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.app-btn:hover { background: var(--surface-3); }
.app-btn:active { transform: translateY(1px); }
.app-btn svg { width: 15px; height: 15px; }
.app-btn.icon-only { padding: 0; width: 30px; justify-content: center; }
.app-btn.primary { background: linear-gradient(180deg, var(--brand), var(--brand-strong)); border-color: var(--brand-deep); color: var(--on-brand); font-weight: 600; }
.app-btn[disabled] { opacity: .5; pointer-events: none; }
.app-chip {
  height: 28px; border-radius: 999px; padding: 0 11px; font-size: 11.5px;
  display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
}
.app-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.app-chip.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.app-chip.err .dot { background: var(--err); box-shadow: 0 0 0 3px var(--err-bg); }
.app-chip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
/* 复用的 updateModeChip() 用的是 .tb-chip（与 desktop.html 保持一致） */
.tb-chip {
  height: 28px; border-radius: 999px; padding: 0 11px; font-size: 11.5px;
  display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
}
.tb-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.tb-chip.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.tb-chip.err .dot { background: var(--err); box-shadow: 0 0 0 3px var(--err-bg); }
.tb-chip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
/* 通知按钮的未读小点（renderNotes 会给 #notifyBtn 加 .has） */
#notifyBtn { position: relative; }
#notifyDot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--err); display: none; }
#notifyBtn.has #notifyDot { display: block; }

/* ── 菜单行（文件/视图/服务/帮助）──────────────────────────── */
#menubar {
  display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 8px;
  background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12.5px;
}
#menubar .mi { border: 0; background: transparent; color: var(--text); padding: 5px 10px; border-radius: 6px; }
#menubar .mi:hover, #menubar .mi.on { background: var(--surface-3); }
#menubar .kb { margin-left: auto; color: var(--text-3); font-size: 11.5px; display: flex; gap: 10px; align-items: center; }
#menubar .kb kbd { font-family: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

/* ── 主体：左导航 + 内容区 ─────────────────────────────────── */
#body { display: grid; grid-template-columns: 236px 1fr; min-height: 0;
  transition: grid-template-columns .18s cubic-bezier(.2,.7,.3,1); }
@media (prefers-reduced-motion: reduce) { #body { transition: none; } }
html[data-nav="collapsed"] #body { grid-template-columns: 0 1fr; }
html[data-nav="collapsed"] #side { visibility: hidden; }

#side { display: flex; flex-direction: column; min-height: 0; background: var(--surface-2); border-right: 1px solid var(--line); }
#side .side-head { padding: 9px 10px 4px; }
#side .side-search { position: relative; }
#side .side-search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); }
#side input {
  width: 100%; height: 30px; padding: 0 8px 0 28px; font-size: 12.5px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
}
#navList { flex: 1 1 auto; overflow: auto; padding: 2px 8px 10px; }
#navList .grp { color: var(--text-3); font-size: 11px; font-weight: 650; letter-spacing: .5px; padding: 10px 8px 4px; }
#navList .nav {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent; color: var(--text);
  padding: 7px 8px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.2;
}
#navList .nav:hover { background: var(--surface-3); }
#navList .nav.on { background: var(--brand-soft); border-color: var(--brand-ring); color: var(--brand-ink); font-weight: 600; }
#navList .nav .ic { width: 17px; height: 17px; flex: 0 0 17px; color: var(--brand-ink); }
#navList .nav .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#navList .nav .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--surface); color: var(--text-3); border: 1px solid var(--line); }
#navList .nav .tag.pro { background: var(--warn-bg); color: var(--warn); border-color: var(--line-strong); }
#side .side-foot { border-top: 1px solid var(--line); padding: 9px 12px; font-size: 11.5px; color: var(--text-3); line-height: 1.65; user-select: text; }
#side .side-foot b { color: var(--text); font-weight: 600; }

/* ── 内容区：标签栏 + 页面 ─────────────────────────────────── */
#content { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; }
/* 标签栏外壳：中间是可横向滚动的标签条，两端是溢出时才出现的滚动按钮。
   为什么要外壳：标签多到一屏放不下时（例如同时开 10+ 个模块），原来只能靠
   overflow-x:auto 硬切——滚动条被 height:0 隐藏了，用户既看不出后面还有标签，
   也没有任何可见的滚动手段，只能碰运气用触控板横扫。 */
#tabwrap {
  display: flex; align-items: stretch; min-width: 0;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
#tabwrap .tabnav {
  flex: 0 0 24px; width: 24px; padding: 0; border: 0; background: transparent;
  display: none; align-items: center; justify-content: center;
  color: var(--text-2); transition: background var(--t-fast), color var(--t-fast);
}
#tabwrap.overflow .tabnav { display: flex; }
#tabwrap .tabnav:hover { background: var(--surface-3); color: var(--text); }
#tabwrap .tabnav[disabled] { opacity: .3; pointer-events: none; }
#tabwrap .tabnav svg { width: 14px; height: 14px; }
/* 两端箭头压住被切一半的标签，加一道内投影让“还有更多标签”这件事看得出来 */
#tabwrap #tabPrev { box-shadow: 8px 0 10px -8px rgba(12, 38, 66, .38); }
#tabwrap #tabNext { box-shadow: -8px 0 10px -8px rgba(12, 38, 66, .38); }
html[data-theme="dark"] #tabwrap #tabPrev,
html[data-theme="dark"] #tabwrap #tabNext { box-shadow: none; }
#tabbar {
  display: flex; align-items: flex-end; gap: 4px; height: 38px; padding: 5px 8px 0;
  flex: 1 1 auto; min-width: 0;
  overflow-x: auto; overflow-y: hidden;
  scroll-behavior: smooth;
}
#tabbar::-webkit-scrollbar { height: 0; }
#tabbar .tab {
  display: flex; align-items: center; gap: 7px; max-width: 230px; flex: 0 0 auto;
  height: 32px; padding: 0 8px 0 10px; font-size: 12.5px; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 8px 8px 0 0; position: relative;
}
#tabbar .tab .ic { width: 15px; height: 15px; flex: 0 0 15px; color: var(--brand-ink); }
#tabbar .tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tabbar .tab:hover { color: var(--text); background: var(--surface-3); }
#tabbar .tab.on { color: var(--text); background: var(--surface-3); font-weight: 600; box-shadow: inset 0 -2px 0 var(--brand-strong); }
#tabbar .tab .x { border: 0; background: transparent; color: inherit; padding: 1px; border-radius: 4px;
  opacity: 0; transition: opacity var(--t-fast); }
#tabbar .tab:hover .x, #tabbar .tab.on .x, #tabbar .tab:focus-visible .x { opacity: .6; }
#tabbar .tab .x:hover { background: var(--err-bg); color: var(--err); opacity: 1; }
#tabbar .tab .x svg { width: 12px; height: 12px; display: block; }
#tabbar .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: 0 0 6px; }
#tabbar .tab .dot.off { background: var(--text-3); }
#tabbar .tab-hint { color: var(--text-3); font-size: 12.5px; padding: 0 6px 8px; }

#panes { position: relative; min-height: 0; background: var(--surface); }
#panes .pane { position: absolute; inset: 0; display: none; }
#panes .pane.on { display: block; }
#panes .pane > .pane-body { position: absolute; inset: 0; overflow: auto; }
#panes iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
html[data-theme="dark"] #panes iframe { background: #10161d; }
#panes .frame-loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--surface); color: var(--text-3); font-size: 13px; }
#panes .frame-loading .bar { width: 190px; height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 10px; }
#panes .frame-loading .bar i { display: block; width: 40%; height: 100%; background: var(--brand-strong); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
/* 标签内嵌告警条（复用 desktop.html 的 showFrameAlert → .wm-alert 类名） */
.wm-alert { margin: 0; padding: 7px 12px; font-size: 12px; background: var(--warn-bg); color: var(--warn);
  border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.wm-alert.no { background: var(--err-bg); color: var(--err); }
.wm-alert a { color: inherit; font-weight: 600; text-decoration: underline; }
.wm-alert svg { width: 15px; height: 15px; flex: 0 0 15px; }
.pane-alert { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12.5px;
  background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--line); }
.pane-alert.err { background: var(--err-bg); color: var(--err); }
.pane-alert svg { width: 15px; height: 15px; flex: 0 0 15px; }
.pane-alert .grow { flex: 1 1 auto; }

/* ── 弹出菜单（菜单行/账号胶囊用；自包含，不依赖桌面版的右键菜单样式）── */
.popmenu {
  position: fixed; z-index: 8600; min-width: 208px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius);
  box-shadow: var(--shadow-pop); display: none;
}
.popmenu.open { display: block; }
.popmenu .it {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 9px;
  border-radius: var(--radius-sm); color: var(--text); font-size: 12.5px;
}
.popmenu .it:hover { background: var(--surface-3); }
.popmenu .it[disabled] { opacity: .45; pointer-events: none; }
.popmenu .it.danger { color: var(--err); }
.popmenu .it .ic { width: 15px; height: 15px; flex: 0 0 15px; color: var(--brand-ink); }
.popmenu .it.danger .ic { color: var(--err); }
.popmenu .it .lbl { flex: 1 1 auto; }
.popmenu .it .kb { color: var(--text-3); font-size: 11px; }
.popmenu .sep { height: 1px; margin: 5px 6px; background: var(--line); }

/* 原生面板（控制中心/SOP/诊断/设置/关于/演示）在标签里的内边距。
   max-width 之外还要居中：桌面窗口拉到 1700+ 时，内容原本死死贴在左边，
   右侧空出一大条 —— 居中后阅读宽度不变，但整块面板落在视觉中轴上。 */
#panes .wm-pane { padding: 14px 16px 22px; max-width: 1180px; margin: 0 auto; }

/* ── 状态栏 ───────────────────────────────────────────────── */
#statusbar {
  display: flex; align-items: center; gap: 14px; height: 27px; padding: 0 12px;
  background: var(--surface-2); border-top: 1px solid var(--line); color: var(--text-3); font-size: 11.5px;
}
#statusbar .st { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#statusbar .st b { color: var(--text); font-weight: 600; }
#statusbar .grow { flex: 1 1 auto; }
#statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
#statusbar .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
#statusbar .dot.err { background: var(--err); box-shadow: 0 0 0 3px var(--err-bg); }
#statusbar .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }

/* ── 账号胶囊 ─────────────────────────────────────────────── */
.userchip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12.5px; }
.userchip:hover { background: var(--surface-3); }
.userchip .av { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 21px;
  background: linear-gradient(135deg, var(--brand), var(--brand-strong)); color: var(--on-brand); font-size: 11px; font-weight: 700; }
.userchip .pl { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); }

/* ── 欢迎页（没有打开任何标签时）───────────────────────────── */
.welcome { padding: 26px 30px; max-width: 1000px; }
.welcome h2 { margin: 0 0 6px; font-size: 19px; }
.welcome p.lead { color: var(--text-3); margin: 0 0 18px; font-size: 13px; }
.welcome .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 10px; }
.welcome .card-link { display: flex; align-items: flex-start; gap: 10px; text-align: left; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow-soft); }
.welcome .card-link:hover { border-color: var(--brand-ring); }
.welcome .card-link .ic { width: 20px; height: 20px; color: var(--brand-ink); flex: 0 0 20px; margin-top: 1px; }
/* 标题与说明必须是块级：原来都是 <span>，两段文字会连成一行
   （“控制中心连接数字人、文本播报…”），margin-top 也失效 */
.welcome .card-link > span { display: block; min-width: 0; }
.welcome .card-link .t { display: block; font-size: 13px; font-weight: 600; }
.welcome .card-link .d { display: block; font-size: 11.5px; color: var(--text-3); line-height: 1.5; margin-top: 3px; }

/* ── 窄屏：导航变抽屉 ─────────────────────────────────────── */
/* 侧栏折叠按钮：宽屏和窄屏都要能看到（菜单里的同名项保留，作为快捷入口） */
#navToggle { display: inline-flex; color: var(--text-2); }
#navToggle:hover { color: var(--text); }
@media (max-width: 900px) {
  /* 关键：侧栏改成 position:fixed 之后就不在网格流里了，此时**必须只留一列**。
     原来写的是 grid-template-columns:0 1fr（两列），#content 会顶到宽度为 0 的第一列，
     实测窗口 900px 时 #content 宽度直接塌成 0，右边 900px 全是 body 的蓝底 —— 用户把
     窗口吸附成半屏（1920 屏一半是 960，1366 屏一半只有 683）就会看到这个残局。 */
  #body, html[data-nav="collapsed"] #body { grid-template-columns: 1fr; }
  #navToggle { display: inline-flex; }
  #side { position: fixed; z-index: 7000; top: 76px; bottom: 27px; left: 0; width: 252px;
    transform: translateX(-104%); transition: transform .2s ease; box-shadow: var(--shadow-pop); visibility: visible; }
  html[data-nav="open"] #side { transform: none; }
  /* 抽屉打开时内容区被盖住，给个可点的遮罩，点一下收起（原来只能再点一次汉堡） */
  html[data-nav="open"] #content::after {
    content: ''; position: fixed; inset: 76px 0 27px 0; z-index: 6500; background: rgba(12, 38, 66, .22);
  }
  #titlebar .brand small, #titlebar .crumb .sub, #menubar .kb { display: none; }
  #titlebar .btn-label { display: none; }
  #statusbar .hide-sm { display: none; }
  #panes .wm-pane { padding: 12px 12px 20px; }
  #tabbar .tab { max-width: 150px; }
  .tabs { overflow: auto; }
}
/* 服务端页面在窄屏/小窗口里的最小可用宽度 */
@media (max-width: 620px) {
  #titlebar { gap: 8px; }
  #panes iframe { min-width: 320px; }
  .welcome { padding: 18px 16px; }
}
/* ── 键盘可达性 ───────────────────────────────────────────────
   外壳控件原来没有任何焦点样式：用 Tab 键在导航里走一圈，光标在哪完全看不出来。
   只在键盘操作时显示焦点环（:focus-visible），鼠标点击不会出现多余描边。 */
#navList .nav:focus-visible,
#tabbar .tab:focus-visible,
#tabwrap .tabnav:focus-visible,
.app-btn:focus-visible,
.userchip:focus-visible,
#menubar .mi:focus-visible,
.popmenu .it:focus-visible,
#side input:focus-visible {
  outline: 2px solid var(--brand-ring); outline-offset: 1px;
}
#side input:focus { border-color: var(--brand-strong); }

/* 弹出菜单的锚点高亮（标签/账号胶囊用；菜单栏按钮仍用 .mi.on） */
.pop-anchor { background: var(--surface-3); }

/* ═══════════ 以下样式复用 desktop.html：通知/弹窗/控件/面板块 ═══════════ */
/* ═══════════════════════════ 8. 通知 / 弹窗 / 日历 ═══════════════════════════ */
#toasts{position:fixed;z-index:9000;right:14px;bottom:calc(var(--taskbar-h) + 14px);display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
html[data-taskbar="top"] #toasts{top:calc(var(--taskbar-h) + 14px);bottom:auto}
.toast{pointer-events:auto;width:min(340px,calc(100vw - 28px));display:flex;gap:10px;padding:11px 12px;border-radius:var(--radius);
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line-strong);box-shadow:var(--shadow-pop);
  animation:toastIn .2s cubic-bezier(.2,.8,.3,1);cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateX(18px);transition:all var(--t-base)}
.toast .ti{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.toast .ti svg{width:15px;height:15px}
.toast.ok .ti{background:var(--ok-bg);color:var(--ok)}
.toast.warn .ti{background:var(--warn-bg);color:var(--warn)}
.toast.err .ti{background:var(--err-bg);color:var(--err)}
.toast .tx{min-width:0}
.toast .tx b{display:block;font-size:12.5px;margin-bottom:1px}
.toast .tx p{margin:0;font-size:11.5px;color:var(--text-2);word-break:break-word}

#notifyPanel{position:fixed;z-index:8500;right:12px;bottom:calc(var(--taskbar-h) + 12px);width:min(370px,calc(100vw - 24px));max-height:min(520px,70vh);
  display:none;flex-direction:column;background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line-strong);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);overflow:hidden}
#notifyPanel.open{display:flex}
.np-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}
.np-head button{margin-left:auto;font-size:11.5px;color:var(--brand-deep)}
html[data-theme="dark"] .np-head button{color:var(--brand)}
#npList{overflow:auto;padding:8px}
.np-item{display:flex;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);align-items:flex-start}
.np-item:hover{background:var(--line)}
.np-item .ti{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.np-item .ti svg{width:13px;height:13px}
.np-item .tx{min-width:0;flex:1}
.np-item .tx b{font-size:12px;display:block}
.np-item .tx p{margin:1px 0 0;font-size:11.5px;color:var(--text-2);word-break:break-word}
.np-item .tm{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.np-empty{padding:22px 12px;text-align:center;color:var(--text-3);font-size:12px}

#calendarPop{position:fixed;z-index:8500;right:12px;bottom:calc(var(--taskbar-h) + 12px);width:272px;display:none;padding:12px;
  background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop)}
#calendarPop.open{display:block}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{font-size:13px}
.cal-head button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
.cal-head button:hover{background:var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.cal-grid .dow{color:var(--text-3);font-size:10.5px;padding:2px 0}
.cal-grid .d{padding:5px 0;border-radius:6px;color:var(--text-2);font-variant-numeric:tabular-nums}
.cal-grid .d.other{opacity:.35}
.cal-grid .d.today{background:var(--brand-strong);color:var(--on-brand);font-weight:700}
.cal-foot{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center;gap:8px}

#modalLayer{position:fixed;inset:0;z-index:9200;display:none;place-items:center;background:rgba(8,24,40,.34);backdrop-filter:blur(3px)}
#modalLayer.open{display:grid}
.modal{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--glass-solid);
  border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);animation:winIn .16s ease-out;overflow:hidden}
.modal header{padding:16px 18px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.modal header svg{width:17px;height:17px;color:var(--brand-deep)}
html[data-theme="dark"] .modal header svg{color:var(--brand)}
.modal .content{padding:6px 18px 14px;font-size:13px;color:var(--text-2);overflow:auto;user-select:text}
.modal .content p{margin:0 0 9px}
.modal .content code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.modal footer{padding:12px 16px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line);background:var(--surface-2)}
.modal input[type=text],.modal input[type=password],.modal textarea{width:100%;margin-top:4px}

/* ═══════════════════════════ 9. 通用控件 ═══════════════════════════ */
.btn{height:32px;padding:0 13px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line-strong);
  color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(180deg,var(--brand),var(--brand-strong));border-color:var(--brand-deep);color:var(--on-brand);font-weight:600;box-shadow:0 3px 10px var(--brand-ring)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;border-color:var(--line-strong)}
.btn.danger{background:var(--err-bg);border-color:var(--err);color:var(--err);font-weight:600}
.btn.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.loading{pointer-events:none;position:relative;color:transparent!important}
.btn.loading::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.ghost.loading::after,.btn:not(.primary).loading::after{border-color:var(--brand-ring);border-top-color:var(--brand-strong)}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{
  height:32px;padding:0 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line-strong);color:var(--text);outline:none;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea{height:auto;padding:9px 10px;resize:vertical;line-height:1.55;font-family:inherit;min-height:74px}
input:focus,select:focus,textarea:focus{border-color:var(--brand-strong);box-shadow:0 0 0 3px var(--brand-ring)}
label.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--brand-strong);width:15px;height:15px;cursor:pointer}
.switch{position:relative;width:38px;height:21px;border-radius:999px;background:var(--line-strong);transition:background var(--t-fast);flex:0 0 38px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform var(--t-fast);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--brand-strong)}
.switch.on::after{transform:translateX(17px)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:11.5px;color:var(--text-3)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.6}

/* 面板通用块：卡片 / 键值 / 徽标 / 表格 / 日志 */
.pane-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pane-head h2{margin:0;font-size:15px;font-weight:600}
.pane-head .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow-soft)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.card h3 svg{width:14px;height:14px;color:var(--brand-deep)}
html[data-theme="dark"] .card h3 svg{color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;align-items:center}
.kv dt{color:var(--text-3);white-space:nowrap}
.kv dd{margin:0;color:var(--text);word-break:break-word;user-select:text}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px}
.stat .lab{font-size:11px;color:var(--text-3);margin-bottom:4px}
.stat .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .val.sm{font-size:12.5px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-2)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.info{background:var(--info-bg);color:var(--info)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th,table.tbl td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{color:var(--text-3);font-weight:500;font-size:11.5px}
table.tbl tr:last-child td{border-bottom:0}
.chk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk-list li{display:flex;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);align-items:flex-start}
.chk-list li .m{width:17px;height:17px;flex:0 0 17px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-3)}
.chk-list li.pass .m{background:var(--ok-bg);color:var(--ok)}
.chk-list li.block .m{background:var(--err-bg);color:var(--err)}
.chk-list li.warn .m{background:var(--warn-bg);color:var(--warn)}
.chk-list li .t{min-width:0;flex:1}
.chk-list li .t b{font-size:12.5px;font-weight:500;display:block}
.chk-list li .t span{font-size:11.5px;color:var(--text-3)}
.log{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 11px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;user-select:text;color:var(--text-2)}
.log .er{color:var(--err)}.log .wa{color:var(--warn)}.log .ok{color:var(--ok)}
.progress{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-strong));border-radius:999px;transition:width var(--t-base)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--text-2)}
.seg button.on{background:var(--brand-strong);color:var(--on-brand);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 12px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand-strong);font-weight:600}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:46px;height:32px;border-radius:var(--radius-sm);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--brand-ring)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.wp-opt{border-radius:var(--radius-sm);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line-strong);height:58px;position:relative;overflow:hidden}
.wp-opt.on{border-color:var(--brand-strong);box-shadow:0 0 0 3px var(--brand-ring)}
.wp-opt span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;text-align:center;background:rgba(6,26,44,.5);color:#fff;padding:2px 0}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .info{flex:1;min-width:0}
.set-row .info b{display:block;font-size:12.5px;font-weight:500}
.set-row .info span{font-size:11.5px;color:var(--text-3)}
.empty{padding:26px 14px;text-align:center;color:var(--text-3);font-size:12.5px}
.banner{display:flex;gap:9px;align-items:center;padding:9px 12px;border-radius:var(--radius-sm);background:var(--info-bg);color:var(--info);font-size:12px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner svg{width:15px;height:15px;flex:0 0 15px}
.demo-stage{position:relative;width:100%;aspect-ratio:9/16;max-height:100%;background:
  radial-gradient(60% 40% at 50% 18%, #2b5876 0%, rgba(43,88,118,0) 70%), linear-gradient(180deg,#0e2233,#16394f);
  border-radius:var(--radius);overflow:hidden;display:grid;place-items:center}
.demo-stage canvas{width:100%;height:100%;display:block}

/* ═══════════════════════════ 10. 启动画面 ═══════════════════════════ */
#boot{position:fixed;inset:0;z-index:9500;background:linear-gradient(160deg,#0f2b40,#123a55 55%,#0a1f2e);
  display:grid;place-items:center;color:#dff1ff;transition:opacity .3s ease}
#boot.hide{opacity:0;pointer-events:none}
#boot .bx{width:min(400px,84vw);text-align:center}
#boot .mark{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-strong));color:var(--on-brand);box-shadow:0 12px 34px rgba(56,189,248,.34)}
#boot .mark svg{width:34px;height:34px}
#boot h1{margin:0 0 3px;font-size:17px;font-weight:600;letter-spacing:.3px}
#boot p{margin:0 0 18px;font-size:12px;color:#9dc4dd}
#boot .steps{text-align:left;font-size:12px;color:#a9cee4;display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-height:66px}
#boot .steps i{font-style:normal;color:#5ee0b0;margin-right:6px}
#boot .progress i{background:linear-gradient(90deg,var(--brand),#7ff0c8)}
#boot .foot{margin-top:10px;font-size:11px;color:#7ea6bf}


/* ═══════════ 外壳对复用样式的覆盖（必须放在最后）═══════════ */
/* ═══════════════════════════════════════════════════════════════════
   外壳对「复用样式」的覆盖（本文件必须放在 css_notify / css_controls 之后）
   -------------------------------------------------------------------
   复用的样式来自网页端 desktop.html，那里的底部坐标是按「任务栏 52px」算的：
       #toasts{bottom:calc(var(--taskbar-h) + 14px)}   → 66px
   桌面应用根本没有任务栏，底部只有 27px 状态栏，结果提示条悬在内容区中间，
   正好压住右下角的卡片。这里按状态栏高度重新贴边。
   ═══════════════════════════════════════════════════════════════════ */
#toasts { bottom: calc(27px + 10px); right: 12px; }
html[data-taskbar="top"] #toasts { top: auto; }

/* 提示条最多 3 条同时在场（新的在下）：再多会把内容区右下角整块盖住。
   toast() 内部只做「超过 4 条删最旧」，这里补一道显示上限，不改复用代码。 */
/* 最多两条同时在场：三条叠起来会把右下角的卡片整块盖住（截图复核时很明显） */
#toasts .toast:not(:nth-last-child(-n+2)) { display: none; }
#toasts .toast { width: min(300px, calc(100vw - 28px)); }

/* ═══════════════════════════════════════════════════════════════════
   深色主题补全
   -------------------------------------------------------------------
   原设计令牌只覆盖了 text / surface / line / 状态色，漏了「品牌浅色」这一组：
   --brand-soft(#e0f2fe) 与 --brand-deep(#0284c7) 在深色底下**不会反转** ——
   选中项、套餐徽标会变成一块浅蓝底配深蓝字，在深色界面里非常刺眼；导航图标
   用的又是 --brand-deep，压深色底上几乎看不清。

   这里补三件事：
   1. --brand-soft / --brand-tint 改成按当前主色与背景混出来的半透明色，
      既跟随主题深浅，也跟随“设置 → 主色”换色；
   2. 新增 --brand-ink：外壳里所有“品牌色文字/图标”都改用它，浅色主题取原
      --brand-deep，深色主题反向取亮色；
   3. color-mix 不被支持时（很旧的 WebView2）声明失效，自动退回原来的值，
      也就是维持现状，不会更糟。
   ═══════════════════════════════════════════════════════════════════ */
:root { --brand-ink: var(--brand-deep); }
html[data-theme="dark"] {
  --brand-soft: color-mix(in srgb, var(--brand) 18%, var(--surface));
  --brand-tint: color-mix(in srgb, var(--brand) 24%, transparent);
  --brand-ink: color-mix(in srgb, var(--brand) 55%, #ffffff);
}

/* ═══════════ 视觉精修层（只影响桌面外壳，网页端不受影响）═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   视觉精修层（polish）—— 只作用于桌面外壳 app.html
   ---------------------------------------------------------------------------
   为什么要单独一层：
   外壳骨架（part_layout.css）与业务面板样式（desktop.html 第 8/9 节复用）都已在
   真实服务上验证过，本文件只做「外观」覆盖，不改任何 DOM、类名与交互逻辑，
   因此网页端 desktop.html / common.css 完全不受影响。

   精修要点（对应 2026-10-26 的界面复核）：
   1. 分层：标题白 → 菜单/标签淡灰 → 内容区最淡 → 卡片纯白浮起，卡片不再和
      白底粘在一起（原来 #panes 也是 --surface，边界只剩 1px 线）。
   2. 顶部三条 chrome 收干净：菜单行与标签栏同底色连成一体，标签改胶囊式，
      选中态用「白底 + 阴影」而不是整条下划线。
   3. 左导航：选中项白底 + 左侧品牌竖条 + 轻阴影（凸起感），图标配淡品牌底。
   4. 内容：卡片圆角 12、柔影；统计格子统一高度，换行不再错位；
      小标题图标做成淡蓝圆角块，面板标题加大到 18px。
   5. 状态栏：项之间加细竖线，读起来是「一组一组」而不是一串字。
   6. 深色：内容底/卡片/描边全套重算，避免浅色块在深色界面里发白刺眼。
   7. 所有动效尊重 prefers-reduced-motion。
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 0. 精修用的局部令牌（不覆盖原设计令牌，避免影响复用样式）── */
:root {
  --canvas: #e8f0f8;
  --canvas-2: #dfe9f4;
  --chrome: #ffffff;
  --chrome-2: #f3f8fd;
  --card-line: rgba(15, 40, 70, .07);
  --card-shadow: 0 1px 2px rgba(12, 38, 66, .06), 0 16px 32px -22px rgba(12, 38, 66, .55);
  --card-shadow-hover: 0 2px 5px rgba(12, 38, 66, .07), 0 20px 38px -20px rgba(12, 38, 66, .5);
  --inset-hi: inset 0 1px 0 rgba(255, 255, 255, .7);
  --hairline: rgba(15, 40, 70, .09);
}
html[data-theme="dark"] {
  --canvas: #0c141d;
  --canvas-2: #101923;
  --chrome: #161f2a;
  --chrome-2: #131c26;
  --card-line: rgba(160, 196, 226, .12);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .38), 0 18px 34px -20px rgba(0, 0, 0, .78);
  --card-shadow-hover: 0 2px 6px rgba(0, 0, 0, .42), 0 22px 40px -18px rgba(0, 0, 0, .8);
  --inset-hi: inset 0 1px 0 rgba(255, 255, 255, .05);
  --hairline: rgba(160, 196, 226, .14);
}

/* ── 1. 窗口底与主体背景 ─────────────────────────────────────── */
body {
  background:
    radial-gradient(1200px 620px at 8% -12%, rgba(56, 189, 248, .16), transparent 62%),
    radial-gradient(900px 520px at 96% 4%, rgba(45, 212, 191, .10), transparent 60%),
    linear-gradient(180deg, var(--canvas) 0%, var(--canvas-2) 100%);
}
html[data-theme="dark"] body {
  background:
    radial-gradient(1200px 620px at 8% -12%, rgba(56, 189, 248, .10), transparent 62%),
    radial-gradient(900px 520px at 96% 4%, rgba(45, 212, 191, .06), transparent 60%),
    linear-gradient(180deg, var(--canvas) 0%, var(--canvas-2) 100%);
}

/* ── 2. 标题行：玻璃质感 + 品牌标的立体感 ─────────────────────── */
#titlebar {
  height: 46px;
  gap: 11px;
  /* 兜底在前：老 WebView2 不认 color-mix 时退回纯白，不会露出 body 的蓝底 */
  background: var(--chrome);
  box-shadow: var(--inset-hi);
  border-bottom: 1px solid var(--hairline);
  position: relative;
  z-index: 3;
}
@supports not (backdrop-filter: blur(1px)) { #titlebar { background: var(--chrome); } }
#titlebar::before {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brand-ring) 22%, transparent 62%);
  opacity: .5; pointer-events: none;
}
#titlebar .brand { font-size: 14.5px; letter-spacing: .2px; }
#titlebar .brand .logo {
  width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px;
  background: linear-gradient(150deg, var(--brand) 0%, var(--brand-strong) 62%, var(--brand-deep) 100%);
  box-shadow: 0 4px 12px -2px var(--brand-ring), inset 0 1px 0 rgba(255, 255, 255, .45);
}
#titlebar .brand .logo svg { width: 16px; height: 16px; }
#titlebar .brand small {
  font-size: 10px; letter-spacing: .4px; padding: 2px 7px; border-radius: 999px;
  background: transparent; border: 1px solid var(--line-strong); color: var(--text-3);
}
#titlebar .crumb h1 { font-size: 13.5px; font-weight: 600; color: var(--text); }
#titlebar .crumb .sub { font-size: 11.5px; color: var(--text-3); }
/* 面包屑与品牌之间一道细竖线，两段信息不再糊在一起 */
#titlebar .crumb::before {
  content: ''; width: 1px; height: 15px; margin-right: 3px; background: var(--line-strong); opacity: .7;
}

/* 标题行按钮统一为 9px 圆角，主按钮带内高光 */
#titlebar .app-btn { border-radius: 9px; height: 30px; }
#titlebar .app-btn:hover { background: var(--surface-3); border-color: var(--line-strong); }
#titlebar .app-btn.primary { box-shadow: 0 3px 10px -2px var(--brand-ring), inset 0 1px 0 rgba(255, 255, 255, .38); }
#titlebar .tb-chip, #titlebar .app-chip { height: 30px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
#titlebar .userchip { height: 30px; border-radius: 999px; padding: 0 6px 0 5px; gap: 7px; }
#titlebar .userchip .av { width: 22px; height: 22px; flex: 0 0 22px; font-size: 11px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
#titlebar .userchip .pl { margin-right: 3px; }

/* ── 3. 菜单行：与标签栏连成一条 chrome，弱化存在感 ───────────── */
/* 菜单行与标题行合并成一层白色 chrome：
   原来是「白标题 / 浅灰菜单 / 浅灰标签」三层，眼睛要跨三道横线才到内容。
   现在菜单行的背景与标题行一致、去掉上边框，只在底部留一条细线，
   视觉上就是"标题 + 菜单"一行，下面的标签栏才是第二层。 */
#menubar {
  height: 26px; gap: 1px; padding: 0 10px;
  background: var(--chrome);
  border-top: 0;
  border-bottom: 1px solid var(--hairline);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset;
}
#menubar .mi {
  padding: 3px 10px; border-radius: 7px; font-size: 12px; color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}
#menubar .mi:hover, #menubar .mi.on { background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--text); }
#menubar .kb { font-size: 11px; gap: 12px; opacity: .85; }
#menubar .kb kbd {
  background: var(--surface); border-color: var(--hairline); border-radius: 5px;
  box-shadow: 0 1px 0 var(--hairline); padding: 1px 5px; font-size: 10.5px;
}

/* ── 4. 左导航 ──────────────────────────────────────────────── */
#side {
  background: var(--chrome-2);
  background: linear-gradient(180deg, var(--chrome-2) 0%, color-mix(in srgb, var(--chrome-2) 72%, var(--canvas)) 100%);
  border-right: 1px solid var(--hairline);
}
#side .side-head { padding: 10px 10px 6px; }
#side input {
  height: 32px; border-radius: 9px; font-size: 12.5px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border-color: var(--hairline);
  box-shadow: inset 0 1px 2px rgba(12, 38, 66, .04);
  transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
#side input:hover { background: var(--surface); }
#side input:focus { background: var(--surface); box-shadow: 0 0 0 3px var(--brand-ring); }
#navList { padding: 2px 8px 12px; }
#navList .grp {
  font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; color: var(--text-3);
  padding: 12px 9px 5px; text-transform: none;
}
#navList .grp:first-child { padding-top: 6px; }
/* 导航项：单行「图标 + 名字」，32px。不做两行说明 ——
   17 个模块每个挂一句说明，侧栏就成了密密麻麻的清单，扫起来更慢。
   模块说明改由顶部说明条（当前模块）与 hover 提示承担。 */
#navList .nav {
  position: relative; height: 32px; padding: 0 9px; gap: 9px; align-items: center;
  border-radius: 8px; border: 1px solid transparent; font-size: 13px; color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
}
#navList .nav .ic { width: 16px; height: 16px; flex: 0 0 16px; color: var(--text-3); margin-top: 0; transition: color var(--t-fast); }
#navList .nav .nm { flex: 1 1 auto; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#navList .nav .tag { flex: 0 0 auto; white-space: nowrap; }
#navList .nav .tag.open-dot {
  position: absolute; right: 10px; top: 50%; margin-top: -4px;
  width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 0 2px var(--ok-bg);
}
/* 已打开时给名字让出右侧 16px，避免压在绿点上 */
#navList .nav:has(.open-dot) .nm { padding-right: 14px; }
#navList .grp { padding: 9px 9px 4px; }
#navList .nav:hover { background: color-mix(in srgb, var(--surface) 78%, transparent); color: var(--text); }
#navList .nav:hover .ic { color: var(--brand-ink); }
/* 选中：白底浮起 + 左侧品牌竖条（凸起感比“浅蓝块”更像原生软件） */
#navList .nav.on {
  background: var(--surface);
  border-color: var(--card-line);
  color: var(--brand-ink);
  font-weight: 650;
  box-shadow: 0 1px 2px rgba(12, 38, 66, .06), 0 6px 14px -10px rgba(12, 38, 66, .4);
}
#navList .nav.on .ic { color: var(--brand-ink); }
#navList .nav.on::before {
  content: ''; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 3px;
  border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--brand), var(--brand-strong));
}
#navList .nav .tag { font-size: 10px; padding: 1px 6px; background: transparent; }
#navList .nav .tag.pro { background: var(--warn-bg); border-color: transparent; }
/* 侧栏底部压成一行（服务地址 · 账号），与底部状态栏不重复 */
#side .side-foot {
  background: transparent;
  border-top: 1px solid var(--hairline);
  padding: 8px 13px; font-size: 10.5px; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── 5. 标签栏：胶囊式标签 ─────────────────────────────────── */
#tabwrap {
  background: var(--chrome-2);
  border-bottom: 1px solid var(--hairline);
  box-shadow: 0 6px 12px -12px rgba(12, 38, 66, .5);
}
#tabbar { height: 38px; padding: 5px 10px; gap: 5px; align-items: center; }
#tabbar .tab {
  height: 28px; padding: 0 9px 0 11px; gap: 7px; max-width: 220px;
  border-radius: 999px; border: 1px solid transparent; background: transparent;
  color: var(--text-2); font-size: 12.5px;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
}
#tabbar .tab .ic { width: 14px; height: 14px; flex: 0 0 14px; color: var(--text-3); }
#tabbar .tab:hover { background: color-mix(in srgb, var(--surface) 72%, transparent); color: var(--text); }
#tabbar .tab:hover .ic { color: var(--brand-ink); }
#tabbar .tab.on {
  background: var(--surface); border-color: var(--card-line); color: var(--text);
  font-weight: 650; box-shadow: 0 1px 2px rgba(12, 38, 66, .06), 0 4px 10px -6px rgba(12, 38, 66, .35);
}
#tabbar .tab.on .ic { color: var(--brand-ink); }
#tabbar .tab.on::after {
  content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px;
  border-radius: 2px; background: linear-gradient(90deg, var(--brand), var(--brand-strong));
}
#tabbar .tab .x:hover { background: var(--err-bg); color: var(--err); }
#tabwrap .tabnav { color: var(--text-3); }
#tabwrap .tabnav:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }

/* ── 6. 内容区与卡片 ───────────────────────────────────────── */
#panes { background: var(--canvas); }
#panes > .pane.on { animation: paneIn .16s ease-out both; }
@keyframes paneIn { from { opacity: .55; } to { opacity: 1; } }

#panes .wm-pane { padding: 20px 24px 30px; max-width: 1240px; }
/* 页面标题左侧加一道品牌竖条：面板没有卡片包裹，标题悬在空中会显得“没有根”，
   竖条给了它一个锚点，也让整页的视觉重心落在左上角。 */
#panes .pane-head { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
#panes .pane-head h2 {
  position: relative; padding-left: 12px;
  font-size: 18px; font-weight: 650; letter-spacing: -.2px;
}
#panes .pane-head h2::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px;
  border-radius: 3px; background: linear-gradient(180deg, var(--brand), var(--brand-strong));
}

#panes .card {
  background: var(--surface);
  border: 1px solid var(--card-line);
  border-radius: 12px;
  padding: 15px 17px;
  box-shadow: var(--card-shadow);
}
#panes .card + .card { margin-top: 16px; }
#panes .card h3 {
  margin: 0 0 12px; font-size: 13.5px; font-weight: 650; color: var(--text); gap: 9px;
  letter-spacing: .1px;
}
/* 小标题图标：淡蓝圆角块，比裸线条图标更有“卡片头”的样子 */
#panes .card h3 > svg {
  width: 15px; height: 15px; padding: 3px; box-sizing: content-box;
  border-radius: 7px; background: var(--brand-soft); color: var(--brand-ink) !important;
}
#panes .grid2 { gap: 16px; }
#panes .card .hint { color: var(--text-3); }

/* 统计格：统一最小高度，两行文字的格子不再把邻居顶歪。
   2026-10-26 二次调整：**不再给它外套一层白卡** —— 面板标题 → 白卡 → 格子
   是三层嵌套，视觉上"框套框"。现在每个格子自己就是一张小卡，直接摆在画布上，
   少一层边框，也宽出约 20px（原来被外层 padding 吃掉）。 */
#panes .wm-pane > .stats {
  background: none; border: 0; border-radius: 0; padding: 0;
  margin-bottom: 18px; box-shadow: none;
}
#panes .stats { gap: 12px; align-items: stretch; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); }
#panes .stat {
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  min-height: 64px; padding: 10px 13px; border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--card-line);
  box-shadow: 0 1px 2px rgba(12, 38, 66, .05), 0 10px 22px -18px rgba(12, 38, 66, .42);
}
#panes .stat .lab { font-size: 11px; color: var(--text-3); letter-spacing: .2px; }
#panes .stat .val { font-size: 15px; font-weight: 650; letter-spacing: -.1px; }
#panes .stat .val.sm { font-size: 12px; font-weight: 500; line-height: 1.4; }

/* 按钮：主按钮轻微内高光，危险按钮用描边强调 */
#panes .btn { border-radius: 9px; }
#panes .btn.primary {
  box-shadow: 0 3px 10px -3px var(--brand-ring), inset 0 1px 0 rgba(255, 255, 255, .35);
}
#panes .btn.danger, #panes .btn.warn { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }
#panes .btn:hover { border-color: var(--line-strong); }

/* 输入控件统一圆角与聚焦环 */
#panes input[type=text], #panes input[type=password], #panes input[type=number],
#panes input[type=search], #panes select, #panes textarea { border-radius: 9px; }

/* 设置页：整行可感知，hover 有一层极淡的品牌底 */
#panes .set-row { padding: 12px 10px; border-radius: 9px; border-bottom-color: var(--hairline); }
#panes .set-row:hover { background: color-mix(in srgb, var(--brand) 6%, transparent); }
#panes .set-row .info b { font-size: 12.5px; font-weight: 600; }

/* 分段控件 / 标签页 */
#panes .seg { background: color-mix(in srgb, var(--surface-2) 80%, var(--surface)); }
#panes .seg button.on { box-shadow: 0 2px 6px -3px var(--brand-ring); }
#panes .tabs { border-bottom-color: var(--hairline); gap: 6px; }
#panes .tabs button { border-radius: 8px 8px 0 0; transition: color var(--t-fast), background var(--t-fast); }
#panes .tabs button:hover { color: var(--text); background: color-mix(in srgb, var(--brand) 6%, transparent); }

/* 表格：表头淡底、行悬停高亮、去掉最外圈竖线 */
#panes table.tbl { border-radius: 9px; overflow: hidden; }
#panes table.tbl th {
  background: var(--surface-2); color: var(--text-2); font-weight: 600;
  border-bottom: 1px solid var(--hairline);
}
#panes table.tbl tbody tr { transition: background var(--t-fast); }
#panes table.tbl tbody tr:hover { background: color-mix(in srgb, var(--brand) 5%, transparent); }
#panes table.tbl td { border-bottom-color: var(--hairline); }

/* 日志框 / 键值 / 徽标 */
#panes .log {
  border-radius: 10px; border-color: var(--card-line); background: var(--surface-2);
  box-shadow: inset 0 1px 2px rgba(12, 38, 66, .04); line-height: 1.65;
}
#panes .badge { font-weight: 650; letter-spacing: .1px; }
#panes .banner { border-radius: 10px; border: 1px solid color-mix(in srgb, var(--info) 22%, transparent); }
#panes .banner.warn { border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
#panes .chk-list li { background: var(--surface-2); border-color: var(--card-line); border-radius: 9px; }
#panes .empty { color: var(--text-3); }

/* 欢迎页：图标做成色块，卡片 hover 微抬升 */
#panes .welcome { padding: 28px 32px; max-width: 1120px; margin: 0 auto; }
#panes .welcome h2 { font-size: 21px; font-weight: 650; letter-spacing: -.3px; }
#panes .welcome p.lead { font-size: 13px; margin-bottom: 20px; }
#panes .welcome .grid { gap: 12px; }
#panes .welcome .card-link {
  border-radius: 12px; padding: 13px 14px; border-color: var(--card-line);
  box-shadow: var(--card-shadow);
  transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
}
#panes .welcome .card-link:hover {
  transform: translateY(-2px); box-shadow: var(--card-shadow-hover);
  border-color: color-mix(in srgb, var(--brand) 40%, var(--card-line));
}
#panes .welcome .card-link .ic {
  width: 32px; height: 32px; flex: 0 0 32px; padding: 7px; box-sizing: border-box;
  border-radius: 10px; background: var(--brand-soft); color: var(--brand-ink) !important;
}
#panes .welcome .card-link .t { font-size: 13px; font-weight: 650; }

/* ── 7. 状态栏：分组竖线 ───────────────────────────────────── */
#statusbar {
  height: 28px; gap: 0; padding: 0 8px 0 4px;
  background: var(--chrome-2); border-top: 1px solid var(--hairline);
  font-size: 12px;
}
#statusbar .st { padding: 0 11px; position: relative; height: 100%; }
#statusbar .st + .st::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 1px; height: 11px; background: var(--line-strong); opacity: .55;
}
#statusbar .st b { font-variant-numeric: tabular-nums; }
#statusbar .dot { transition: background var(--t-base), box-shadow var(--t-base); }

/* ── 8. 弹出菜单 / 通知中心：与卡片同一套圆角和阴影 ─────────── */
.popmenu { border-radius: 12px; padding: 7px; border-color: var(--card-line); }
.popmenu .it { border-radius: 8px; }
.popmenu .it:hover { background: color-mix(in srgb, var(--brand) 9%, transparent); }
#notifyPanel { border-color: var(--card-line); }
.np-item { border-radius: 9px; }
.np-item:hover { background: color-mix(in srgb, var(--brand) 7%, transparent); }
#toasts .toast { border-radius: 11px; }

/* ── 9. 滚动条：更细、更淡，不抢视线 ───────────────────────── */
#navList::-webkit-scrollbar, #panes .pane-body::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-3) 34%, transparent); }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-3) 55%, transparent); }

/* ── 10. 窄屏抽屉适配（顶栏高度变了，抽屉起点跟着变）───────── */
@media (max-width: 900px) {
  #side { top: 72px; bottom: 28px; }
  #panes .wm-pane { padding: 14px 14px 22px; }
  html[data-nav="open"] #content::after { inset: 72px 0 28px 0; }
}

/* ── 11. 减少动效偏好 ──────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  #panes > .pane.on { animation: none; }
  #navList .nav, #tabbar .tab, #panes .welcome .card-link { transition: none; }
  #panes .welcome .card-link:hover { transform: none; }
}

/* ── 12. 启动遮罩（#boot）：与桌面版开机动画 splash.html 同一套语言 ────
   两道启动画面连着放：exe 的 splash.html（窗口级，带完整开机动画）→
   这里（界面首屏渲染完之前，通常只有几百毫秒）。原来这一屏是静态的深蓝卡片，
   从动画切过来会像"又启动了一次"；补上同一套光环/呼吸/流光之后，观感是
   同一段动画在继续。
   只覆盖外观，DOM 与 #boot.hide 的淡出逻辑一行未改。 */
#boot {
  background:
    radial-gradient(72% 56% at 50% 26%, rgba(56, 189, 248, .16), rgba(56, 189, 248, 0) 68%),
    radial-gradient(46% 38% at 12% 92%, rgba(45, 212, 191, .10), rgba(45, 212, 191, 0) 70%),
    linear-gradient(165deg, #0b2233 0%, #0f2b40 44%, #0a1f2e 100%);
}
#boot .bx { width: min(400px, 84vw); text-align: center; }
#boot .mark {
  position: relative; width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 21px;
  background: linear-gradient(150deg, #7dd3fc 0%, var(--brand) 42%, var(--brand-strong) 100%);
  animation: bootMarkIn .7s cubic-bezier(.2, .85, .25, 1) both,
             bootGlow 3.6s .7s ease-in-out infinite;
}
/* 呼吸只用 box-shadow 做，不额外加一层 z-index:-1 的伪元素 ——
   transform 动画结束后会丢 stacking context，那层光晕会瞬间消失。 */
@keyframes bootGlow {
  0%, 100% { box-shadow: 0 18px 44px -14px rgba(56, 189, 248, .5), inset 0 1px 0 rgba(255, 255, 255, .5) }
  50% { box-shadow: 0 18px 62px -10px rgba(56, 189, 248, .9), inset 0 1px 0 rgba(255, 255, 255, .5) }
}
#boot .mark::after {
  content: ''; position: absolute; inset: -11px; border-radius: 50%;
  border: 1px solid rgba(56, 189, 248, .18); border-top-color: rgba(56, 189, 248, .7);
  animation: bootSpin 3.2s linear infinite;
}
@keyframes bootMarkIn { from { opacity: 0; transform: scale(.82) } to { opacity: 1; transform: none } }
@keyframes bootSpin { to { transform: rotate(360deg) } }
#boot h1 { font-size: 18px; font-weight: 500; letter-spacing: .18em; animation: bootFadeUp .7s .1s both; }
#boot p { animation: bootFadeUp .7s .18s both; }
#boot .steps { animation: bootFadeUp .7s .26s both; }
#boot .progress i {
  background: linear-gradient(90deg, var(--brand), #7ff0c8);
  box-shadow: 0 0 12px rgba(56, 189, 248, .45);
}
@keyframes bootFadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) {
  #boot .mark, #boot .mark::after, #boot h1, #boot p, #boot .steps { animation: none; }
}

/* ── 13. 模块说明条（iframe 模块专用）────────────────────────
   去掉被嵌页面的大标题后，界面只剩"标签名 + 一堆卡片"，用户不知道这个模块
   负责什么、从哪里开始。说明条用一句话回答"这里能做什么"，右侧收一个
   "重新载入本页"（页面内导航卡住时的唯一出口）。
   原生面板不挂这条 —— 它们自带 pane-head 大标题。 */
#panes .pane > .pane-body.has-bar { display: flex; flex-direction: column; overflow: hidden; }
#panes .pane-bar {
  flex: 0 0 40px; display: flex; align-items: center; gap: 9px;
  padding: 0 12px 0 14px; background: var(--canvas);
  border-bottom: 1px solid var(--hairline); position: relative; z-index: 2;
}
#panes .pane-bar .ic {
  width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px;
  display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink);
}
#panes .pane-bar .ic svg { width: 14px; height: 14px; }
#panes .pane-bar .tx {
  flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#panes .pane-bar-btn {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 7px;
  display: grid; place-items: center; color: var(--text-3);
  border: 1px solid transparent; background: transparent;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
#panes .pane-bar-btn:hover { background: var(--surface); border-color: var(--line-strong); color: var(--text); }
#panes .pane-bar-btn svg { width: 14px; height: 14px; }
#panes .pane-body.has-bar > iframe { flex: 1 1 auto; height: auto; min-height: 0; }
#panes .pane-body.has-bar > .frame-loading { top: 40px; }
/* 标签内嵌告警条出现时也要让位（插在 iframe 之前） */
#panes .pane-body.has-bar > .wm-alert { flex: 0 0 auto; }

/* 标题栏里的"模块名 + 一句话说明"整块去掉：
   模块名标签栏已经写了，说明文字现在由 iframe 模块的说明条承担 ——
   三处说同一件事最费解。标题栏留给品牌、运行模式、工具和账号。 */
#titlebar .crumb { display: none; }
/* 说明条压到 36px：标题 46 + 菜单 26 + 标签 38 + 说明 36 = 146px 的 chrome，
   再高就吃掉内容了（原来没有说明条时是 128px）。 */
#panes .pane-bar { flex: 0 0 32px; padding: 0 8px 0 12px; gap: 8px; }
#panes .pane-bar .ic { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px; }
#panes .pane-bar .ic svg { width: 13px; height: 13px; }
#panes .pane-body.has-bar > .frame-loading { top: 32px; }

/* ── 14. 侧栏加宽 236 → 256 ─────────────────────────────────────
   导航项现在是"名字 + 一句话说明"，236px 里说明只能露 8~10 个字，
   加宽 20px 正好多两个字；内容区少 20px 对卡片布局没有影响。
   折叠态（data-nav="collapsed"）必须显式写回 0，否则会被上面这条盖住。 */
#body { grid-template-columns: 240px 1fr; }
html[data-nav="collapsed"] #body { grid-template-columns: 0 1fr; }
/* 窄屏必须显式写回单列：part_layout.css 的 @media 里本来是 grid-template-columns:1fr，
   但上面的规则写在更后面、同优先级，会把那条盖掉 —— 侧栏改 fixed 抽屉之后第一列空占
   240px，内容区被挤到右边只剩一小条（900px 窗口实测过，右侧整片空白）。 */
@media (max-width: 900px) {
  #body, html[data-nav="collapsed"] #body { grid-template-columns: 1fr; }
  #side { width: 252px; }
}

/* 中等/窄窗口下统计格改成「4 列 × 2 行」：
   auto-fit + minmax(132px) 在 900px 窗口里会排成 6+2，第二排只有两个格子、
   还因为文字换行被撑得更高，整块参差不齐。4 列固定后 8 个格子永远两排对齐。 */
@media (max-width: 1180px) {
  #panes .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  #panes .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
/** 创建元素：el('div',{class:'x',text:'y'},child1,child2) */
function el(tag, props, ...kids){
  const node = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v === null || v === undefined || v === false) continue;
    if(k === 'class') node.className = v;
    else if(k === 'text') node.textContent = v;
    else if(k === 'html') node.innerHTML = v;
    else if(k === 'style') node.setAttribute('style', v);
    else if(k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if(k === 'dataset') for(const d in v) node.dataset[d] = v[d];
    else node.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(ch => { if(ch === null || ch === undefined || ch === false) return;
    node.appendChild(typeof ch === 'string' ? document.createTextNode(ch) : ch); });
  return node;
}
/** HTML 转义（所有来自接口/用户的文本都必须先转义） */
function esc(s){ return String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtTime(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtDate(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日 周' + '日一二三四五六'[d.getDay()]; }
function fmtDT(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function fmtAgo(ts){
  if(!ts) return '—';
  const d = new Date(ts); if(isNaN(d)) return '—';
  const diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 60) return Math.max(1, Math.round(diff)) + ' 秒前';
  if(diff < 3600) return Math.round(diff/60) + ' 分钟前';
  if(diff < 86400) return Math.round(diff/3600) + ' 小时前';
  return fmtDT(d).slice(0,5);
}

/** 统一请求：/api/live/* 返回 {code,msg,data}；/api/workflow/* 直接返回对象 */
async function request(path, opt){
  const res = await fetch(path, Object.assign({credentials:'same-origin', headers:{'Content-Type':'application/json'}}, opt || {}));
  if(res.status === 401) { const e = new Error('请先登录'); e.code = 401; throw e; }
  const text = await res.text();
  let json = null; try{ json = text ? JSON.parse(text) : null; }catch(e){ json = null; }
  if(!res.ok){
    const e = new Error((json && (json.msg || json.error || json.detail)) || ('HTTP ' + res.status));
    e.code = res.status; e.feature = json && json.feature; e.upgrade_url = json && json.upgrade_url;
    throw e;
  }
  if(json && typeof json === 'object' && 'code' in json){
    if(json.code !== 0){ const e = new Error(json.msg || '接口返回失败'); e.code = json.code === -1 ? 400 : json.code; e.feature = json.feature; throw e; }
    return json.data === undefined ? json : json.data;
  }
  return json;
}

const NOTES = [];
function toast(type, title, text, ms){
  if(!S.toasts) return;
  const box = $('#toasts');
  const ic = type === 'ok' ? 'check' : type === 'warn' ? 'alert' : type === 'err' ? 'alert' : 'info';
  const t = el('div', {class:'toast ' + (type || 'info'), role:'status'},
    el('div', {class:'ti', html:svgIcon(ic)}),
    el('div', {class:'tx'}, el('b', {text:title}), text ? el('p', {text:text}) : null));
  box.appendChild(t);
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 240); };
  t.addEventListener('click', kill);
  setTimeout(kill, ms || S.toastMs);
  while(box.children.length > 4) box.firstChild.remove();
}

function notify(type, title, text, silent){

}

let ST = null;
let POLL = null, pollMs = 0;
const PREV = {};
/** 探测真实状态变化并推送桌面通知（只在 live 模式做） */
function detectChanges(s){
  if(!s) return;
  const watch = [
    ['output_connected', v => notify(v ? 'ok' : 'warn', v ? '数字人已连接' : '数字人已断开',
      v ? '输出窗口已完成 WebRTC 连接，可以开始播报。' : '直播输出窗口已关闭或断开，请在“数字人直播画面”窗口重新连接。')],
    ['recording', v => notify(v ? 'ok' : 'info', v ? '已开始录制' : '录制已停止', v ? '直播画面正在录制并保存。' : '录制文件已保存到服务器的 record 目录。')],
    ['autopilot', v => notify(v ? 'ok' : 'info', v ? '自动话术已启动' : '自动话术已暂停', v ? '数字人会按话术队列自动讲解并随机化间隔。' : '自动播报已停止，安全操作不受套餐限制。')],
    ['live_state', v => { const names = {idle:'待机', preparing:'准备中', ready:'就绪', rehearsal:'彩排中', live:'直播中', stopping:'停播中', ended:'已结束'};
      notify(v === 'live' ? 'ok' : (v === 'ended' ? 'info' : 'info'), '直播状态：' + (names[v] || v), '状态机已从「' + (names[PREV.live_state] || PREV.live_state || '未知') + '」切换。'); }]
  ];
  watch.forEach(([key, fn]) => {
    const cur = s[key];
    if(PREV[key] !== undefined && PREV[key] !== cur){ try{ fn(cur); }catch(e){} }
    PREV[key] = cur;
  });
}
/** 拉取一次状态，并推送给所有已打开的原生面板 */
async function refreshStatus(manual){
  try{
    ST = await Data.status();
    if(MODE === 'live' && !manual) detectChanges(ST);
    WM.wins.forEach(w => { if(w.onStatus){ try{ w.onStatus(ST); }catch(e){ console.warn('面板刷新失败', e); } } });
    updateModeChip();
    if(manual) toast('ok', '状态已刷新', '已重新读取服务端运行状态');
    return ST;
  }catch(e){
    if(manual) apiFail(e, '刷新状态');
    if(MODE === 'live'){ $('#modeChip').className = 'tb-chip err'; $('#modeText').textContent = '服务离线'; }
    throw e;
  }
}
function startPolling(){
  if(POLL) clearInterval(POLL);
  pollMs = Math.max(2000, Number(S.pollMs) || 4000);
  POLL = setInterval(() => { if(!document.hidden) refreshStatus(false).catch(() => {}); }, pollMs);
}
