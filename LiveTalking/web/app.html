      ['大模型', (s.llm && s.llm.label ? s.llm.label : '未配置') + (s.llm && s.llm.api_key_configured ? ' · Key 已配置' : ' · Key 未配置'), !!(s.llm && s.llm.api_key_configured)],
      ['累计播报', (s.stats ? s.stats.scripts_played : 0) + ' 段 · 人工介入 ' + (s.stats ? s.stats.manual_interventions : 0) + ' 次', true]
    ].map(([lab, val, ok]) => '<div class="stat"><div class="lab">' + esc(lab) + '</div><div class="val sm">' +
      (ok ? '<span class="badge ok" style="margin-right:6px">●</span>' : '<span class="badge" style="margin-right:6px">○</span>') + esc(val) + '</div></div>').join('');
    refs.last.innerHTML = [
      ['最后播报', s.last_spoken_text || '—'], ['最后应答', s.last_reply || '—'],
      ['话术条数', (s.scripts || []).length + ' 条'], ['循环间隔', (s.gap_target_seconds || 0) + ' 秒'],
      ['直播开始', s.live_started_at ? new Date(s.live_started_at * 1000).toLocaleString('zh-CN') : '—'],
      ['连接时间', s.output_registered_at ? new Date(s.output_registered_at * 1000).toLocaleString('zh-CN') : '—']
    ].map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('');
    const his = s.history || [];
    refs.history.innerHTML = his.length
      ? his.slice(0, 12).map(h => '<span class="' + (h.status === 'error' ? 'er' : '') + '">' + esc(fmtDT(new Date((h.time || 0) * 1000))) + ' [' + esc(h.type || '') + '] ' + esc(h.text || '') + '</span>').join('\n')
      : '暂无操作记录。';
    refs.autoBtn.querySelector('span').textContent = s.autopilot ? '自动话术运行中' : '启动自动话术';
    refs.rec.querySelector('span').textContent = s.recording ? '停止录制' : '开始录制';
    refs.speakMsg.textContent = s.output_connected
      ? '输出窗口已连接，提交后会推送给数字人播报。'
      : '数字人输出窗口未连接：请先点右上角「打开并连接直播画面」，在画面窗口里点「启动直播画面」。';
  }
  win.onStatus = render;
  if(ST) render(ST);

  /* —— 交互：每个按钮都调用真实接口（demo 模式走本地演示数据层） —— */
  const acts = {
    ctRefresh:async b => { busy(b, true); try{ await refreshStatus(true); }catch(e){} finally{ busy(b, false); } },
    ctOpenStage:() => { openApp('stage'); setTimeout(() => toast('info', '请在画面窗口点击「启动直播画面」', '该按钮会建立 WebRTC 连接并把输出窗口登记到工作台。'), 600); },
    ctSpeakTest:async b => { busy(b, true); try{ await Data.speak('这是一段测试话术：画面、声音和口型检查正常，请值守人员确认后再正式开播。', 'echo', false);
      toast('ok', '测试话术已提交', '请观察直播画面是否开始播报'); await refreshStatus(false); }catch(e){ apiFail(e, '播报'); } finally{ busy(b, false); } },
    ctInterrupt:async b => { busy(b, true); try{ await Data.interrupt(); toast('ok', '已打断播报', '安全操作不受套餐限制'); await refreshStatus(false); }catch(e){ apiFail(e, '打断'); } finally{ busy(b, false); } },
    ctAuto:async b => { busy(b, true); try{ const on = !(ST && ST.autopilot); await Data.autopilot(on); toast('ok', on ? '自动话术已启动' : '自动话术已暂停', on ? '注意保持真人值守并可随时接管' : ''); await refreshStatus(false); }catch(e){ apiFail(e, '自动话术'); } finally{ busy(b, false); } },
    ctAutoStop:async b => { busy(b, true); try{ await Data.autopilot(false); toast('ok', '自动话术已暂停', ''); await refreshStatus(false); }catch(e){ apiFail(e, '自动话术'); } finally{ busy(b, false); } },
    ctRec:async b => { busy(b, true); try{ const stop = !!(ST && ST.recording); await Data.recording(stop ? 'stop' : 'start');
      toast('ok', stop ? '录制已停止' : '已开始录制', stop ? '录制文件已保存' : '录制中请确认磁盘空间充足'); await refreshStatus(false); }catch(e){ apiFail(e, '录制'); } finally{ busy(b, false); } },
    ctEmergency:async b => { confirmBox('紧急停止', '将立即停止自动话术、字幕回应并打断当前播报。确定执行吗？', async () => {
      busy(b, true); try{ await Data.emergencyStop(); notify('warn', '已执行紧急停止', '自动话术与字幕回应已关闭，当前播报已打断。'); await refreshStatus(false); }
      catch(e){ apiFail(e, '紧急停止'); } finally{ busy(b, false); } }, true); },
    ctSend:async b => {
      const text = refs.text.value.trim(); if(!text){ toast('warn', '请输入文本', '文本为空时不会提交'); return; }
      busy(b, true);
      try{ await Data.speak(text, $('#ctMode', pane).value, $('#ctBreak', pane).checked);
        toast('ok', '已提交播报', '共 ' + text.split(/\r?\n/).filter(Boolean).length + ' 句'); refs.text.value = ''; await refreshStatus(false);
      }catch(e){ apiFail(e, '播报'); } finally{ busy(b, false); }
    },
    ctSimRun:async b => {
      const text = $('#ctSimText', pane).value.trim(); if(!text){ toast('warn', '请输入一句评论', '例如：这个多少钱？'); return; }
      busy(b, true); refs.simOut.innerHTML = '<div class="hint">判定中…</div>';
      try{
        const r = await Data.simulate(text, refs.simSpeak.checked);
        refs.simOut.innerHTML =
          '<div class="card" style="box-shadow:none;background:var(--surface-2)">' +
          '<div class="row" style="margin-bottom:8px"><span class="badge info">' + esc(r.route_label || '未判定') + '</span>' +
          (r.intent_label ? '<span class="badge">意图：' + esc(r.intent_label) + '</span>' : '') +
          (r.keyword ? '<span class="badge">命中词：' + esc(r.keyword) + '</span>' : '') +
          '<span class="badge ' + (r.offline_ready ? 'ok' : 'warn') + '">' + (r.offline_ready ? '断网可播' : '需联网/大模型') + '</span>' +
          '<span class="badge">' + esc(r.elapsed_ms) + ' ms</span>' +
          '<span class="badge ' + (r.spoken ? 'ok' : '') + '">' + (r.spoken ? '已播报' : '仅判定未播报') + '</span></div>' +
          '<dl class="kv"><dt>输入</dt><dd>' + esc(r.input) + '</dd>' +
          '<dt>将播报</dt><dd>' + esc(r.response || '（无应答文本）') + '</dd>' +
          (r.product ? '<dt>当前商品</dt><dd>' + esc(r.product) + '</dd>' : '') +
          (r.note ? '<dt>说明</dt><dd>' + esc(r.note) + '</dd>' : '') + '</dl></div>';
        await refreshStatus(false);
      }catch(e){ refs.simOut.innerHTML = '<div class="banner warn">' + svgIcon('alert') + '<span>判定失败：' + esc(e.message) + '</span></div>'; }
      finally{ busy(b, false); }
    }
  };
  Object.keys(acts).forEach(id => { const b = document.getElementById(id); if(b) b.addEventListener('click', () => acts[id](b)); });
  $$('[data-quick]', pane).forEach(b => b.addEventListener('click', () => { $('#ctSimText', pane).value = b.dataset.quick; }));
  return {refresh:() => refreshStatus(true), onStatus:render};
};

/* ── 13.2 开播 SOP 检查：真实预检项 + 一键开播/安全下播 ── */
PanelRegistry.sop = function(pane, win){
  pane.innerHTML =
    '<div class="pane-head"><h2>开播 SOP 检查中心</h2><div class="sp">' +
      '<button class="btn ghost" id="sopReload">' + svgIcon('refresh') + '<span>重新预检</span></button>' +
      '<button class="btn primary" id="sopStart">' + svgIcon('play') + '<span>一键开播</span></button>' +
      '<button class="btn danger" id="sopStop">' + svgIcon('stop') + '<span>安全下播</span></button></div></div>' +
    '<div id="sopBody"><div class="empty">正在读取检查项…</div></div>';
  const body = $('#sopBody', pane);
  function render(s){
    if(!s || !pane.isConnected) return;
    const wf = s.workflow || {checks:[], blockers:[], warnings:[]};
    const cur = (s.sales && s.sales.current_product) || null;
    const group = (level, title, cls) => {
      const list = (wf.checks || []).filter(c => (c.level || 'blocker') === level);
      if(!list.length) return '';
      return '<div class="card"><h3>' + svgIcon(level === 'blocker' ? 'alert' : level === 'warning' ? 'zap' : 'info') + esc(title) +
        '<span class="badge ' + cls + '" style="margin-left:auto">' + list.filter(c => c.passed).length + '/' + list.length + '</span></h3>' +
        '<ul class="chk-list">' + list.map(c =>
          '<li class="' + (c.passed ? 'pass' : (c.level === 'blocker' ? 'block' : 'warn')) + '">' +
          '<span class="m">' + (c.passed ? '✓' : '!') + '</span><span class="t"><b>' + esc(c.label) + '</b>' +
          (c.passed ? '' : '<span>' + esc(c.action || '') + '</span>') + '</span></li>').join('') + '</ul></div>';
    };
    body.innerHTML =
      '<div class="stats">' +
        '<div class="stat"><div class="lab">必做项通过率</div><div class="val">' + (wf.score === undefined ? '—' : wf.score + '%') + '</div></div>' +
        '<div class="stat"><div class="lab">必做项</div><div class="val">' + (wf.required_passed || 0) + ' / ' + (wf.required_total || 0) + '</div></div>' +
        '<div class="stat"><div class="lab">阻塞项</div><div class="val">' + ((wf.blockers || []).length) + '</div></div>' +
        '<div class="stat"><div class="lab">建议项待办</div><div class="val">' + ((wf.warnings || []).length) + '</div></div>' +
        '<div class="stat"><div class="lab">能否开播</div><div class="val sm">' + (wf.ready ? '<span class="badge ok">可以开播</span>' : '<span class="badge err">存在阻塞</span>') + '</div></div>' +
      '</div>' +
      '<div class="progress" style="margin:12px 0"><i style="width:' + (wf.score || 0) + '%"></i></div>' +
      '<div class="card"><h3>' + svgIcon('catalog') + '当前讲解商品</h3><dl class="kv">' +
        (cur ? '<dt>商品</dt><dd>' + esc(cur.name) + '</dd><dt>平台商品ID</dt><dd>' + esc(cur.platform_product_id || '未填写') + '</dd>' +
               '<dt>已核对价格</dt><dd>' + esc(cur.price || '未填写') + '</dd><dt>卖点</dt><dd>' + esc(cur.selling_points || '未填写') + '</dd>'
             : '<dt>状态</dt><dd>未选择当前商品（在商品库中设为当前商品）</dd>') + '</dl></div>' +
      group('blocker', '必做检查项（未通过不可开播）', 'err') +
      group('warning', '建议检查项（不阻塞开播）', 'warn') +
      group('optional', '可选检查项', '') +
      '<div class="card"><h3>' + svgIcon('info') + '开播前后的纪律</h3><div class="hint">' +
        '① 平台挂载商品必须与工作台“当前商品”一致；佣金字段不会口播。<br>' +
        '② 保留 LiveTalking 水印并按平台要求标明 AI 生成，全程真人值守、可随时接管。<br>' +
        '③ 防录播看的是“固定周期重复”：间隔 ≥15 秒并打乱顺序，最稳是关闭循环、逐轮人工继续。<br>' +
        '④ 修改商品、价格、话术后，相关检查项会自动撤销，必须重新核对。' +
      '</div></div>';
  }
  win.onStatus = render; if(ST) render(ST);
  const on = (id, fn) => { const b = document.getElementById(id); if(b) b.addEventListener('click', () => fn(b)); };
  on('sopReload', async b => { busy(b, true); try{ await refreshStatus(false); toast('ok', '已重新预检', '检查项已按最新配置重新计算'); }catch(e){ apiFail(e, '预检'); } finally{ busy(b, false); } });
  on('sopStart', async b => {
    busy(b, true);
    try{
      const r = await Data.workflowStart();
      if(r && r.success === false) toast('warn', '开播未完成', r.error || '请检查工作台状态');
      else notify('ok', '一键开播已启动', '自动内容与场次记录已启动；请确认平台侧已开始直播。');
      await refreshStatus(false);
    }catch(e){ apiFail(e, '一键开播'); } finally{ busy(b, false); }
  });
  on('sopStop', b => confirmBox('安全下播', '将停止自动内容并结束当前场次，确定吗？', async () => {
    busy(b, true); try{ const r = await Data.workflowStop();
      toast(r && r.success === false ? 'warn' : 'ok', '已安全下播', r && r.error ? r.error : '自动模块已关闭');
      await refreshStatus(false); }catch(e){ apiFail(e, '安全下播'); } finally{ busy(b, false); } }));
  return {refresh:() => refreshStatus(false), onStatus:render};
};

/* ── 13.3 日志与诊断：/health + /api/system/access + 操作历史 + 前端错误 ── */
PanelRegistry.diagnostics = function(pane, win){
  pane.innerHTML =
    '<div class="pane-head"><h2>日志与诊断</h2><div class="sp">' +
      '<button class="btn ghost" id="dgReload">' + svgIcon('refresh') + '<span>重新检测</span></button>' +
      '<button class="btn" id="dgCopy">' + svgIcon('copy') + '<span>复制诊断信息</span></button>' +
      '<button class="btn" id="dgExport">' + svgIcon('download') + '<span>导出报告</span></button></div></div>' +
    '<div class="grid2">' +
      '<div class="card"><h3>' + svgIcon('cpu') + '服务健康（GET /health）</h3><div class="log" id="dgHealth">检测中…</div></div>' +
      '<div class="card"><h3>' + svgIcon('monitor') + '访问地址（GET /api/system/access）</h3><div id="dgAccess"></div></div>' +
    '</div>' +
    '<div class="card"><h3>' + svgIcon('clock') + '服务端操作历史</h3><div class="log" id="dgHistory">加载中…</div></div>' +
    '<div class="card"><h3>' + svgIcon('cli') + '前端日志（本页 console 与异常）</h3><div class="log" id="dgClients">正在采集…</div></div>' +
    '<div class="card"><h3>' + svgIcon('info') + '环境信息</h3><dl class="kv" id="dgEnv"></dl></div>';
  const refs = {health:$('#dgHealth', pane), access:$('#dgAccess', pane), history:$('#dgHistory', pane), clients:$('#dgClients', pane), env:$('#dgEnv', pane)};
  async function loadHealth(){
    refs.health.textContent = '检测中…';
    try{ const h = await Data.health(); refs.health.textContent = JSON.stringify(h, null, 2); }
    catch(e){ refs.health.innerHTML = '<span class="er">健康检查失败：' + esc(e.message) + '</span>'; }
  }
  async function loadAccess(){
    try{
      const a = await Data.access();
      refs.access.innerHTML = '<dl class="kv">' +
        '<dt>本机地址</dt><dd>' + esc(a.desktop_url || location.href) + ' <button class="btn sm ghost" data-copy="' + esc((a.desktop_url||'').replace('/live_console.html','/desktop.html')) + '">复制</button></dd>' +
        '<dt>监听端口</dt><dd>' + esc(a.port || '—') + '</dd>' +
        '<dt>同网段手机访问</dt><dd>' + ((a.lan_urls && a.lan_urls.length)
          ? a.lan_urls.map(u => '<div>' + esc(u.replace('/live_console.html','/desktop.html')) + ' <button class="btn sm ghost" data-copy="' + esc(u.replace('/live_console.html','/desktop.html')) + '">复制</button></div>').join('')
          : (MODE === 'demo' ? '离线演示模式无此信息' : '未检测到局域网地址')) + '</dd>' +
        '<dt>分享限制</dt><dd>' + (a.same_network_only ? '仅同一局域网可直接访问；外网请用“外网分享给别人看.cmd”' : '—') + '</dd></dl>' +
        '<div class="hint" style="margin-top:8px">局域网 http 访问时浏览器会禁用麦克风/摄像头；本机 127.0.0.1 不受限。</div>';
      $$('[data-copy]', refs.access).forEach(b => b.addEventListener('click', () => copyText(b.dataset.copy, '地址')));
    }catch(e){ refs.access.innerHTML = '<div class="hint">读取失败：' + esc(e.message) + '</div>'; }
  }
  function render(s){
    if(!s) return;
    const his = s.history || [];
    refs.history.innerHTML = his.length
      ? his.map(h => '<span class="' + (h.status === 'error' ? 'er' : h.status === 'warning' ? 'wa' : '') + '">' +
          esc(fmtDT(new Date((h.time || 0) * 1000))) + ' [' + esc(h.type || '') + '] ' + esc(h.text || '') + '</span>').join('\n')
      : '暂无操作记录。';
  }
  win.onStatus = render; if(ST) render(ST);
  function renderEnv(){
    const con = navigator.connection || {};
    refs.env.innerHTML = [
      ['运行模式', MODE === 'live' ? '连接本地服务（真实接口）' : '离线演示（不访问接口）'],
      ['页面地址', location.href],
      ['浏览器', navigator.userAgent],
      ['屏幕 / 窗口', window.screen.width + '×' + window.screen.height + ' / ' + window.innerWidth + '×' + window.innerHeight],
      ['语言 / 在线', navigator.language + ' / ' + (navigator.onLine ? '在线' : '离线')],
      ['网络类型', con.effectiveType ? con.effectiveType + '（' + (con.downlink || '?') + ' Mbps）' : '浏览器未提供'],
      ['已打开窗口', WM.wins.size + ' 个'],
      ['本地存储项', (function(){ let n = 0; try{ for(const k in localStorage) if(k.indexOf('ailive.') === 0) n++; }catch(e){} return n; })() + ' 项（ailive.*）']
    ].map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('');
  }
  function renderClientLogs(){
    refs.clients.innerHTML = CLIENT_LOGS.length
      ? CLIENT_LOGS.slice(-60).map(l => '<span class="' + (l.level === 'error' ? 'er' : l.level === 'warn' ? 'wa' : '') + '">' +
          esc(l.time) + ' [' + esc(l.level) + '] ' + esc(l.text) + '</span>').join('\n')
      : '本页暂无前端错误或警告（已捕获 console.warn/error 与未处理异常）。';
  }
  renderClientLogs(); renderEnv(); loadHealth(); loadAccess();
  /* 诊断报告：把面板里的关键信息拼成可交付的文本 */
  function report(){
    const a = (ST && ST.workflow) || {};
    return [
      appName() + ' 诊断报告',
      '生成时间：' + new Date().toLocaleString('zh-CN'),
      '运行模式：' + (MODE === 'live' ? 'live（真实服务 ' + location.host + '）' : 'demo（离线演示）'),
      '页面地址：' + location.href,
      '浏览器：' + navigator.userAgent,
      '窗口数：' + WM.wins.size,
      '直播状态：' + ((ST && ST.live_state) || '—') + '　输出连接：' + ((ST && ST.output_connected) ? '是' : '否'),
      '开播检查：' + ((a.required_passed || 0) + '/' + (a.required_total || 0)) + '　阻塞项：' + ((a.blockers || []).length),
      '服务健康：' + refs.health.textContent.slice(0, 600),
      '访问地址：' + refs.access.textContent.slice(0, 400),
      '前端日志：',
      CLIENT_LOGS.slice(-40).map(l => l.time + ' [' + l.level + '] ' + l.text).join('\n') || '（无）'
    ].join('\n');
  }
  const on = (id, fn) => { const b = document.getElementById(id); if(b) b.addEventListener('click', () => fn(b)); };
  on('dgReload', async b => { busy(b, true); renderClientLogs(); renderEnv(); await loadHealth(); await loadAccess(); try{ await refreshStatus(false); }catch(e){} renderClientLogs(); busy(b, false); toast('ok','已重新检测','健康、地址、历史与前端日志均已刷新'); });
  on('dgCopy', b => copyText(report(), '诊断报告'));
  on('dgExport', b => { downloadText((isDesktop() ? 'AI数字人桌面版' : 'AI数字人-网页端') + '-诊断报告-' + Date.now() + '.txt', report()); toast('ok', '报告已导出', '文件已保存到浏览器下载目录'); });
  return {refresh:async () => { await loadHealth(); await loadAccess(); }, onStatus:render};
};

/** 演示小组件：每个窗口给一点可操作的东西，让离线演示版不是空壳 */
function renderDemoWidget(box, kind, win){
  if(kind === 'stage'){
    box.innerHTML = '<div class="card"><h3>' + svgIcon('stage') + '演示画面（非真实数字人）</h3>' +
      '<div class="hint" style="margin-bottom:8px">正式版这里是 WebRTC 数字人实时画面；演示版用本地绘制的占位画面表示，点“开始演示”可看口型节奏动画。</div>' +
      '<div class="demo-stage" style="max-height:420px;margin:0 auto;width:min(240px,60%)"><canvas id="dmCanvas" width="270" height="480"></canvas></div>' +
      '<div class="row" style="margin-top:10px;justify-content:center"><button class="btn primary" id="dmPlay">' + svgIcon('play') + '<span>开始演示</span></button>' +
      '<button class="btn ghost" id="dmStop">' + svgIcon('stop') + '<span>停止</span></button></div></div>';
    const cvs = $('#dmCanvas', box), ctx = cvs.getContext('2d');
    let raf = null, t = 0;
    function frame(){
      t += 0.05;
      const w = cvs.width, h = cvs.height;
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#12374e'); g.addColorStop(1, '#0b1e2b');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      /* 光晕 */
      const r = ctx.createRadialGradient(w/2, h*0.32, 10, w/2, h*0.32, w*0.7);
      r.addColorStop(0, 'rgba(56,189,248,.45)'); r.addColorStop(1, 'rgba(56,189,248,0)');
      ctx.fillStyle = r; ctx.fillRect(0, 0, w, h);
      /* 简笔数字人轮廓（无任何真实人脸素材） */
      ctx.fillStyle = 'rgba(233,245,255,.92)';
      ctx.beginPath(); ctx.arc(w/2, h*0.30, 46, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w/2-70, h*0.62); ctx.quadraticCurveTo(w/2, h*0.40, w/2+70, h*0.62);
      ctx.lineTo(w/2+58, h); ctx.lineTo(w/2-58, h); ctx.closePath(); ctx.fill();
      /* 口型节奏（演示用，非真实口型驱动） */
      const open = (Math.sin(t*4) * 0.5 + 0.5) * 16 + 4;
      ctx.fillStyle = '#0b1e2b';
      ctx.beginPath(); ctx.ellipse(w/2, h*0.335, 13, open/2 + 3, 0, 0, Math.PI*2); ctx.fill();
      /* 音频电平条 */
      for(let i = 0; i < 9; i++){
        const bh = 8 + Math.abs(Math.sin(t*3 + i)) * 26;
        ctx.fillStyle = 'rgba(125,224,255,.8)';
        ctx.fillRect(30 + i*26, h - 46 - bh, 12, bh);
      }
      /* 字幕 */
      ctx.fillStyle = 'rgba(6,26,44,.72)'; ctx.fillRect(12, h - 116, w - 24, 46);
      ctx.fillStyle = '#dff1ff'; ctx.font = '13px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('AI 数字人 · 内容由人工值守（演示画面）', w/2, h - 88);
      ctx.fillStyle = '#7dd8ff'; ctx.font = '11px "Segoe UI", sans-serif';
      ctx.fillText('9:16 演示输出 · 未连接真实数字人', w/2, h - 70);
      raf = requestAnimationFrame(frame);
    }
    $('#dmPlay', box).onclick = () => { if(raf) return; DEMO.connect(true); notify('ok', '演示数字人已连接', '（演示）工作台将显示“输出窗口已连接”'); frame(); };
    $('#dmStop', box).onclick = () => { if(raf) cancelAnimationFrame(raf); raf = null; DEMO.connect(false); ctx.clearRect(0, 0, cvs.width, cvs.height); };
    win.cleanups.push(() => { if(raf) cancelAnimationFrame(raf); });
    return;
  }
  if(kind === 'workbench'){

/* ═══════════════════ 14. 前端日志采集（给“日志与诊断”用） ═══════════════════ */
const CLIENT_LOGS = [];
(function hookConsole(){
  ['warn','error'].forEach(level => {
    const orig = console[level].bind(console);
    console[level] = function(){
      try{ CLIENT_LOGS.push({time:fmtDT(new Date()), level:level, text:Array.prototype.map.call(arguments, a => typeof a === 'string' ? a : (a && a.message) || String(a)).join(' ')});
        while(CLIENT_LOGS.length > 200) CLIENT_LOGS.shift(); }catch(e){}
      orig.apply(null, arguments);
    };
  });
  window.addEventListener('error', e => CLIENT_LOGS.push({time:fmtDT(new Date()), level:'error', text:(e.message || '未知错误') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)}));
  window.addEventListener('unhandledrejection', e => CLIENT_LOGS.push({time:fmtDT(new Date()), level:'error', text:'未处理的 Promise 拒绝：' + ((e.reason && e.reason.message) || e.reason || '')}));
})();

/* ── 17.1b iframe 嵌入模式：拆掉被嵌页面的"第二套外壳" ──────────────────
   桌面外壳自己已经有品牌、左导航、标签栏、账号胶囊；而被嵌入的业务页面
   （live_console / accounts / yamy …）独立访问时也需要那套导航，于是叠在一起
   就成了"窗口套窗口、导航套导航"——最刺眼的是那条深紫色顶栏，以及它下面
   重复的一行大标题和账号按钮。

   这里在 iframe 每次加载完成后做减法（只注入一段 CSS，不改被嵌页面的 DOM
   结构与脚本，也不改它的接口调用）：
     ① 隐藏顶部导航条（品牌 + 模块链接 + 账号 + 连接状态）；
     ② 隐藏页面大标题与副标题，只保留这一行右侧的工具按钮（如"手机访问地址"）；
     ③ 隐藏页面内的账号 / 升级 / 退出，并把免费版提示压成一行。
   只有同源才能这么做；独立用浏览器打开这些页面时不会生效，因为注入只发生在
   外壳里。跨源、未就绪、页面还没 head 时静默跳过，绝不影响加载。 */
const EMBED_CSS = [
  /* ① 顶栏：品牌、模块链接、账号、连接状态，全由外壳提供 */
  '#lt-nav-container, .lt-nav, header.topbar { display:none !important; }',
  /* ② 标题行整行去掉：标题由外壳说明条承担，剩下的一颗"手机访问地址"按钮
        （它只是跳到页面内已可见的"接入与帮助"标签页）留在这里反而像孤儿 */
  '.page-heading, .page-heading .actions { display:none !important; }',
  /* ③ 账号/升级/退出：外壳右上角账号胶囊负责 */
  '#authBar, .auth-bar { display:none !important; }',
  /* ④ 免费版提示：信息必须留，但压成一行，不要占掉半屏；
        配色取外壳的主题色（变量由 embedFrame 注入），免得一块紫底跟在浅蓝外壳里 */
  '#authBannerHost { margin-bottom:10px !important; }',
  '#authBanner, .auth-banner { padding:8px 12px !important; margin:0 !important;',
  '  border-radius:8px !important; gap:8px !important;',
  '  background:var(--embed-warn-bg) !important; color:var(--embed-warn) !important;',

  'html.lt-embedded .stat-foot { display:none !important; }',
  'html.lt-embedded .card-subtitle { display:none !important; }',
  'html.lt-embedded .card .hint { font-size:11.5px !important; color:var(--text-muted); }',

  'html.lt-embedded, html.lt-embedded body { background:transparent !important;',

  /* ⑥ 页面内的"返回 xxx"由外壳左导航替代，留着只是一颗孤立按钮 */
  'html.lt-embedded .page-heading a[href*="live_console"],',

  '  --accent-light: var(--embed-brand-soft);',
  '  --primary-light: var(--embed-brand-soft);',
  '  --primary-border: var(--embed-brand-ring);',
  '}',
  /* ⑧ 这些页面按"独立访问"留了首屏边距，嵌入后收紧，内容更贴标签栏 */
  'main.container, .container.lc-main { padding-top:8px !important; }'
].join('\n');

/* 升级 / 无权限提示页用的轻量版：只去掉顶栏与账号区。
   这两页的 .page-heading 是页面主标题（"升级会员"/"需要更高权限"），
   属于内容本身，不能像业务页那样整行隐藏。 */
const EMBED_CSS_BLOCK = [
  '#lt-nav-container, .lt-nav { display:none !important; }',
  '#authBar, .auth-bar { display:none !important; }',
  '.page-heading { margin-top:0 !important; }'
].join('\n');

function embedFrame(frame){
  let doc = null;
  try{ doc = frame.contentDocument; }catch(e){ return false; }   /* 跨源：跳过 */
  if(!doc || !doc.documentElement) return false;
  let path = '', isBlock = false;
  try{
    path = (doc.location && doc.location.pathname) || '';
    /* 登录页在外壳里出现属于异常情况（会话过期），保持原生样式不动 */
    if(/login\.html$/.test(path)) return true;
    /* 升级 / 无权限提示页只做轻量处理：隐藏顶栏与账号区，保留页面主标题 */
    isBlock = /(upgrade|forbidden)\.html$/.test(path);
  }catch(e){}
  try{
    doc.documentElement.classList.add('lt-embedded');
    let st = doc.getElementById('lt-embed-style');
    if(!st){
      st = doc.createElement('style');
      st.id = 'lt-embed-style';
      (doc.head || doc.documentElement).appendChild(st);
    }
    /* 同一个 iframe 可能先从业务页跳到升级页：每次都要按当前页面类型重写规则，
       不能"注入过就跳过"。 */
    st.textContent = isBlock ? EMBED_CSS_BLOCK : EMBED_CSS;
    applyEmbedVars(doc);
    syncFrameTheme(frame);
    return true;
  }catch(e){ return false; }   /* 页面正在导航或已卸载，下一次尝试会补上 */
}

/* 为什么不能只等 load：iframe 的 load 要等页面所有资源（字体、封面图、脚本）
   都就绪才触发，实测 live_console 在 1.8s 时还没到 load，而页面早就画出来了 ——
   用户会先看到完整的紫色顶栏和一行大标题，几百毫秒后才"啪"地消失，比不改还难受。
   所以从设置 src 开始就按 60ms 轮询尝试注入（注入幂等，有 id 就跳过），
   页面 head 一就绪就生效；真正的 load 事件到了再兜底补一次并停表。 */
function startEmbedPolling(frame){
  let n = 0;
  const iv = setInterval(() => {
    if(embedFrame(frame) || ++n > 120){ clearInterval(iv); }   /* 最多试 ~7.2s */
  }, 60);
  frame.addEventListener('load', () => { clearInterval(iv); embedFrame(frame); }, {once: true});
}

/* ── 17.1c 模块说明条 ──────────────────────────────────────────────
   去掉被嵌页面自己的大标题与工具行之后，"这个模块是干什么的"就没有地方说了：
   标签栏只有一个名字，左导航也只有名字，点进来只看到一堆卡片。
   这里在 iframe 上方补一条 40px 的说明条：图标 + APPS 里现成的一句话 tip +
   "重新载入本页"。原生面板不需要它（它们自己带 pane-head 大标题与说明）。 */
function buildPaneBar(app, win){
  return el('div', {class: 'pane-bar'},
    el('span', {class: 'ic', html: svgIcon(app.icon)}),
    el('span', {class: 'tx', text: app.tip || ('「' + app.name + '」')}),
    el('button', {

      onclick: () => {

      }

  );
}

/* 外壳切深色时，嵌进来的页面也跟着切 —— 否则深色壳里嵌一块白页面，比原来更"套娃"。
   这些页面本身支持 body.dark / html.dark-theme（见 common.css 与 yamy）。
   顺带把 --embed-* 变量重算一遍：注入时拿的是当时的主题色，切了主题不更新的话，
   提示条会一直是浅色那条（深色界面里一块米黄，很扎眼）。 */
function applyEmbedVars(doc){
  try{
    const cs = getComputedStyle(document.documentElement);
    const pick = (n, fb) => (cs.getPropertyValue(n) || '').trim() || fb;
    const root = doc.documentElement;
    root.style.setProperty('--embed-warn', pick('--warn', '#c47f0a'));
    root.style.setProperty('--embed-warn-bg', pick('--warn-bg', '#fdf3e2'));
    root.style.setProperty('--embed-warn-line',
      'color-mix(in srgb, ' + pick('--warn', '#c47f0a') + ' 24%, transparent)');
    /* 主色：嵌入页的强调色跟着外壳的品牌色走（见 EMBED_CSS ⑦） */
    root.style.setProperty('--embed-brand-strong', pick('--brand-strong', '#0ea5e9'));
    root.style.setProperty('--embed-brand-soft', pick('--brand-soft', '#e0f2fe'));
    root.style.setProperty('--embed-brand-ring', pick('--brand-ring', 'rgba(14,165,233,.34)'));
  }catch(e){}
}
function syncFrameTheme(frame){
  if(!frame) return;
  let doc = null;
  try{ doc = frame.contentDocument; }catch(e){ return; }
  if(!doc || !doc.documentElement) return;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  try{
    doc.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    doc.documentElement.classList.toggle('dark-theme', dark);
    if(doc.body) doc.body.classList.toggle('dark', dark);
    applyEmbedVars(doc);
  }catch(e){}
}
function syncAllFrameThemes(){
  WM.wins.forEach(win => { if(win.iframe) syncFrameTheme(win.iframe); });
}
/* 主题一变就同步给所有已打开的嵌入页。用 MutationObserver 而不是包装 applySettings，
   这样不管主题是设置面板改的、跟随系统变的还是快捷键切的，都能跟上。 */
try{
  new MutationObserver(syncAllFrameThemes).observe(
    document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
}catch(e){}

/** 是否当前账号无权限（只做视觉提示；能不能开由服务端判定） */
function appLockTag(app){

function renderNav(filter){

function currentApp(){
  const id = $('#tabbar') && $('#tabbar').dataset.active;
  return id ? APP_MAP[id] : null;
}
function findTabBtn(id){ return $('#tabbar') ? $('.tab[data-app="' + id + '"]') : null; }

/** 打开模块：已有标签则激活（同一模块只有一个标签） */
function openModule(id, opt){
  const app = APP_MAP[id];
  if(!app){ toast('err', '模块不存在', id); return; }
  if(WM.wins.has(id)){ activateTab(id); return WM.wins.get(id); }
  opt = opt || {};

  const pane = el('div', {class: 'pane', dataset: {app: id}, role: 'tabpanel'});
  const body = el('div', {class: 'pane-body'});
  pane.appendChild(body);
  $('#panes').appendChild(pane);

  const win = {id: id, app: app, pane: pane, body: body, cleanups: [], onStatus: null, paneRefresh: null, iframe: null};
  const renderer = app.native ? PanelRegistry[app.native] : ((MODE === 'demo' && !app.always) ? PanelRegistry.demo : null);
  if(renderer){
    /* 原生面板（控制中心 / SOP / 日志诊断 / 设置 / 关于 / 演示） */
    body.classList.add('scroll');
    const host = el('div', {class: 'wm-pane', dataset: {pane: id}});
    body.appendChild(host);
    try{
      const ret = renderer(host, win);
      if(ret && typeof ret === 'object'){
        if(typeof ret.refresh === 'function') win.paneRefresh = ret.refresh;
        if(typeof ret.onStatus === 'function') win.onStatus = ret.onStatus;
        if(typeof ret.cleanup === 'function') win.cleanups.push(ret.cleanup);
      }
    }catch(e){
      host.innerHTML = '';
      host.appendChild(el('div', {class: 'card'}, el('h3', {html: svgIcon('alert') + '面板渲染失败'}), el('div', {class: 'hint', text: String(e && e.message || e)})));
      console.error('面板渲染失败', id, e);
    }
  }else if(app.url){
    /* 真实页面：内嵌 iframe（同源，带 samesite cookie，权限仍由服务端判定） */
    const loading = el('div', {class: 'frame-loading'}, el('div', {text: '正在载入 ' + app.name + ' …'}), el('div', {class: 'bar'}, el('i')));
    const frame = el('iframe', {title: app.name, src: 'about:blank'});
    if(app.allow) frame.setAttribute('allow', app.allow);
    body.classList.add('has-bar');
    body.appendChild(buildPaneBar(app, win));
    body.appendChild(frame); body.appendChild(loading);
    let guard = setTimeout(() => {
      loading.style.display = 'none';
      showFrameAlert(win, '页面加载较慢或服务未就绪，可点工具栏「刷新」或用浏览器打开重试。', false);
    }, 15000);
    frame.addEventListener('load', () => {
      clearTimeout(guard); loading.style.display = 'none';
      /* 嵌进来的页面不需要再画一遍品牌/导航/账号（见 17.1b） */
      embedFrame(frame);
      try{
        const p = frame.contentWindow.location.pathname;
        if(p === '/login.html') showFrameAlert(win, '该模块需要登录：服务端已跳转到登录页，登录后即可正常使用。', false);
        else if(p === '/upgrade.html') showFrameAlert(win, '该模块属于专业版功能：服务端已跳转到升级页（外壳不会替你放行）。', false);
        else if(p === '/forbidden.html') showFrameAlert(win, '该模块仅管理员可见：服务端已拦截。', true);
      }catch(e){}
    });
    frame.src = app.url;
    win.iframe = frame;
    startEmbedPolling(frame);
  }else{
    body.appendChild(el('div', {class: 'empty', text: '该模块暂未接入内容。'}));
  }

  WM.wins.set(id, win); WM.order.push(id);
  addTabBtn(app, win);
  activateTab(id);
  renderNav($('#navSearch') ? $('#navSearch').value : '');
  saveSession();
  return win;
}

function addTabBtn(app, win){
  const btn = el('button', {class: 'tab', dataset: {app: app.id}, title: app.name, type: 'button',
    role: 'tab', 'aria-selected': 'false'},
    el('span', {class: 'ic', html: svgIcon(app.icon)}),
    el('span', {class: 'tt', text: app.name}),
    el('span', {class: 'x', html: svgIcon('close'), title: '关闭标签（Ctrl+W）', 'aria-hidden': 'true'})
  );
  btn.addEventListener('click', e => {
    if(e.target.closest('.x')){ e.stopPropagation(); closeTab(app.id); return; }
    activateTab(app.id);
  });
  btn.addEventListener('auxclick', e => { if(e.button === 1){ e.preventDefault(); closeTab(app.id); } });
  /* 右键标签：批量关标签的唯一入口（标签多到一屏放不下时尤其需要） */
  btn.addEventListener('contextmenu', e => {
    e.preventDefault();
    const ids = WM.order.slice();
    const i = ids.indexOf(app.id);
    const others = ids.filter(x => x !== app.id);
    popMenu(btn, [
      {label: '关闭', icon: 'close', kbd: 'Ctrl+W', action: () => closeTab(app.id)},
      {label: '关闭其他标签', icon: 'close', disabled: !others.length, action: () => closeTabs(others, app.id)},
      {label: '关闭右侧标签', icon: 'close', disabled: i < 0 || i >= ids.length - 1,
       action: () => closeTabs(ids.slice(i + 1), app.id)},
      {sep: true},
      {label: '全部关闭', icon: 'close', disabled: ids.length < 2,
       action: () => closeTabs(WM.order.slice(), null)}
    ]);
  });
  $('#tabbar').appendChild(btn);
  syncTabbar();
  revealTab(btn);
}

function activateTab(id){
  const win = WM.wins.get(id); if(!win) return;
  WM.order = WM.order.filter(x => x !== id); WM.order.push(id);
  $$('#panes .pane').forEach(p => p.classList.toggle('on', p.dataset.app === id));
  $$('#tabbar .tab').forEach(b => {
    const on = b.dataset.app === id && !b.classList.contains('tab-hint');
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  $('#tabbar').dataset.active = id;
  const app = APP_MAP[id];
  if(app){
    $('#crumbTitle').textContent = app.name;
    $('#crumbSub').textContent = app.tip || '';
    document.title = app.name + ' · ' + appName();
    syncWindowTitle();
  }
  renderNav($('#navSearch') ? $('#navSearch').value : '');
  revealTab(findTabBtn(id));
  /* 原生面板在切回来时刷新一次（约 1.2s 内不重复打接口） */
  if(win.paneRefresh && Date.now() - (win._lastRefresh || 0) > 1200){
    win._lastRefresh = Date.now();
    try{ win.paneRefresh(); }catch(e){}
  }
  if(win.onStatus && ST){ try{ win.onStatus(ST); }catch(e){} }
  saveSession();
}

/** 关闭单个标签。quiet=true 时不弹“已关闭”提示（批量关闭用，避免刷一屏提示条）。 */
function closeTab(id, quiet){
  const win = WM.wins.get(id); if(!win) return;
  const doClose = () => {
    win.cleanups.forEach(fn => { try{ fn(); }catch(e){} });
    if(win.iframe) win.iframe.src = 'about:blank';
    win.pane.remove();
    const btn = findTabBtn(id); if(btn) btn.remove();
    WM.wins.delete(id); WM.order = WM.order.filter(x => x !== id);
    if($('#tabbar').dataset.active === id){
      const next = WM.order[WM.order.length - 1];
      if(next) activateTab(next);
      else {
        $('#tabbar').dataset.active = '';
        $('#crumbTitle').textContent = '工作台';
        $('#crumbSub').textContent = '';
        document.title = appName();
        syncWindowTitle();
        showWelcome();
      }
    }
    syncTabbar(); renderNav($('#navSearch') ? $('#navSearch').value : ''); saveSession();
    if(!quiet) toast('info', '已关闭「' + win.app.name + '」');
  };

/* ── 标签栏溢出：滚动按钮 / 滚轮 / 激活项自动进视野 ────────────────────
   标签数量一多，靠 overflow-x:auto 是「看不见也点不到」的：滚动条高度被设成 0，
   没有提示，用户只能盲滚。这里给出三条可见路径：两端箭头（仅在溢出时出现）、
   垂直滚轮转横向滚动、切标签时自动把当前标签滚进视野。 */
function updateTabnav(){
  const wrap = $('#tabwrap'), bar = $('#tabbar'); if(!wrap || !bar) return;
  const max = bar.scrollWidth - bar.clientWidth;
  wrap.classList.toggle('overflow', max > 2);
  const prev = $('#tabPrev'), next = $('#tabNext');
  if(prev) prev.disabled = bar.scrollLeft <= 1;
  if(next) next.disabled = bar.scrollLeft >= max - 1;
}
/** 把一个标签滚进可见范围（只滚标签条，不动页面） */
function revealTab(btn){
  const bar = $('#tabbar'); if(!bar || !btn) return;
  const b = btn.getBoundingClientRect(), r = bar.getBoundingClientRect();
  if(b.left < r.left) bar.scrollLeft -= (r.left - b.left + 10);
  else if(b.right > r.right) bar.scrollLeft += (b.right - r.right + 10);
  updateTabnav();
}
function scrollTabs(dir){
  const bar = $('#tabbar'); if(!bar) return;
  const step = Math.max(160, Math.round(bar.clientWidth * 0.7));
  bar.scrollBy({left: dir * step, behavior: 'smooth'});
  setTimeout(updateTabnav, 260);
}

/* ── 17.5 账号 / 状态栏 / 会话持久化 ──────────────────────────────── */
function hasBridge(){ return !!(window.pywebview && window.pywebview.api); }
function bridge(name, ...args){
  if(!hasBridge() || typeof window.pywebview.api[name] !== 'function') return Promise.resolve(null);
  try{ return Promise.resolve(window.pywebview.api[name](...args)); }catch(e){ return Promise.resolve(null); }
}

/* ── 17.5a 端区分：桌面端（AILiveDesktop 宿主）↔ 网页端（纯浏览器）──────────
   同一份界面两端共用，但**桌面专属能力不能出现在网页端**（打开文件夹 / 重启服务 /
   服务托管 / 退出应用 / 项目根目录…），网页端也不该自称“桌面版”。
   判定依据两条，缺一不可：
     · 宿主加载自带界面时 URL 一定带 ?host=1（见 app\app.py 的 ui_entry_url()），
       这条不依赖 pywebview 注入时序，窗口刚打开就能判对；
     · window.pywebview.api（宿主桥接）存在，则是桌面端。
   网页端两者都为假 → 只渲染端中立的入口。 */
function isDesktop(){ return params.get('host') === '1' || hasBridge(); }
/** 应用名（按端区分，避免网页端自称“桌面版”） */
function appName(){ return isDesktop() ? 'AI 数字人桌面版' : 'AI 数字人 · 网页端'; }
/** 端专属外观：标题 / 品牌小字 / 工具栏按钮文案（启动时调用，桥接就绪后再调一次） */

  const foot = $('#bootFoot'); if(foot) foot.textContent = 'LiveTalking 本地服务 · ' + (desk ? '桌面应用' : '网页端') + ' v' + APP_VERSION;
  const ver = $('#brandVer'); if(ver) ver.textContent = desk ? '桌面版' : '网页端';
  const be = $('#btnExternal'); if(be){

    const lb = be.querySelector('.btn-label'); if(lb) lb.textContent = desk ? '浏览器' : '新标签';

/* ── 17.6 弹出菜单（菜单行 / 账号胶囊 / 设置入口）──────────────────── */
function popMenu(anchor, items){
  const box = $('#popMenu') || el('div', {class: 'popmenu', id: 'popMenu'});
  if(!box.parentNode) document.body.appendChild(box);
  box.innerHTML = '';
  items.forEach(it => {
    if(it.sep){ box.appendChild(el('div', {class: 'sep'})); return; }
    box.appendChild(el('button', {
      class: 'it' + (it.danger ? ' danger' : ''), type: 'button', disabled: !!it.disabled,
      onclick: () => { closePop(); it.action && it.action(); }
    },
      it.icon ? el('span', {class: 'ic', html: svgIcon(it.icon)}) : null,
      el('span', {class: 'lbl', text: it.label}),
      it.kbd ? el('span', {class: 'kb', text: it.kbd}) : null
    ));
  });
  const r = anchor.getBoundingClientRect();
  box.classList.add('open');
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(6, Math.min(r.left, window.innerWidth - w - 6)) + 'px';
  box.style.top = Math.min(r.bottom + 4, window.innerHeight - h - 6) + 'px';
  /* 只给菜单栏按钮点亮 .on；标签也有 .on（表示“当前标签”），挂上就会被看成激活态 */
  if(anchor.classList.contains('mi')) anchor.classList.add('on');
  else anchor.classList.add('pop-anchor');
  setTimeout(() => document.addEventListener('pointerdown', onDocDownForPop, true), 0);
}
function onDocDownForPop(e){ if(!e.target.closest('#popMenu') && !e.target.closest('.mi') && !e.target.closest('#userChip')) closePop(); }
function closePop(){
  const box = $('#popMenu'); if(box) box.classList.remove('open');
  $$('#menubar .mi').forEach(b => b.classList.remove('on'));
  $$('.pop-anchor').forEach(b => b.classList.remove('pop-anchor'));
  document.removeEventListener('pointerdown', onDocDownForPop, true);
}

/* ── 侧栏开关：宽屏折叠 / 窄屏抽屉 ───────────────────────────────────
   同一个按钮两种语义：宽屏把左栏折叠成 0 列（记住设置），窄屏开关浮层抽屉。
   宽屏也能用很重要 —— 打开「数字人直播画面」时，用户最想做的就是让画面占满宽度。 */
function toggleNav(){
  const root = document.documentElement;
  const btn = $('#navToggle');
  if(narrowNav()){
    const open = root.dataset.nav === 'open';
    root.dataset.nav = open ? '' : 'open';
    if(btn) btn.setAttribute('aria-expanded', String(!open));
    return;
  }
  const collapsed = root.dataset.nav === 'collapsed';
  root.dataset.nav = collapsed ? '' : 'collapsed';
  S.navCollapsed = !collapsed;
  saveSettings();
  if(btn) btn.setAttribute('aria-expanded', String(collapsed));
}

let __lastWinTitle = '';
/** 把 document.title 同步到原生窗口标题（任务栏 / Alt+Tab 才能看出当前模块）。
    网页端没有宿主桥接，document.title 本身已经够了，直接跳过。
    值没变就不重复推 —— 每次切换标签都会走这里，重复 IPC 没有意义。 */
function syncWindowTitle(){
  if(!hasBridge()) return;
  const t = document.title || '';
  if(!t || t === __lastWinTitle) return;
  __lastWinTitle = t;
  bridge('set_window_title', t);
}

/* ── 窄屏导航抽屉（≤900px 时侧栏是浮层）────────────────────────────── */
function narrowNav(){ return window.innerWidth <= 900; }
/** 侧栏当前是否处于“看不见”的状态（宽屏折叠 或 窄屏抽屉收起） */
function navHidden(){
  const nav = document.documentElement.dataset.nav;
  return narrowNav() ? nav !== 'open' : nav === 'collapsed';
}
/** force=true 表示无条件收起（窗口变宽后清掉残留的 open 状态） */
function closeNavDrawer(force){
  if(!force && !narrowNav()) return;
  if(document.documentElement.dataset.nav === 'open'){
    document.documentElement.dataset.nav = '';
    const t = $('#navToggle'); if(t) t.setAttribute('aria-expanded', 'false');
  }

/* ── 17.8 快捷键 ──────────────────────────────────────────────────── */
function bindShortcuts(){
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ closePop(); if($('#modalLayer').classList.contains('open')) closeModal(); return; }
    const ctrl = e.ctrlKey || e.metaKey;
    if(!ctrl){ if(e.key === 'F1'){ e.preventDefault(); openModule('about'); } return; }
    const k = e.key.toLowerCase();
    if(k === 'r'){ e.preventDefault(); $('#btnRefresh').click(); }
    else if(k === 'w'){ e.preventDefault(); if(currentApp()) closeTab(currentApp().id); }
    else if(k === 'k'){ e.preventDefault(); $('#navSearch').focus(); $('#navSearch').select(); }
    else if(k === 'b'){ e.preventDefault(); toggleNav(); }
    else if(k === ','){ e.preventDefault(); openModule('settings'); }
    else if(k === 'l'){ e.preventDefault(); openModule('logs'); }
    else if(k === 'q'){ if(!isDesktop()) return; e.preventDefault(); exitApp(); }
    else if(k === 'tab'){
      e.preventDefault();
      const ids = WM.order.slice(); if(ids.length < 2) return;
      const cur = currentApp() ? currentApp().id : ids[ids.length - 1];
      const i = ids.indexOf(cur);
      const next = ids[(i + (e.shiftKey ? -1 : 1) + ids.length) % ids.length];
      activateTab(next);
    }
    else if(/^[1-9]$/.test(k)){
      const ids = WM.order.slice(); const id = ids[Number(k) - 1];
      if(id){ e.preventDefault(); activateTab(id); }
    }
  });
}

/* ── 17.9 桌面宿主（pywebview）桥接 ───────────────────────────────────
   同一份 app.html 两端共用：桌面端由 pywebview 注入 window.pywebview.api，提供“打开系统
   浏览器 / 文件夹 / 重启服务 / 退出应用 / 全屏”等本机能力；网页端（纯浏览器）这些
   **桌面专属入口直接不渲染**（判定见 17.5a 的 isDesktop()），不是显示成禁用状态。 */
const APP_HOST = {managed: false, version: '', frozen: false, project_root: '', log_dir: '', webview: '', host_os: '', python: ''};
function hostReady(){
  if(!hasBridge()) return;
  applyEndChrome();   /* 桥接就绪后重判一次端（防止窗口打开瞬间桥接还没注入） */
  bridge('get_app_info').then(info => {
    if(info && typeof info === 'object'){ Object.assign(APP_HOST, info); }
    const v = $('#brandVer');
    if(v) v.textContent = '桌面版 v' + (APP_HOST.version || APP_VERSION) + (APP_HOST.managed ? ' · 已托管服务' : '');
    renderAccount(); renderStatusBar();
    const w = WM.wins.get('about');
    if(w && w.paneRefresh){ try{ w.paneRefresh(); }catch(e){} }
  });
}
window.addEventListener('pywebviewready', hostReady);
setTimeout(() => { if(hasBridge() && !APP_HOST.version) hostReady(); }, 1200);

/** 打开链接：桌面版交给系统浏览器，浏览器版退回 window.open */
function openExternal(url){
  const abs = (() => { try{ return new URL(url, location.href).href; }catch(e){ return url; } })();
  if(hasBridge()){ bridge('open_external', abs); return; }
  window.open(abs, '_blank', 'noopener');
}

    $$('#setTabs button', pane).forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; draw(); }));
    const cur = $('#setTabs button[data-t="' + tab + '"]', pane); if(cur) cur.classList.add('on');
    drawTab(tab);
    $('#setReset', pane).onclick = () => confirmBox('恢复默认设置', '将恢复主题、行为等全部界面设置（不影响商品、话术与账号）。', () => {
      S = Object.assign({}, DEFAULTS); saveSettings(); applySettings(); draw();
      toast('ok', '已恢复默认', '界面设置已重置');
    }, true);
  }

  function drawTab(t){
    const body = $('#setBody', pane);
    if(t === 'look'){
      body.innerHTML =
        '<div class="card"><h3>' + svgIcon('image') + '主题</h3>' +
          setRow('主题模式', '浅色 / 深色 / 跟随 Windows', segOf('theme', [['light', '浅色'], ['dark', '深色'], ['auto', '跟随系统']])) +
          setRow('主色', '默认浅蓝，可换同色系变体', '<div class="swatches" data-sw2="accent">' +
            ACCENTS.map(([v, c, n]) => '<span class="sw' + (S.accent === v ? ' on' : '') + '" data-v="' + v + '" title="' + n + '" style="background:' + c + '"></span>').join('') + '</div>') +
        '</div>' +
        '<div class="card"><h3>' + svgIcon('monitor') + '界面</h3>' +
          setRow('界面动画', '关闭可减少低配设备的开销', sw('animations')) +
          setRow('弹出提示', '操作结果用右下角提示条反馈', sw('toasts')) +
        '</div>';
    }
    if(t === 'act'){
      body.innerHTML =
        '<div class="card"><h3>' + svgIcon('grid') + '启动与标签</h3>' +
          setRow('恢复上次打开的标签', '下次启动自动恢复退出前打开的模块', sw('autoOpenLast')) +
          setRow('启动时自动打开', '服务就绪后额外打开一个模块', '<select id="setAuto"><option value="">不额外打开</option>' +
            APPS.map(a => '<option value="' + a.id + '"' + ((S.autoOpen || [])[0] === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>').join('') + '</select>') +

        '<dt>端口</dt><dd>' + esc(BASE_PORT) + '</dd>',

      ];
      const btns = ['<button class="btn ghost" id="svcProbe">' + svgIcon('refresh') + '<span>重新读取状态</span></button>'];
      if(desk){
        /* 这三行/三个按钮都是桌面宿主的能力：服务托管、界面内核、重启服务、本地文件夹 */
        kv.push('<dt>服务托管</dt><dd>' + (managed ? '<span class="badge ok">由本应用启动</span> 退出应用会一并停止' : '<span class="badge info">外部启动</span> 退出应用不会停止它') + '</dd>');

      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      location.reload();
    }, true));
  }

  draw();
  return {refresh: draw};
};

        (desk ? '<dt>构建类型</dt><dd>' + (APP_HOST.frozen ? '已打包 exe' : '源码运行') + '</dd>' : '') +
      '</div></div>' +
      '<div class="card"><h3>' + svgIcon('alert') + '合规与授权提示</h3><div class="hint">' +
        '① 平台要求标注 AI 生成内容时请如实标注，并保留必要的标识；<br>' +
        '② 不要使用未授权的真人肖像、声音、音乐、字体与商品素材；<br>' +
        '③ 直播过程请保留真人值守，紧急停止与安全下播随时可用；<br>' +
        '④ 本项目基于 LiveTalking 等开源组件，商用前请确认各自许可证。' +
      '</div></div>' +
      '<div class="card"><h3>' + svgIcon('keyboard') + '快捷键</h3><div class="row">' +
        '<button class="btn ghost" id="abKeys">' + svgIcon('keyboard') + '<span>查看全部快捷键</span></button>' +
        (desk ? '<button class="btn ghost" id="abFolder">' + svgIcon('folder') + '<span>打开项目文件夹</span></button>' : '') +
      '</div></div>';

    const cp = $('#abCopy', pane); if(cp) cp.addEventListener('click', () => copyText([
      appName() + ' 诊断信息',
      '时间：' + new Date().toLocaleString('zh-CN'),
      '应用版本：' + APP_VERSION + (desk ? '（' + (APP_HOST.frozen ? 'exe' : '源码') + '）' : ''),
      '运行端：' + (desk ? '桌面端' : '网页端（浏览器）'),
      '运行模式：' + MODE,
      '服务地址：' + (MODE === 'live' ? location.origin : '未连接')
    ].concat(desk ? [
      '服务托管：' + (APP_HOST.managed ? '本应用启动' : '外部启动'),
      '界面内核：' + (APP_HOST.webview || navigator.userAgent),
      '项目根目录：' + (APP_HOST.project_root || '—')
    ] : []).concat([
      '操作系统：' + (APP_HOST.host_os || navigator.platform),
      '账号：' + (u ? u.username + ' / ' + (u.plan_label || u.plan) : '未登录'),
      '直播状态：' + (ST ? (ST.live_state || '—') + ' / 输出' + (ST.output_connected ? '已连接' : '未连接') : '—')
    ]).join('\n'), '诊断信息'));
    const up = $('#abUpgrade', pane); if(up) up.addEventListener('click', () => openExternal('/upgrade.html'));
    const lo = $('#abLogout', pane); if(lo) lo.addEventListener('click', () => confirmBox('退出登录', '退出后回到登录页（不会停止数字人服务）。', () => { location.href = '/api/auth/logout'; }, true));
    const dk = $('#abKeys', pane); if(dk) dk.addEventListener('click', showShortcuts);
    const fd = $('#abFolder', pane); if(fd) fd.addEventListener('click', () => bridge('open_project_folder'));
    const dd = $('#abDocs', pane); if(dd) dd.addEventListener('click', () => openModule('tutorial'));
  }
  draw();
  return {refresh: draw};
};

/* ── 17.12 启动流程 ───────────────────────────────────────────────── */
const APP_BOOT_AT = Date.now();
function bootStep(text, pct){
  const box = $('#bootSteps');
  box.insertAdjacentHTML('beforeend', '<div><i>✓</i>' + esc(text) + '</div>');
  $('#bootBar').style.width = pct + '%';
}
function bootFail(text){ $('#bootSteps').insertAdjacentHTML('beforeend', '<div style="color:#ffb4b4">✗ ' + esc(text) + '</div>'); }

async function boot(){
  applyEndChrome();   /* 标题 / 品牌小字 / 工具栏按钮按端区分 */
  bootStep('初始化应用外壳', 10);
  applySettings();
  if(S.navCollapsed && !narrowNav()) document.documentElement.dataset.nav = 'collapsed';
  const nt = $('#navToggle'); if(nt) nt.setAttribute('aria-expanded', String(!S.navCollapsed));
  bindShell(); bindShortcuts(); bindAppGlobals(); renderNav(''); renderAccount(); syncTabbar();
  $('#app').hidden = false;

  if(canServe && FORCE !== 'demo'){
    $('#bootSub').textContent = '正在连接本地服务…';
    try{
      /* 必须先切到 live 再调 Data.*，否则会走离线演示分支 */
      MODE = 'live';
      bootStep('连接本地服务 ' + location.host, 32);
      ACCOUNT = await Promise.race([apiGet('/api/auth/me'), new Promise((_, rej) => setTimeout(() => rej(new Error('账号接口超时')), 6000))]);
      bootStep('读取运行状态（GET /api/live/status）', 62);
      ST = await Data.status();
      bootStep('服务已连接：输出' + (ST && ST.output_connected ? '已连接' : '未连接') + '，直播状态 ' + ((ST && ST.live_state) || '—'), 84);
      PROVIDERS = [];
    }catch(e){
      MODE = 'demo';
      bootFail('未能连接本地服务（' + ((e && e.message) || e) + '），已降级为离线演示模式');
    }
  }else{
    bootStep('以 file:// 打开或强制演示模式 → 离线演示', 60);
    MODE = 'demo';
  }

  if(!ST){ try{ ST = await Data.status(); }catch(e){ ST = null; } }
  updateModeChip(); renderStatusBar(ST); renderAccount(); renderNav('');
  startPolling();
  hostReady();

  bootStep('构建导航与标签页', 100);
  $('#bootSub').textContent = MODE === 'live' ? '服务已就绪' : '离线演示模式';
  setTimeout(() => {
    const bootEl = $('#boot');
    if(bootEl){ bootEl.classList.add('hide'); setTimeout(() => bootEl.remove(), 340); }

    const want = params.get('open');
    const restore = (S.autoOpenLast && Array.isArray(S.tabs)) ? S.tabs.filter(id => APP_MAP[id]) : [];
    const openList = want && APP_MAP[want] ? [want].concat(restore.filter(id => id !== want)) : (restore.length ? restore : ['control']);
    openList.forEach(id => openModule(id));
    if(S.activeTab && WM.wins.has(S.activeTab)) activateTab(S.activeTab);
    if(!WM.wins.size) showWelcome();

    if(MODE === 'live'){
      if(ACCOUNT && ACCOUNT.auth_enabled && ACCOUNT.authenticated === false){
        modal({title: '需要登录', icon: 'lock', body: '<p>当前未登录，部分模块会被服务端拦截。</p><p class="hint">登录后本页会自动恢复。</p>',
          buttons: [{text: '稍后', action: closeModal}, {text: '去登录', primary: true, action: () => { location.href = '/login.html?next=' + encodeURIComponent('/app.html'); }}]});
      }else{
        notify('ok', '已就绪', '服务 ' + location.host);
      }
    }else{
      /* 离线演示这件事在标题栏徽标、面板顶部的黄条、左下角说明里已经讲了三遍，
         再弹一条 8 秒的提示条只会白盖住右下角的卡片，所以只进通知中心、不弹条。 */
      notify('warn', '离线演示模式', '未连接本地服务，界面数据为演示数据；启动服务后从 8010 端口打开即为完整功能。', true);
    }
    console.log('[app] 启动完成，用时 ' + (Date.now() - APP_BOOT_AT) + 'ms，模式 ' + MODE);
  }, MODE === 'live' ? 260 : 460);
}
boot().catch(e => { bootFail('启动失败：' + ((e && e.message) || e)); console.error(e); });
</script>
