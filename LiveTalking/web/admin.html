<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理 - LiveTalking</title>
    <!-- 注意：Bootstrap 必须排在 common.css 之前，否则会覆盖设计系统 v3 的组件样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        /* 页面级补充样式：组件外观一律交给 common.css v3，这里只保留本页独有的钩子 */

        /* 单条活跃会话 */
        .session-card {
            padding: var(--space-4);
            margin-bottom: var(--space-3);
            border-left: 3px solid var(--primary);
        }

        .session-card:last-child { margin-bottom: 0; }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .session-id {
            font-family: var(--font-mono);
            font-size: 13.5px;
            font-weight: 650;
            color: var(--text);
            word-break: break-all;
        }

        .session-detail-item {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--space-1);
        }

        .session-detail-item strong {
            color: var(--text-muted);
            font-weight: 550;
            margin-right: 6px;
        }

        .session-customopt {
            margin: var(--space-1) 0 0;
            padding: var(--space-2);
            background: var(--surface-sunken);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 11.5px;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-secondary);
        }

        .session-count {
            margin-left: var(--space-2);
            padding: 2px 10px;
            border-radius: var(--radius-pill);
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid var(--primary-border);
            font-size: 12.5px;
            font-weight: 650;
        }
    </style>
</head>

<body>
    <nav id="lt-nav-container"></nav>
    <div class="container">
        <div class="page-heading">
            <h1 class="page-title"><i class="bi bi-speedometer2"></i> 系统管理</h1>
            <p class="page-subtitle">全局运行参数与实时会话监控（只读）</p>
            <div class="actions">
                <a class="btn btn-sm btn-outline" href="/index.html" title="前往数字人驱动页面建立实时连接">
                    <i class="bi bi-plug"></i> 连接数字人
                </a>
                <a class="btn btn-sm btn-outline" href="/console.html" title="前往控制台调整推流与开播设置">
                    <i class="bi bi-broadcast"></i> 前往开播
                </a>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="refreshData()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新数据
                </button>
            </div>
        </div>

        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i>
            <div class="alert-body">
                <div class="alert-title">本页只用于查看运行状态，不提供修改入口</div>
                若导航栏显示「未连接」，请先到 <a href="/index.html">数字人驱动</a> 页面建立实时连接；
                若下方「推流地址」显示未设置，请到 <a href="/console.html">控制台</a> 完成推流与开播配置。
            </div>
        </div>

        <div class="row g-4">
            <!-- 全局配置 -->
            <div class="col-lg-7">
                <div class="glass-card">
                    <div class="card-header">
                        <i class="bi bi-gear-fill"></i> 全局配置
                        <span class="card-subtitle ms-auto">只读 · 来自后端运行配置</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-borderless config-table" id="configTable">
                                <tbody>
                                    <tr>
                                        <th>加载中…</th>
                                        <td>
                                            <div class="skeleton" style="height: 14px; max-width: 150px;"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>加载中…</th>
                                        <td>
                                            <div class="skeleton" style="height: 14px; max-width: 190px;"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>加载中…</th>
                                        <td>
                                            <div class="skeleton" style="height: 14px; max-width: 120px;"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 活跃会话 -->
            <div class="col-lg-5 card-fill-reset">
                <div class="glass-card">
                    <div class="card-header">
                        <i class="bi bi-people-fill"></i> 活跃会话
                        <span class="session-count" id="sessionCount">0</span>
                        <span class="card-subtitle ms-auto"><i class="bi bi-arrow-repeat"></i> 每 5 秒自动刷新</span>
                    </div>
                    <div class="card-body" id="sessionsContainer">
                        <div class="session-card panel">
                            <div class="skeleton skeleton-title"></div>
                            <div class="skeleton skeleton-text"></div>
                            <div class="skeleton skeleton-text"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        const configLabels = {
            'model': '数字人模型',
            'avatar_id': '数字人形象 ID',
            'tts': '语音合成引擎',
            'REF_FILE': '音色参考文件',
            'transport': '传输协议',
            'listenport': '监听端口',
            'batch_size': '推理批次',
            'fps': '视频帧率',
            'push_url': '推流地址'
        };

        /** 值旁边补一句中文说明，避免技术标识符裸露 */
        const configHints = {
            'transport': '实时连接协议',
            'tts': '当前语音合成服务'
        };

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        async function fetchConfig() {
            try {
                const response = await fetch('/api/admin/config');
                const result = await response.json();
                if (result.code === 0) {
                    renderConfig(result.data.config);
                } else {
                    console.error('Failed to fetch config:', result.msg);
                    LT.Toast.error('获取配置失败', result.msg);
                }
            } catch (err) {
                console.error('Network error fetching config', err);
                LT.Toast.error('网络错误', '无法获取配置 - ' + err.message);
            }
        }

        async function fetchSessions() {
            try {
                const response = await fetch('/api/admin/sessions');
                const result = await response.json();
                if (result.code === 0) {
                    renderSessions(result.data.sessions);
                    $('#sessionCount').text(result.data.sessions.length);
                } else {
                    console.error('Failed to fetch sessions:', result.msg);
                    LT.Toast.error('获取会话失败', result.msg);
                }
            } catch (err) {
                console.error('Network error fetching sessions', err);
                LT.Toast.error('网络错误', '无法获取会话 - ' + err.message);
            }
        }

        function renderConfig(config) {
            const tableBody = $('#configTable tbody');
            tableBody.empty();

            for (const [key, label] of Object.entries(configLabels)) {
                if (config[key] === undefined) continue;

                const raw = config[key];
                let cell;

                if (raw === '' || raw === null) {
                    cell = '<span class="text-muted">未设置</span>';
                    if (key === 'push_url') {
                        cell += ' <a class="btn btn-outline btn-sm ms-2" href="/console.html" ' +
                            'title="前往控制台完成推流与开播配置"><i class="bi bi-sliders"></i> 去设置</a>';
                    }
                } else {
                    const hint = configHints[key]
                        ? ` <span class="text-muted fs-xs">（${configHints[key]}）</span>`
                        : '';
                    cell = `<span class="text-mono text-break">${escapeHtml(raw)}</span>${hint}`;
                }

                tableBody.append(`
                    <tr>
                        <th>${label}</th>
                        <td>${cell}</td>
                    </tr>
                `);
            }
        }

        function renderSessions(sessions) {
            const container = $('#sessionsContainer');
            container.empty();

            if (sessions.length === 0) {
                container.append(`
                    <div class="empty-state compact">
                        <i class="bi bi-inbox empty-state-icon"></i>
                        <h4>暂无活跃会话</h4>
                        <p>在「数字人驱动」页面连接成功后，会话会自动出现在这里。</p>
                        <a class="btn btn-outline btn-sm" href="/index.html">
                            <i class="bi bi-plug"></i> 去连接数字人
                        </a>
                    </div>
                `);
                return;
            }

            sessions.forEach(session => {
                const statusBadge = session.speaking
                    ? `<span class="badge-status badge-speaking"><i class="bi bi-mic-fill"></i> 说话中</span>`
                    : `<span class="badge-status badge-silent"><i class="bi bi-mic-mute-fill"></i> 静音</span>`;

                const recBadge = session.recording
                    ? `<span class="badge-status badge-recording ms-2"><i class="bi bi-record-circle"></i> 录制中</span>`
                    : '';

                const customOptContent = session.customopt && session.customopt.length > 0
                    ? `<pre class="session-customopt">${escapeHtml(JSON.stringify(session.customopt, null, 2))}</pre>`
                    : '<span class="text-muted">无</span>';

                container.append(`
                    <div class="session-card panel">
                        <div class="session-header">
                            <div>
                                <span class="session-id">会话 ID：${escapeHtml(session.sessionid)}</span>
                                <div class="fs-xs text-muted mt-1">
                                    传输协议：<span class="text-mono">${escapeHtml(session.transport || '默认')}</span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center">
                                ${statusBadge}
                                ${recBadge}
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="session-detail-item">
                                    <strong>数字人形象 ID</strong>
                                    <span class="text-mono text-break">${escapeHtml(session.avatar_id)}</span>
                                </div>
                                <div class="session-detail-item">
                                    <strong>数字人模型</strong>
                                    <span class="text-mono text-break">${escapeHtml(session.model)}</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="session-detail-item">
                                    <strong>音色参考文件</strong>
                                    <span class="text-mono text-break">${escapeHtml(session.REF_FILE)}</span>
                                </div>
                                <div class="session-detail-item">
                                    <strong><i class="bi bi-sliders"></i> 动作编排</strong>
                                    ${customOptContent}
                                </div>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        function refreshData() {
            const icon = $('.bi-arrow-clockwise');
            icon.addClass('spin');

            Promise.all([fetchConfig(), fetchSessions()]).finally(() => {
                setTimeout(() => icon.removeClass('spin'), 500);
            });
        }

        $('<style> .spin { animation: rotation 1s linear infinite; } @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } } </style>').appendTo('head');

        $(document).ready(() => {
            LT.Nav.current = 'admin';
            LT.Nav.inject('#lt-nav-container');

            fetchConfig();
            fetchSessions();

            setInterval(fetchSessions, 5000);
        });
    </script>
</body>

</html>
