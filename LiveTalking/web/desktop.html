<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="sky" data-wallpaper="aurora" data-icon-size="md" data-taskbar="bottom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI 数字人 · 桌面版</title>
<!--
  AI 数字人桌面版（单文件，无外部依赖，无外部图片）
  ─ live 模式：由 LiveTalking 服务（默认 127.0.0.1:8010）提供，窗口内嵌真实业务页面，
               原生窗口直接调用真实接口（/api/live/*、/api/workflow/*、/health …）。
  ─ demo 模式：file:// 打开或服务不可达时自动降级为离线演示（不访问任何接口）。
  主题用 CSS 变量控制，主色为浅蓝；窗口层级用绝对定位 + z-index 管理。
-->
<style>
/* ═══════════════════════════ 1. 设计令牌（主题变量） ═══════════════════════════ */
:root{
  /* 主色：浅蓝（默认）。可在“设置 → 外观 → 主色”切换，只改这一组变量 */
  --brand:#38bdf8; --brand-strong:#0ea5e9; --brand-deep:#0284c7;
  --brand-soft:#e0f2fe; --brand-tint:rgba(56,189,248,.16); --brand-ring:rgba(14,165,233,.34);
  --on-brand:#062a3d;

  --text:#0f2438; --text-2:#4a6076; --text-3:#7d90a4;
  --line:rgba(15,40,70,.10); --line-strong:rgba(15,40,70,.18);
  --surface:#ffffff; --surface-2:#f4f8fc; --surface-3:#e9f1f8;
  --glass:rgba(250,253,255,.82); --glass-solid:#f8fbfe;
  --ok:#0f9d6e; --ok-bg:#e6f7f0; --warn:#c47f0a; --warn-bg:#fdf3e2;
  --err:#d64545; --err-bg:#fdecec; --info:#2f7fd8; --info-bg:#e8f1fd;
  --shadow-win:0 22px 56px rgba(12,38,66,.26), 0 3px 10px rgba(12,38,66,.14);
  --shadow-soft:0 8px 24px rgba(12,38,66,.12);
  --shadow-pop:0 16px 44px rgba(12,38,66,.22);
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --title-h:38px; --taskbar-h:52px;
  --font:'Segoe UI Variable','Segoe UI','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'Cascadia Mono','JetBrains Mono',Consolas,'Courier New',monospace;
  --t-fast:.14s cubic-bezier(.2,.7,.3,1); --t-base:.22s cubic-bezier(.2,.7,.3,1);
}
/* 深色主题：只需覆盖下面这些变量 */
html[data-theme="dark"]{
  --text:#e8f1fa; --text-2:#a9bccd; --text-3:#7d92a6;
  --line:rgba(160,196,226,.16); --line-strong:rgba(160,196,226,.26);
  --surface:#161f2b; --surface-2:#1d2836; --surface-3:#243040;
  --glass:rgba(20,29,40,.82); --glass-solid:#141d28;
  --ok:#3fcf9a; --ok-bg:rgba(24,160,120,.16); --warn:#f0b45c; --warn-bg:rgba(196,127,10,.18);
  --err:#f08a8a; --err-bg:rgba(214,69,69,.18); --info:#7fb6f0; --info-bg:rgba(47,127,216,.18);
  --shadow-win:0 22px 56px rgba(0,0,0,.55), 0 3px 10px rgba(0,0,0,.45);
  --shadow-soft:0 8px 24px rgba(0,0,0,.4);
  --shadow-pop:0 16px 44px rgba(0,0,0,.5);
  --on-brand:#04222f;
}
/* 主色备选（默认 sky＝浅蓝，符合“主色调：浅蓝色”） */
html[data-accent="azure"]{--brand:#60a5fa;--brand-strong:#3b82f6;--brand-deep:#2563eb;--brand-soft:#e8f0fe;--brand-tint:rgba(96,165,250,.16);--brand-ring:rgba(59,130,246,.34)}
html[data-accent="cyan"]{--brand:#22d3ee;--brand-strong:#06b6d4;--brand-deep:#0891b2;--brand-soft:#e0fbfe;--brand-tint:rgba(34,211,238,.16);--brand-ring:rgba(6,182,212,.34)}
html[data-accent="teal"]{--brand:#2dd4bf;--brand-strong:#14b8a6;--brand-deep:#0d9488;--brand-soft:#e2fbf6;--brand-tint:rgba(45,212,191,.16);--brand-ring:rgba(20,184,166,.34)}
html[data-accent="indigo"]{--brand:#818cf8;--brand-strong:#6366f1;--brand-deep:#4f46e5;--brand-soft:#eef0fe;--brand-tint:rgba(129,140,248,.16);--brand-ring:rgba(99,102,241,.34)}

/* ═══════════════════════════ 2. 基础重置 ═══════════════════════════ */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--font); color:var(--text); background:#8fb6d6;
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  user-select:none; /* 桌面软件观感：默认不可选中文本，正文区域再放开 */
}
body.no-anim *{transition:none!important;animation:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand-strong);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ═══════════════════════════ 3. 桌面与壁纸 ═══════════════════════════ */
#desk{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;z-index:0;transition:background var(--t-base)}
#wallpaper::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,36,.10),rgba(4,20,36,.26))}
.wp-glow{position:absolute;inset:0;pointer-events:none}
/* 5 套 CSS 渐变壁纸（不引用任何外部图片） */
html[data-wallpaper="aurora"] #wallpaper{background:
  radial-gradient(120% 90% at 12% 8%, #c7ecff 0%, rgba(199,236,255,0) 55%),
  radial-gradient(100% 80% at 88% 12%, #bfe0ff 0%, rgba(191,224,255,0) 60%),
  radial-gradient(120% 100% at 70% 95%, #d7f2e8 0%, rgba(215,242,232,0) 55%),
  linear-gradient(160deg,#eaf6ff 0%,#d3e9fb 45%,#c2ddf5 100%)}
html[data-wallpaper="deepsea"] #wallpaper{background:
  radial-gradient(110% 80% at 20% 10%, #2f6f9e 0%, rgba(47,111,158,0) 60%),
  radial-gradient(120% 90% at 85% 85%, #164a६b 0%, rgba(22,74,107,0) 55%),
  linear-gradient(160deg,#0d2f4a 0%,#123c5c 50%,#0a2338 100%)}
html[data-wallpaper="paper"] #wallpaper{background:
  radial-gradient(80% 60% at 30% 20%, #ffffff 0%, rgba(255,255,255,0) 70%),
  linear-gradient(150deg,#f7fafc 0%,#eef4f9 55%,#e6eef6 100%)}
html[data-wallpaper="mist"] #wallpaper{background:
  radial-gradient(90% 70% at 15% 85%, #dff1ff 0%, rgba(223,241,255,0) 60%),
  linear-gradient(140deg,#eef7ff 0%,#cfe4f7 60%,#bcd8f0 100%)}
html[data-wallpaper="carbon"] #wallpaper{background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,0) 2px 6px),
  radial-gradient(100% 80% at 80% 10%, #1d3f5c 0%, rgba(29,63,92,0) 60%),
  linear-gradient(160deg,#101a24 0%,#152736 55%,#0c141d 100%)}
html[data-wallpaper="none"] #wallpaper{background:linear-gradient(180deg,#e8f2fa,#d5e6f4)}
html[data-theme="dark"][data-wallpaper="aurora"] #wallpaper{background:
  radial-gradient(120% 90% at 12% 8%, #1d4f70 0%, rgba(29,79,112,0) 55%),
  radial-gradient(110% 90% at 85% 88%, #14384f 0%, rgba(20,56,79,0) 55%),
  linear-gradient(160deg,#0d1b26 0%,#12283a 50%,#0a1620 100%)}
html[data-theme="dark"][data-wallpaper="paper"] #wallpaper{background:linear-gradient(160deg,#1a2430,#131c26)}
html[data-theme="dark"][data-wallpaper="mist"] #wallpaper{background:linear-gradient(150deg,#14212e,#1b3247)}

/* 桌面图标层 */
#iconLayer{position:absolute;inset:0 0 var(--taskbar-h) 0;z-index:1;padding:14px;
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,var(--cell-h));gap:2px;align-content:start;justify-content:start}
html[data-taskbar="top"] #iconLayer{inset:var(--taskbar-h) 0 0 0}
html[data-icon-size="sm"]{--cell-w:82px;--cell-h:88px;--icon-w:40px;--icon-h:40px}
html[data-icon-size="md"]{--cell-w:98px;--cell-h:104px;--icon-w:50px;--icon-h:50px}
html[data-icon-size="lg"]{--cell-w:118px;--cell-h:124px;--icon-w:62px;--icon-h:62px}
.icon{width:var(--cell-w);height:var(--cell-h);border-radius:var(--radius-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:6px 4px;text-align:center;position:relative;transition:background var(--t-fast)}
.icon:hover{background:rgba(255,255,255,.22)}
html[data-theme="dark"] .icon:hover{background:rgba(255,255,255,.10)}
.icon.sel{background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand-ring)}
.icon .glyph{width:var(--icon-w);height:var(--icon-h);display:grid;place-items:center;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.72));
  box-shadow:0 6px 16px rgba(10,32,56,.18),inset 0 0 0 1px rgba(255,255,255,.7);color:var(--brand-deep)}
html[data-theme="dark"] .icon .glyph{background:linear-gradient(180deg,rgba(48,66,88,.95),rgba(28,42,58,.9));color:var(--brand);box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.icon .glyph svg{width:58%;height:58%}
.icon .label{font-size:12px;line-height:1.25;color:#fff;text-shadow:0 1px 3px rgba(0,20,40,.75);
  max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
html[data-theme="dark"] .icon .label{color:#e6f1fb}
.icon .badge{position:absolute;top:6px;right:calc(50% - var(--icon-w)/2 - 2px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--err);color:#fff;font-size:10px;line-height:16px;font-weight:600}
.icon.free{position:absolute}
#marquee{position:absolute;z-index:2;border:1px solid var(--brand-strong);background:var(--brand-tint);border-radius:3px;display:none;pointer-events:none}

/* 拖动/缩放时铺一层“盾牌”，避免指针进入 iframe 丢失事件 */
#dragShield{position:fixed;inset:0;z-index:9000;display:none;cursor:default}
body.dragging #dragShield{display:block}
body.dragging{cursor:grabbing}
#snapPreview{position:absolute;z-index:5;border:2px solid var(--brand-strong);background:var(--brand-tint);
  border-radius:var(--radius-lg);display:none;pointer-events:none;backdrop-filter:blur(2px);transition:all .12s ease}

/* ═══════════════════════════ 4. 窗口系统 ═══════════════════════════ */
#winLayer{position:absolute;inset:0;z-index:10;pointer-events:none} /* 层本身穿透，窗口自己接收事件 */
.wm-window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:320px;min-height:200px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line-strong);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-win);overflow:hidden;
  transition:opacity var(--t-base),transform var(--t-base),box-shadow var(--t-fast),border-color var(--t-fast)}
.wm-window.inactive{box-shadow:var(--shadow-soft);border-color:var(--line)}
.wm-window.inactive .wm-title{color:var(--text-2)}
.wm-window.dragging,.wm-window.resizing{transition:none;will-change:left,top,width,height}
.wm-window.is-max{border-radius:0}
.wm-window.is-min{opacity:0;transform:scale(.94) translateY(26px);pointer-events:none}
.wm-window.opening{animation:winIn .18s cubic-bezier(.2,.8,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}
body.no-anim .wm-window.opening{animation:none}

.wm-titlebar{height:var(--title-h);flex:0 0 var(--title-h);display:flex;align-items:center;gap:8px;padding:0 0 0 12px;
  cursor:grab;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22));border-bottom:1px solid var(--line)}
html[data-theme="dark"] .wm-titlebar{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.wm-window.dragging .wm-titlebar{cursor:grabbing}
.wm-ico{width:18px;height:18px;flex:0 0 18px;color:var(--brand-deep);display:grid;place-items:center}
html[data-theme="dark"] .wm-ico{color:var(--brand)}
.wm-ico svg{width:100%;height:100%}
.wm-title{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.wm-sub{font-size:11px;color:var(--text-3);white-space:nowrap}
.wm-btns{display:flex;align-items:stretch;flex:0 0 auto;height:100%}
.wm-btn{width:44px;display:grid;place-items:center;color:var(--text-2);transition:background var(--t-fast),color var(--t-fast)}
.wm-btn:hover{background:var(--line)}
.wm-btn.close:hover{background:var(--err);color:#fff}
.wm-btn svg{width:11px;height:11px}
.wm-body{flex:1;min-height:0;position:relative;background:var(--surface);overflow:hidden}
.wm-body.scroll{overflow:auto}
.wm-body.user-select{user-select:text}
.wm-frame{width:100%;height:100%;border:0;display:block;background:var(--surface)}
.wm-pane{padding:16px 18px;user-select:text}
/* 窗口边缘缩放手柄 */
.wm-grip{position:absolute;z-index:3}
.wm-grip.n{top:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.wm-grip.s{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.wm-grip.w{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.wm-grip.e{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.wm-grip.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.wm-grip.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.wm-grip.sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.wm-grip.se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}
.wm-window.is-max .wm-grip{display:none}
/* 加载状态（iframe 载入时的骨架屏） */
.wm-loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface);z-index:4}
.wm-loading .box{text-align:center;color:var(--text-3);font-size:12.5px}
.spinner{width:30px;height:30px;margin:0 auto 10px;border:3px solid var(--brand-tint);border-top-color:var(--brand-strong);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:4px;border-radius:4px;overflow:hidden;background:var(--line);position:relative}
.bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--brand-strong);border-radius:4px;animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.wm-iframe-bar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
.wm-alert{margin:0;padding:7px 12px;font-size:12px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.wm-alert.no{background:var(--err-bg);color:var(--err)}
.wm-alert a{color:inherit;font-weight:600;text-decoration:underline}

/* ═══════════════════════════ 5. 任务栏 ═══════════════════════════ */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:8000;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);border-top:1px solid var(--line)}
html[data-taskbar="top"] #taskbar{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
.tb-group{display:flex;align-items:center;gap:6px;min-width:0}
.tb-group.left{flex:0 0 auto}
.tb-group.right{flex:0 0 auto;margin-left:auto}
#tasks{flex:1 1 auto;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;padding:0 4px}
.tb-btn{height:38px;min-width:38px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;padding:0 10px;
  color:var(--text-2);transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast)}
.tb-btn:hover{background:var(--line);color:var(--text)}
.tb-btn:active{transform:scale(.96)}
.tb-btn svg{width:19px;height:19px}
.tb-btn.start{color:var(--brand-deep)}
html[data-theme="dark"] .tb-btn.start{color:var(--brand)}
.tb-btn.start .glyph{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:linear-gradient(140deg,var(--brand),var(--brand-strong));color:var(--on-brand);box-shadow:0 2px 8px var(--brand-ring)}
.tb-btn.start .glyph svg{width:15px;height:15px}
.task{position:relative;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;padding:0 10px;max-width:190px;
  color:var(--text-2);background:transparent;transition:background var(--t-fast),color var(--t-fast)}
.task:hover{background:var(--line)}
.task .ti{width:18px;height:18px;flex:0 0 18px;color:var(--brand-deep)}
html[data-theme="dark"] .task .ti{color:var(--brand)}
.task .ti svg{width:100%;height:100%}
.task .tt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--text-3);transform:translateX(-50%);transition:all var(--t-fast)}
.task.active{background:var(--brand-tint);color:var(--text)}
.task.active::after{width:16px;background:var(--brand-strong)}
.task.min::after{width:6px;background:var(--brand-strong);opacity:.6}
.tb-chip{height:30px;border-radius:999px;padding:0 10px;font-size:11.5px;display:flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.tb-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.tb-chip.ok .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.tb-chip.err .dot{background:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.tb-chip.warn .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
#clock{height:38px;border-radius:var(--radius-sm);padding:0 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
  color:var(--text-2);line-height:1.15;font-variant-numeric:tabular-nums;transition:background var(--t-fast)}
#clock:hover{background:var(--line)}
#clockTime{font-size:12.5px;font-weight:600;color:var(--text)}
#clockDate{font-size:11px}
#notifyBtn{position:relative}
#notifyDot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--err);display:none}
#notifyBtn.has #notifyDot{display:block}
.tb-sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.tb-btn.pin .mini{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand-deep);border:1px solid var(--line)}
.tb-btn.pin .mini svg{width:13px;height:13px}

/* ═══════════════════════════ 6. 开始菜单 ═══════════════════════════ */
#startMenu{position:fixed;z-index:8200;left:50%;bottom:calc(var(--taskbar-h) + 10px);transform:translateX(-50%) translateY(14px) scale(.98);
  width:min(640px,calc(100vw - 24px));max-height:min(620px,calc(100vh - var(--taskbar-h) - 28px));display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);border:1px solid var(--line-strong);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-pop);opacity:0;visibility:hidden;transition:opacity var(--t-base),transform var(--t-base),visibility var(--t-base)}
html[data-taskbar="top"] #startMenu{bottom:auto;top:calc(var(--taskbar-h) + 10px);transform:translateX(-50%) translateY(-14px) scale(.98)}
#startMenu.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}
.sm-head{padding:16px 18px 10px}
.sm-search{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong)}
.sm-search svg{width:15px;height:15px;color:var(--text-3);flex:0 0 15px}
.sm-search input{flex:1;border:0;background:transparent;outline:none;font-size:13px}
.sm-section{padding:6px 18px 4px;font-size:11.5px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center}
.sm-section button{font-size:11.5px;color:var(--brand-deep)}
html[data-theme="dark"] .sm-section button{color:var(--brand)}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:6px 14px 12px;overflow:auto}
.sm-app{border-radius:var(--radius-sm);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:background var(--t-fast)}
.sm-app:hover{background:var(--line)}
.sm-app .g{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand-deep);box-shadow:var(--shadow-soft)}
html[data-theme="dark"] .sm-app .g{color:var(--brand)}
.sm-app .g svg{width:20px;height:20px}
.sm-app span{font-size:11.5px;text-align:center;color:var(--text-2);line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sm-list{overflow:auto;padding:0 10px 10px;max-height:220px}
.sm-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-2);width:100%;text-align:left}
.sm-row:hover{background:var(--line)}
.sm-row svg{width:15px;height:15px;color:var(--text-3);flex:0 0 15px}
.sm-row .sub{margin-left:auto;font-size:11px;color:var(--text-3)}
.sm-foot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.sm-user{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-2);min-width:0}
.sm-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--brand),var(--brand-strong));color:var(--on-brand);font-weight:700;font-size:12px}
.sm-power{margin-left:auto;display:flex;gap:6px}

/* ═══════════════════════════ 7. 右键菜单 ═══════════════════════════ */
#ctxMenu{position:fixed;z-index:8600;min-width:206px;padding:5px;background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-pop);display:none}
#ctxMenu .mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text);width:100%;text-align:left;position:relative}
#ctxMenu .mi:hover{background:var(--brand-tint)}
#ctxMenu .mi[disabled]{opacity:.45;pointer-events:none}
#ctxMenu .mi .ic{width:16px;height:16px;flex:0 0 16px;color:var(--text-2)}
#ctxMenu .mi .ic svg{width:100%;height:100%}
#ctxMenu .mi .k{margin-left:auto;font-size:11px;color:var(--text-3)}
#ctxMenu .mi .arrow{width:12px;height:12px;color:var(--text-3)}
#ctxMenu .mi .check{width:14px;color:var(--brand-strong);font-weight:700}
#ctxMenu .sep{height:1px;background:var(--line);margin:4px 6px}
#ctxMenu .head{padding:6px 10px 4px;font-size:11px;color:var(--text-3)}

/* ═══════════════════════════ 8. 通知 / 弹窗 / 日历 ═══════════════════════════ */
#toasts{position:fixed;z-index:9000;right:14px;bottom:calc(var(--taskbar-h) + 14px);display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
html[data-taskbar="top"] #toasts{top:calc(var(--taskbar-h) + 14px);bottom:auto}
.toast{pointer-events:auto;width:min(340px,calc(100vw - 28px));display:flex;gap:10px;padding:11px 12px;border-radius:var(--radius);
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line-strong);box-shadow:var(--shadow-pop);
  animation:toastIn .2s cubic-bezier(.2,.8,.3,1);cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateX(18px);transition:all var(--t-base)}
.toast .ti{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.toast .ti svg{width:15px;height:15px}
.toast.ok .ti{background:var(--ok-bg);color:var(--ok)}
.toast.warn .ti{background:var(--warn-bg);color:var(--warn)}
.toast.err .ti{background:var(--err-bg);color:var(--err)}
.toast .tx{min-width:0}
.toast .tx b{display:block;font-size:12.5px;margin-bottom:1px}
.toast .tx p{margin:0;font-size:11.5px;color:var(--text-2);word-break:break-word}

#notifyPanel{position:fixed;z-index:8500;right:12px;bottom:calc(var(--taskbar-h) + 12px);width:min(370px,calc(100vw - 24px));max-height:min(520px,70vh);
  display:none;flex-direction:column;background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line-strong);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);overflow:hidden}
#notifyPanel.open{display:flex}
.np-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}
.np-head button{margin-left:auto;font-size:11.5px;color:var(--brand-deep)}
html[data-theme="dark"] .np-head button{color:var(--brand)}
#npList{overflow:auto;padding:8px}
.np-item{display:flex;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);align-items:flex-start}
.np-item:hover{background:var(--line)}
.np-item .ti{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.np-item .ti svg{width:13px;height:13px}
.np-item .tx{min-width:0;flex:1}
.np-item .tx b{font-size:12px;display:block}
.np-item .tx p{margin:1px 0 0;font-size:11.5px;color:var(--text-2);word-break:break-word}
.np-item .tm{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.np-empty{padding:22px 12px;text-align:center;color:var(--text-3);font-size:12px}

#calendarPop{position:fixed;z-index:8500;right:12px;bottom:calc(var(--taskbar-h) + 12px);width:272px;display:none;padding:12px;
  background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop)}
#calendarPop.open{display:block}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{font-size:13px}
.cal-head button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
.cal-head button:hover{background:var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.cal-grid .dow{color:var(--text-3);font-size:10.5px;padding:2px 0}
.cal-grid .d{padding:5px 0;border-radius:6px;color:var(--text-2);font-variant-numeric:tabular-nums}
.cal-grid .d.other{opacity:.35}
.cal-grid .d.today{background:var(--brand-strong);color:var(--on-brand);font-weight:700}
.cal-foot{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center;gap:8px}

#modalLayer{position:fixed;inset:0;z-index:9200;display:none;place-items:center;background:rgba(8,24,40,.34);backdrop-filter:blur(3px)}
#modalLayer.open{display:grid}
.modal{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--glass-solid);
  border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);animation:winIn .16s ease-out;overflow:hidden}
.modal header{padding:16px 18px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.modal header svg{width:17px;height:17px;color:var(--brand-deep)}
html[data-theme="dark"] .modal header svg{color:var(--brand)}
.modal .content{padding:6px 18px 14px;font-size:13px;color:var(--text-2);overflow:auto;user-select:text}
.modal .content p{margin:0 0 9px}
.modal .content code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.modal footer{padding:12px 16px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line);background:var(--surface-2)}
.modal input[type=text],.modal input[type=password],.modal textarea{width:100%;margin-top:4px}

/* ═══════════════════════════ 9. 通用控件 ═══════════════════════════ */
.btn{height:32px;padding:0 13px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line-strong);
  color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(180deg,var(--brand),var(--brand-strong));border-color:var(--brand-deep);color:var(--on-brand);font-weight:600;box-shadow:0 3px 10px var(--brand-ring)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;border-color:var(--line-strong)}
.btn.danger{background:var(--err-bg);border-color:var(--err);color:var(--err);font-weight:600}
.btn.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.loading{pointer-events:none;position:relative;color:transparent!important}
.btn.loading::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.ghost.loading::after,.btn:not(.primary).loading::after{border-color:var(--brand-ring);border-top-color:var(--brand-strong)}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{
  height:32px;padding:0 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line-strong);color:var(--text);outline:none;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea{height:auto;padding:9px 10px;resize:vertical;line-height:1.55;font-family:inherit;min-height:74px}
input:focus,select:focus,textarea:focus{border-color:var(--brand-strong);box-shadow:0 0 0 3px var(--brand-ring)}
label.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--brand-strong);width:15px;height:15px;cursor:pointer}
.switch{position:relative;width:38px;height:21px;border-radius:999px;background:var(--line-strong);transition:background var(--t-fast);flex:0 0 38px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform var(--t-fast);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--brand-strong)}
.switch.on::after{transform:translateX(17px)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:11.5px;color:var(--text-3)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.6}

/* 面板通用块：卡片 / 键值 / 徽标 / 表格 / 日志 */
.pane-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pane-head h2{margin:0;font-size:15px;font-weight:600}
.pane-head .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow-soft)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.card h3 svg{width:14px;height:14px;color:var(--brand-deep)}
html[data-theme="dark"] .card h3 svg{color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;align-items:center}
.kv dt{color:var(--text-3);white-space:nowrap}
.kv dd{margin:0;color:var(--text);word-break:break-word;user-select:text}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px}
.stat .lab{font-size:11px;color:var(--text-3);margin-bottom:4px}
.stat .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .val.sm{font-size:12.5px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-2)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.info{background:var(--info-bg);color:var(--info)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th,table.tbl td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{color:var(--text-3);font-weight:500;font-size:11.5px}
table.tbl tr:last-child td{border-bottom:0}
.chk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk-list li{display:flex;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);align-items:flex-start}
.chk-list li .m{width:17px;height:17px;flex:0 0 17px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-3)}
.chk-list li.pass .m{background:var(--ok-bg);color:var(--ok)}
.chk-list li.block .m{background:var(--err-bg);color:var(--err)}
.chk-list li.warn .m{background:var(--warn-bg);color:var(--warn)}
.chk-list li .t{min-width:0;flex:1}
.chk-list li .t b{font-size:12.5px;font-weight:500;display:block}
.chk-list li .t span{font-size:11.5px;color:var(--text-3)}
.log{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 11px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;user-select:text;color:var(--text-2)}
.log .er{color:var(--err)}.log .wa{color:var(--warn)}.log .ok{color:var(--ok)}
.progress{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-strong));border-radius:999px;transition:width var(--t-base)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--text-2)}
.seg button.on{background:var(--brand-strong);color:var(--on-brand);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 12px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand-strong);font-weight:600}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:46px;height:32px;border-radius:var(--radius-sm);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--brand-ring)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.wp-opt{border-radius:var(--radius-sm);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line-strong);height:58px;position:relative;overflow:hidden}
.wp-opt.on{border-color:var(--brand-strong);box-shadow:0 0 0 3px var(--brand-ring)}
.wp-opt span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;text-align:center;background:rgba(6,26,44,.5);color:#fff;padding:2px 0}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .info{flex:1;min-width:0}
.set-row .info b{display:block;font-size:12.5px;font-weight:500}
.set-row .info span{font-size:11.5px;color:var(--text-3)}
.empty{padding:26px 14px;text-align:center;color:var(--text-3);font-size:12.5px}
.banner{display:flex;gap:9px;align-items:center;padding:9px 12px;border-radius:var(--radius-sm);background:var(--info-bg);color:var(--info);font-size:12px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner svg{width:15px;height:15px;flex:0 0 15px}
.demo-stage{position:relative;width:100%;aspect-ratio:9/16;max-height:100%;background:
  radial-gradient(60% 40% at 50% 18%, #2b5876 0%, rgba(43,88,118,0) 70%), linear-gradient(180deg,#0e2233,#16394f);
  border-radius:var(--radius);overflow:hidden;display:grid;place-items:center}
.demo-stage canvas{width:100%;height:100%;display:block}

/* ═══════════════════════════ 10. 启动画面 ═══════════════════════════ */
#boot{position:fixed;inset:0;z-index:9500;background:linear-gradient(160deg,#0f2b40,#123a55 55%,#0a1f2e);
  display:grid;place-items:center;color:#dff1ff;transition:opacity .3s ease}
#boot.hide{opacity:0;pointer-events:none}
#boot .bx{width:min(400px,84vw);text-align:center}
#boot .mark{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-strong));color:var(--on-brand);box-shadow:0 12px 34px rgba(56,189,248,.34)}
#boot .mark svg{width:34px;height:34px}
#boot h1{margin:0 0 3px;font-size:17px;font-weight:600;letter-spacing:.3px}
#boot p{margin:0 0 18px;font-size:12px;color:#9dc4dd}
#boot .steps{text-align:left;font-size:12px;color:#a9cee4;display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-height:66px}
#boot .steps i{font-style:normal;color:#5ee0b0;margin-right:6px}
#boot .progress i{background:linear-gradient(90deg,var(--brand),#7ff0c8)}
#boot .foot{margin-top:10px;font-size:11px;color:#7ea6bf}

/* ═══════════════════════════ 11. 移动端降级 ═══════════════════════════ */
@media (max-width:820px){
  :root{--taskbar-h:56px}
  body{font-size:14px}
  #iconLayer{padding:10px;grid-auto-flow:row;grid-template-columns:repeat(3,1fr);grid-template-rows:none;
    gap:6px;overflow:auto;inset:0 0 var(--taskbar-h) 0;display:grid}
  html[data-icon-size],html[data-icon-size="sm"],html[data-icon-size="md"],html[data-icon-size="lg"]{--cell-w:100%;--cell-h:auto;--icon-w:52px;--icon-h:52px}
  .icon{width:100%;height:auto;padding:12px 6px}
  .icon .label{font-size:11.5px;-webkit-line-clamp:2}
  .wm-window{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:var(--taskbar-h)!important;
    width:auto!important;height:auto!important;border-radius:0;border-left:0;border-right:0}
  .wm-window.is-min{transform:translateY(60px)}
  .wm-grip{display:none!important}
  .wm-titlebar{cursor:default}
  .wm-btns .wm-btn.max{display:none}
  #tasks .task .tt{display:none}
  .task{max-width:52px;padding:0 12px;justify-content:center}
  .tb-group.left .tb-btn:not(.start){display:none}
  #clockDate{display:none}
  .tb-chip{display:none}
  #startMenu{width:calc(100vw - 16px);left:8px;transform:translateY(14px) scale(.98);bottom:calc(var(--taskbar-h) + 8px)}
  #startMenu.open{transform:translateY(0) scale(1)}
  .sm-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .tabs{overflow:auto}
}
</style>
</head>
<body>

<!-- ── 启动 / 加载状态 ─────────────────────────────────────────────── -->
<div id="boot">
  <div class="bx">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 17v3.5"/><path d="M7 9.5h4M7 12.5h7"/></svg></div>
    <h1>AI 数字人 · 桌面版</h1>
    <p id="bootSub">正在启动桌面环境…</p>
    <div class="steps" id="bootSteps"></div>
    <div class="progress"><i id="bootBar" style="width:8%"></i></div>
    <div class="foot" id="bootFoot">LiveTalking 本地服务 · 无需联网</div>
  </div>
</div>

<!-- ── 桌面 ──────────────────────────────────────────────────────── -->
<div id="desk">
  <div id="wallpaper"><div class="wp-glow"></div></div>

/* ═══════════════════ 2. 工具函数 ═══════════════════ */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
/** 创建元素：el('div',{class:'x',text:'y'},child1,child2) */
function el(tag, props, ...kids){
  const node = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v === null || v === undefined || v === false) continue;
    if(k === 'class') node.className = v;
    else if(k === 'text') node.textContent = v;
    else if(k === 'html') node.innerHTML = v;
    else if(k === 'style') node.setAttribute('style', v);
    else if(k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if(k === 'dataset') for(const d in v) node.dataset[d] = v[d];
    else node.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(ch => { if(ch === null || ch === undefined || ch === false) return;
    node.appendChild(typeof ch === 'string' ? document.createTextNode(ch) : ch); });
  return node;
}
/** HTML 转义（所有来自接口/用户的文本都必须先转义） */
function esc(s){ return String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtTime(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtDate(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日 周' + '日一二三四五六'[d.getDay()]; }
function fmtDT(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function fmtAgo(ts){
  if(!ts) return '—';
  const d = new Date(ts); if(isNaN(d)) return '—';
  const diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 60) return Math.max(1, Math.round(diff)) + ' 秒前';
  if(diff < 3600) return Math.round(diff/60) + ' 分钟前';
  if(diff < 86400) return Math.round(diff/3600) + ' 小时前';
  return fmtDT(d).slice(0,5);
}

async function copyText(text, label){
  try{
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else { const ta = el('textarea', {style:'position:fixed;opacity:0'}); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast('ok', '已复制', (label || '内容') + '已复制到剪贴板');
  }catch(e){ toast('warn', '复制失败', '请手动选中复制'); }
}
/** 下载文本文件（导出诊断报告等） */
function downloadText(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = el('a', {href:URL.createObjectURL(blob), download:name}); document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

async function request(path, opt){
  const res = await fetch(path, Object.assign({credentials:'same-origin', headers:{'Content-Type':'application/json'}}, opt || {}));
  if(res.status === 401) { const e = new Error('请先登录'); e.code = 401; throw e; }
  const text = await res.text();
  let json = null; try{ json = text ? JSON.parse(text) : null; }catch(e){ json = null; }
  if(!res.ok){
    const e = new Error((json && (json.msg || json.error || json.detail)) || ('HTTP ' + res.status));
    e.code = res.status; e.feature = json && json.feature; e.upgrade_url = json && json.upgrade_url;
    throw e;
  }
  if(json && typeof json === 'object' && 'code' in json){
    if(json.code !== 0){ const e = new Error(json.msg || '接口返回失败'); e.code = json.code === -1 ? 400 : json.code; e.feature = json.feature; throw e; }
    return json.data === undefined ? json : json.data;
  }
  return json;
}
const apiGet  = p => request(p, {method:'GET'});
const apiPost = (p, b) => request(p, {method:'POST', body: JSON.stringify(b || {})});
const apiPut  = (p, b) => request(p, {method:'PUT', body: JSON.stringify(b || {})});
const apiDel  = p => request(p, {method:'DELETE'});
/** 统一错误提示：403 走“升级/权限”弹窗，401 走重新登录 */
function apiFail(e, what){
  const msg = e && e.message ? e.message : String(e);
  if(e && e.code === 401){
    modal({title:'登录状态已失效', icon:'lock', body:'<p>当前登录态已过期或被其他设备顶下线（同一账号只允许一处登录）。</p>',
      buttons:[{text:'重新登录', primary:true, action:() => { location.href = '/login.html?next=' + encodeURIComponent('/desktop.html'); }}]});
    return;
  }
  if(e && (e.code === 403 || e.feature)){
    modal({title:'该功能未解锁', icon:'lock',
      body:'<p>' + esc(msg) + '</p><p class="hint">免费版可以查看工作台与商品库、做模拟评论测试；连接数字人、开播、自动话术等属于专业版。安全操作（打断、紧急停止、安全下播）不受套餐限制。</p>',
      buttons:[{text:'稍后', action:closeModal},
               {text:'打开升级页', primary:true, action:() => { closeModal(); openApp('console'); openExternal('/upgrade.html'); }}]});
    return;
  }
  toast('err', what ? (what + '失败') : '操作失败', msg);
}
/** 新标签打开链接（登录页 / 升级页 / 分享地址） */
function openExternal(url){ window.open(url, '_blank', 'noopener'); }

/* ═══════════════════ 5. 通知中心 + 弹出提示 ═══════════════════ */
const NOTES = [];
function toast(type, title, text, ms){
  if(!S.toasts) return;
  const box = $('#toasts');
  const ic = type === 'ok' ? 'check' : type === 'warn' ? 'alert' : type === 'err' ? 'alert' : 'info';
  const t = el('div', {class:'toast ' + (type || 'info'), role:'status'},
    el('div', {class:'ti', html:svgIcon(ic)}),
    el('div', {class:'tx'}, el('b', {text:title}), text ? el('p', {text:text}) : null));
  box.appendChild(t);
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 240); };
  t.addEventListener('click', kill);
  setTimeout(kill, ms || S.toastMs);
  while(box.children.length > 4) box.firstChild.remove();
}
/** 通知：同时进通知中心（真实状态变化才会触发，见第 10 节轮询） */
function notify(type, title, text, silent){
  NOTES.unshift({type:type || 'info', title:title, text:text || '', at:new Date()});
  while(NOTES.length > 40) NOTES.pop();
  renderNotes();
  if(!silent) toast(type, title, text);
}
function renderNotes(){
  const list = $('#npList'); if(!list) return;
  if(!NOTES.length){ list.innerHTML = '<div class="np-empty">暂无通知</div>'; return; }
  list.innerHTML = NOTES.map(n =>
    '<div class="np-item ' + esc(n.type) + '"><div class="ti">' + svgIcon(n.type === 'ok' ? 'check' : n.type === 'err' ? 'alert' : 'info') + '</div>' +
    '<div class="tx"><b>' + esc(n.title) + '</b>' + (n.text ? '<p>' + esc(n.text) + '</p>' : '') + '</div>' +
    '<div class="tm">' + esc(fmtTime(n.at)) + '</div></div>').join('');
  $('#notifyBtn').classList.add('has');
}
function openNotes(open){
  const p = $('#notifyPanel');
  const want = open === undefined ? !p.classList.contains('open') : open;
  p.classList.toggle('open', want);
  if(want){ $('#notifyBtn').classList.remove('has'); closeStart(); closeCalendar(); }
}

/* ═══════════════════ 6. 弹窗（confirm / prompt / 信息） ═══════════════════ */
function modal(opt){
  const layer = $('#modalLayer');
  const foot = el('footer');
  (opt.buttons || [{text:'知道了', primary:true, action:closeModal}]).forEach(b => {
    foot.appendChild(el('button', {class:'btn ' + (b.primary ? 'primary' : (b.danger ? 'danger' : 'ghost')), text:b.text,
      onclick:() => b.action ? b.action() : closeModal()}));
  });
  const box = el('div', {class:'modal', role:'dialog', 'aria-modal':'true'},
    el('header', {html:svgIcon(opt.icon || 'info') + '<span>' + esc(opt.title || '提示') + '</span>'}),
    el('div', {class:'content', html:opt.body || ''}),
    foot);
  layer.innerHTML = ''; layer.appendChild(box); layer.classList.add('open');
  const first = box.querySelector('input,textarea,select,button.primary'); if(first) first.focus();
  layer.onclick = e => { if(e.target === layer) closeModal(); };
  return box;
}
function closeModal(){ const l = $('#modalLayer'); l.classList.remove('open'); l.innerHTML = ''; }
function confirmBox(title, text, onYes, danger){
  modal({title:title, icon: danger ? 'alert' : 'info', body:'<p>' + esc(text) + '</p>',
    buttons:[{text:'取消', action:closeModal}, {text:'确定', primary:!danger, danger:!!danger, action:() => { closeModal(); onYes(); }}]});
}
function promptBox(title, label, value, onOk){
  const box = modal({title:title, icon:'key', body:'<p>' + esc(label) + '</p><input type="text" id="pmtInput" value="' + esc(value || '') + '">',
    buttons:[{text:'取消', action:closeModal}, {text:'确定', primary:true, action:() => {
      const v = ($('#pmtInput') || {}).value || ''; closeModal(); onOk(v); }}]});
  const inp = box.querySelector('#pmtInput'); if(inp){ inp.focus(); inp.select();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ const v = inp.value; closeModal(); onOk(v); } }); }
}

/* ═══════════════════ 7. 窗口管理器（拖动 / 缩放 / 层级 / 最小化 / 最大化） ═══════════════════ */
const WM = {
  z: 100, seq: 0,
  wins: new Map(),        // id -> win
  order: [],              // 聚焦顺序（末尾为最前）
  mobile(){ return window.innerWidth <= 820; },
  /** 打开（或聚焦）一个应用窗口 */
  open(appId, opts){
    const app = APP_MAP[appId]; if(!app) return null;
    opts = opts || {};
    const exist = this.wins.get(appId);
    if(exist && !opts.force){ this.focus(appId); if(exist.state === 'min') this.unminimize(appId); return exist; }
    if(exist) this.close(appId);

    const isMobile = this.mobile();
    const vw = window.innerWidth, vh = window.innerHeight - (isMobile ? 0 : taskbarH());
    let w = Math.min(app.w, vw - (isMobile ? 0 : 24));
    let h = Math.min(app.h, vh - (isMobile ? 0 : 24));
    const saved = S.rects[appId];
    let x, y;
    if(saved && !isMobile && Number.isFinite(saved.x)){
      w = Math.max(320, Math.min(saved.w || w, vw - 16));
      h = Math.max(220, Math.min(saved.h || h, vh - 16));
      x = Math.max(0, Math.min(saved.x, vw - w)); y = Math.max(0, Math.min(saved.y, vh - h));
    }else{
      const step = (this.seq++ % 7) * 26;
      x = Math.max(8, Math.round((vw - w) / 2) - 90 + step);
      y = Math.max(6, Math.round((vh - h) / 2) - 40 + step);
      x = Math.min(x, Math.max(0, vw - w)); y = Math.min(y, Math.max(0, vh - h));
    }

    const elWin = el('div', {class:'wm-window' + (S.animations ? ' opening' : ''), dataset:{app:appId}, role:'dialog', 'aria-label':app.name, tabindex:'-1'});
    elWin.style.left = x + 'px'; elWin.style.top = y + 'px'; elWin.style.width = w + 'px'; elWin.style.height = h + 'px';

    /* 标题栏：图标 + 名称 + 提示 + 最小化/最大化/关闭 */
    const titlebar = el('div', {class:'wm-titlebar'},
      el('div', {class:'wm-ico', html:svgIcon(app.icon)}),
      el('div', {class:'wm-title', text:app.name}),
      el('div', {class:'wm-sub', text: (MODE === 'demo' ? '离线演示' : (app.url ? '真实页面' : '实时数据'))}),
      el('div', {class:'wm-btns'},
        el('button', {class:'wm-btn min', title:'最小化', 'aria-label':'最小化', html:svgIcon('min'), onclick:e => { e.stopPropagation(); this.minimize(appId); }}),
        el('button', {class:'wm-btn max', title:'最大化 / 还原', 'aria-label':'最大化', html:svgIcon('max'), onclick:e => { e.stopPropagation(); this.toggleMax(appId); }}),
        el('button', {class:'wm-btn close', title:'关闭', 'aria-label':'关闭', html:svgIcon('close'), onclick:e => { e.stopPropagation(); this.close(appId); }})));
    const body = el('div', {class:'wm-body'});
    elWin.appendChild(titlebar); elWin.appendChild(body);
    /* 8 个边缘缩放手柄 */
    ['n','s','w','e','nw','ne','sw','se'].forEach(d => body.parentNode.appendChild(el('div', {class:'wm-grip ' + d, dataset:{dir:d}})));
    $('#winLayer').appendChild(elWin);

    const win = {id:appId, app:app, el:elWin, titlebar:titlebar, body:body, state:'normal', restoreTo:'normal',
      rect:{x:x, y:y, w:w, h:h}, cleanups:[], onStatus:null, iframe:null, taskBtn:null};
    this.wins.set(appId, win);
    this.order.push(appId);

    /* 内容：live 模式优先内嵌真实页面；原生面板一律自己渲染并调用真实接口 */
    const renderer = PanelRegistry[app.native || appId] || ((app.url && MODE === 'demo') ? PanelRegistry.demo : null);
    if(app.url && MODE === 'live' && !opts.forceNative) this.renderFrame(win);
    else if(renderer) this.renderNative(win, renderer);
    else this.renderFallback(win);

    this.bindDrag(win); this.bindResize(win); this.bindTitleMenu(win);
    elWin.addEventListener('pointerdown', () => this.focus(appId), true);
    this.focus(appId); this.addTask(win); this.pushRecent(appId);
    if(isMobile || win.state === 'max') applyWindowConstraints();

    /* 记住窗口位置尺寸（拖动/缩放结束后写入） */
    win.cleanups.push(() => { S.rects[appId] = win.state === 'max' ? saveRectOf(win) : win.rect; saveSettings(); });
    return win;
  },
  /** iframe 承载真实业务页面（含加载骨架、超时提示、刷新与新标签） */
  renderFrame(win){
    const app = win.app, body = win.body;
    const bar = el('div', {class:'wm-iframe-bar'},
      el('button', {class:'btn sm ghost', title:'重新加载', html:svgIcon('refresh') + '<span>刷新</span>', onclick:() => { load(true); }}),
      el('button', {class:'btn sm ghost', title:'在新标签页打开', html:svgIcon('external') + '<span>新标签</span>', onclick:() => openExternal(app.url)}),
      el('span', {class:'hint', style:'margin-left:auto', text: app.url}));
    const loading = el('div', {class:'wm-loading'}, el('div', {class:'box'},
      el('div', {class:'spinner'}), el('div', {text:'正在加载 ' + app.name + '…'}), el('div', {class:'bar', style:'width:150px;margin:10px auto 0'})));
    const frame = el('iframe', {class:'wm-frame', title:app.name, src:'about:blank', allow:app.allow || '', referrerpolicy:'same-origin'});
    win.iframe = frame;
    body.appendChild(bar); body.appendChild(loading); body.appendChild(frame);
    let guard = null;
    const load = (force) => {
      loading.style.display = ''; if(bar.dataset.warn){ bar.dataset.warn = ''; }
      const w = $('#wmAlerts_' + win.id); if(w) w.remove();
      frame.src = force ? (app.url + (app.url.indexOf('?') < 0 ? '?' : '&') + '_r=' + Date.now()) : app.url;
      clearTimeout(guard);
      guard = setTimeout(() => { loading.style.display = 'none'; showFrameAlert(win, '页面加载较慢或服务未就绪，可点“刷新”重试。', false); }, 15000);
    };
    frame.addEventListener('load', () => {
      clearTimeout(guard); loading.style.display = 'none';
      /* 同源可读：被服务端按权限/套餐拦到登录页、升级页或无权页时，在窗口内给出说明 */
      try{
        const p = frame.contentWindow.location.pathname;
        if(p === '/login.html') showFrameAlert(win, '该窗口需要登录，已跳转到登录页。请在新标签登录后回到桌面。', false);
        else if(p === '/upgrade.html') showFrameAlert(win, '该页面属于专业版功能，服务端已跳转到升级页。', false);
        else if(p === '/forbidden.html') showFrameAlert(win, '该页面仅管理员可见，服务端已拦截。', true);
      }catch(e){ /* 跨域则忽略 */ }
    });
    load(false);
  },
  /** 原生面板：由外壳渲染 + 直接调用真实接口 */
  renderNative(win, renderer){
    win.body.classList.add('scroll');
    const pane = el('div', {class:'wm-pane', dataset:{pane:win.id}});
    win.body.appendChild(pane);
    try{
      const ret = renderer(pane, win) || {};
      if(typeof ret.onStatus === 'function') win.onStatus = ret.onStatus;
      if(typeof ret.cleanup === 'function') win.cleanups.push(ret.cleanup);
      if(typeof ret.refresh === 'function') win.cleanups.push(() => {});
      win.paneRefresh = ret.refresh || null;
    }catch(e){ pane.innerHTML = '<div class="banner warn">' + svgIcon('alert') + '<span>面板渲染失败：' + esc(e.message) + '</span></div>'; }
  },
  renderFallback(win){
    win.body.classList.add('scroll');
    win.body.appendChild(el('div', {class:'wm-pane'}, el('div', {class:'empty', text:'该窗口暂未接入内容。'})));
  },
  focus(id){
    const win = this.wins.get(id); if(!win) return;
    this.z += 1; win.el.style.zIndex = this.z;
    this.order = this.order.filter(x => x !== id); this.order.push(id);
    this.wins.forEach(w => w.el.classList.toggle('inactive', w.id !== id));
    this.syncTasks();
  },
  minimize(id){
    const win = this.wins.get(id); if(!win) return;
    win.restoreTo = win.state;
    win.state = 'min'; win.el.classList.add('is-min');
    const next = this.order.filter(x => x !== id && this.wins.get(x) && this.wins.get(x).state !== 'min').pop();
    if(next) this.focus(next);
    this.syncTasks();
  },
  unminimize(id){
    const win = this.wins.get(id); if(!win) return;
    win.state = win.restoreTo === 'max' ? 'max' : 'normal';
    win.el.classList.remove('is-min');
    if(win.state === 'max') this.setMax(win, true);
    this.focus(id); this.syncTasks();
  },
  toggleMax(id){
    const win = this.wins.get(id); if(!win) return;
    if(win.state === 'max'){ this.setMax(win, false); } else { win.restoreTo = 'normal'; this.setMax(win, true); }
    this.focus(id); this.syncTasks();
  },
  setMax(win, on){
    if(on){
      if(win.state !== 'max') win.rect = this.readRect(win);
      win.state = 'max'; win.el.classList.add('is-max');
      win.el.style.left = '0px'; win.el.style.top = '0px'; win.el.style.width = '100%'; win.el.style.height = '100%';
    }else{
      win.state = 'normal'; win.el.classList.remove('is-max');
      const r = win.rect || {x:60,y:40,w:900,h:600};
      win.el.style.left = r.x + 'px'; win.el.style.top = r.y + 'px'; win.el.style.width = r.w + 'px'; win.el.style.height = r.h + 'px';
    }
  },
  close(id){
    const win = this.wins.get(id); if(!win) return;
    const doClose = () => {
      win.cleanups.forEach(fn => { try{ fn(); }catch(e){} });
      if(win.iframe) win.iframe.src = 'about:blank';   // 主动断开 iframe 内的 WebRTC / SSE
      win.el.remove(); this.wins.delete(id);
      this.order = this.order.filter(x => x !== id);
      if(win.taskBtn) win.taskBtn.remove();
      const next = this.order.filter(x => this.wins.get(x) && this.wins.get(x).state !== 'min').pop();
      if(next) this.focus(next); else this.syncTasks();
      toast('info', '已关闭「' + win.app.name + '」');
    };
    if(S.confirmClose && win.app.id !== 'about') confirmBox('关闭窗口', '确定关闭「' + win.app.name + '」吗？' + (win.app.id === 'stage' ? '直播画面将断开。' : ''), doClose);
    else doClose();
  },
  closeAll(){
    Array.from(this.wins.keys()).forEach(id => this.close(id));
  },
  minimizeAll(){
    const ids = Array.from(this.wins.keys());
    const anyVisible = ids.some(id => this.wins.get(id).state !== 'min');
    ids.forEach(id => anyVisible ? this.minimize(id) : this.unminimize(id));
  },
  readRect(win){ return {x:win.el.offsetLeft, y:win.el.offsetTop, w:win.el.offsetWidth, h:win.el.offsetHeight}; },
  /** 拖动标题栏移动窗口（用 setPointerCapture，指针划过 iframe 也不会丢事件） */
  bindDrag(win){
    const tb = win.titlebar; let sx = 0, sy = 0, ox = 0, oy = 0, zone = '';
    tb.addEventListener('pointerdown', e => {
      if(e.button !== 0 || e.target.closest('.wm-btns')) return;
      if(this.mobile()) return;
      const r = this.readRect(win);
      if(win.state === 'max'){                       // 最大化时拖动 → 还原并跟随指针
        this.setMax(win, false);
        const ratio = (e.clientX / window.innerWidth);
        const w = Math.min(win.rect.w, window.innerWidth - 16);
        win.rect.x = Math.round(Math.max(0, e.clientX - w * ratio)); win.rect.y = 6;
        win.el.style.left = win.rect.x + 'px'; win.el.style.top = win.rect.y + 'px';
        win.el.style.width = w + 'px'; win.el.style.height = Math.min(win.rect.h, window.innerHeight - taskbarH() - 16) + 'px';
      }
      const rr = this.readRect(win);
      sx = e.clientX; sy = e.clientY; ox = rr.x; oy = rr.y;
      tb.setPointerCapture(e.pointerId);
      win.el.classList.add('dragging'); document.body.classList.add('dragging');
      const move = ev => {
        const nx = ox + (ev.clientX - sx), ny = oy + (ev.clientY - sy);
        const maxX = window.innerWidth - 90, maxY = window.innerHeight - taskbarH() - 34;
        win.el.style.left = Math.max(-rr.w + 110, Math.min(nx, maxX)) + 'px';
        win.el.style.top  = Math.max(0, Math.min(ny, maxY)) + 'px';
        if(S.snapEdges){ zone = snapZone(ev.clientX, ev.clientY); showSnap(zone); }
      };
      const up = ev => {
        tb.releasePointerCapture(ev.pointerId);
        tb.removeEventListener('pointermove', move); tb.removeEventListener('pointerup', up); tb.removeEventListener('pointercancel', up);
        win.el.classList.remove('dragging'); document.body.classList.remove('dragging'); hideSnap();
        if(S.snapEdges && zone){
          if(zone === 'max'){ this.setMax(win, true); win.restoreTo = 'max'; }
          else{ win.rect = {x:0,y:0,w:0,h:0}; this.snapHalf(win, zone); }
          zone = '';
        }
        win.rect = this.readRect(win); S.rects[win.id] = win.rect; saveSettings(); this.syncTasks();
      };
      tb.addEventListener('pointermove', move); tb.addEventListener('pointerup', up); tb.addEventListener('pointercancel', up);
    });
    /* 双击标题栏最大化/还原 */
    tb.addEventListener('dblclick', e => { if(e.target.closest('.wm-btns') || !S.maxOnDblTitle) return; this.toggleMax(win.id); });
  },
  /** 左右半边吸附 */
  snapHalf(win, side){
    const vh = window.innerHeight - taskbarH();
    const w = Math.round(window.innerWidth / 2);
    win.el.classList.remove('is-max'); win.state = 'normal';
    win.el.style.top = '0px'; win.el.style.left = (side === 'left' ? 0 : w) + 'px';
    win.el.style.width = w + 'px'; win.el.style.height = vh + 'px';
    win.rect = this.readRect(win);
  },
  /** 拖动边缘缩放窗口 */
  bindResize(win){
    $$('.wm-grip', win.el).forEach(grip => {
      let dir = grip.dataset.dir, sx = 0, sy = 0, r0 = null;
      grip.addEventListener('pointerdown', e => {
        if(this.mobile() || win.state === 'max') return;
        e.stopPropagation(); e.preventDefault();
        r0 = this.readRect(win); sx = e.clientX; sy = e.clientY;
        grip.setPointerCapture(e.pointerId);
        win.el.classList.add('resizing'); document.body.classList.add('dragging');
        const move = ev => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy;
          const minW = 360, minH = 240; let w = r0.w, h = r0.h, x = r0.x, y = r0.y;
          if(dir.indexOf('e') >= 0) w = Math.max(minW, r0.w + dx);
          if(dir.indexOf('s') >= 0) h = Math.max(minH, r0.h + dy);
          if(dir.indexOf('w') >= 0){ w = Math.max(minW, r0.w - dx); x = r0.x + (r0.w - w); }
          if(dir.indexOf('n') >= 0){ h = Math.max(minH, r0.h - dy); y = r0.y + (r0.h - h); }
          win.el.style.width = w + 'px'; win.el.style.height = h + 'px'; win.el.style.left = x + 'px'; win.el.style.top = Math.max(0, y) + 'px';
        };
        const up = ev => {
          grip.releasePointerCapture(ev.pointerId);
          grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
          win.el.classList.remove('resizing'); document.body.classList.remove('dragging');
          win.rect = this.readRect(win); S.rects[win.id] = win.rect; saveSettings();
        };

/** 桌面可用高度（去掉任务栏） */
function taskbarH(){ return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 52; }
function saveRectOf(win){ return win.rect && win.rect.w ? win.rect : {x:60,y:40,w:900,h:600}; }
/** 边缘吸附判定 */
function snapZone(x, y){
  const topEdge = document.documentElement.dataset.taskbar === 'top' ? taskbarH() + 4 : 4;
  if(y <= topEdge) return 'max';
  if(x <= 6) return 'left';
  if(x >= window.innerWidth - 6) return 'right';
  return '';
}
function showSnap(zone){
  const p = $('#snapPreview'); if(!zone){ hideSnap(); return; }
  const vh = window.innerHeight - (document.documentElement.dataset.taskbar === 'top' ? taskbarH() : 0);
  const off = document.documentElement.dataset.taskbar === 'top' ? taskbarH() : 0;
  p.style.display = '';
  if(zone === 'max'){ p.style.left = '6px'; p.style.top = (6 + off) + 'px'; p.style.width = (window.innerWidth - 12) + 'px'; p.style.height = (vh - 12) + 'px'; }
  else { const w = Math.round(window.innerWidth / 2); p.style.left = (zone === 'left' ? 6 : w + 3) + 'px'; p.style.top = (6 + off) + 'px'; p.style.width = (w - 9) + 'px'; p.style.height = (vh - 12) + 'px'; }
}
function hideSnap(){ $('#snapPreview').style.display = 'none'; }
/** 全部窗口重新约束到可视区域（窗口尺寸变化 / 切到移动端时） */
function applyWindowConstraints(){
  const vw = window.innerWidth, vh = window.innerHeight - taskbarH();
  WM.wins.forEach(win => {
    if(WM.mobile()){ win.el.classList.remove('is-max'); win.el.style.cssText = ''; win.state = 'normal'; return; }
    const r = WM.readRect(win);
    const w = Math.min(r.w, vw - 8), h = Math.min(r.h, vh - 8);
    const x = Math.max(0, Math.min(r.x, vw - w)), y = Math.max(0, Math.min(r.y, vh - h));
    win.el.style.width = w + 'px'; win.el.style.height = h + 'px'; win.el.style.left = x + 'px'; win.el.style.top = y + 'px';
    win.rect = {x:x,y:y,w:w,h:h};
  });
}

/** 排列图标：自动排列（网格）或自由摆放（记住坐标） */
function layoutIcons(){
  const layer = $('#iconLayer'); if(!layer) return;
  const auto = S.alignIcons || WM.mobile();
  layer.classList.toggle('free', !auto);
  $$('.icon', layer).forEach(ico => {
    const id = ico.dataset.app;
    if(auto){ ico.classList.remove('free'); ico.style.left = ''; ico.style.top = ''; }
    else {
      ico.classList.add('free');
      const p = (S.iconPos || {})[id];
      const cell = cellSize();
      ico.style.left = (p ? p.x : 14) + 'px';
      ico.style.top = (p ? p.y : 14) + 'px';
      if(!p){ /* 首次进入自由模式：按当前网格顺序落位 */ }
      if(!p){ const i = APPS.findIndex(a => a.id === id);
        ico.style.left = (14 + Math.floor(i / 6) * cell.w) + 'px';
        ico.style.top = (14 + (i % 6) * cell.h) + 'px'; }
    }
  });
}
function cellSize(){
  const cs = getComputedStyle(document.documentElement);
  return {w: parseInt(cs.getPropertyValue('--cell-w')) || 98, h: parseInt(cs.getPropertyValue('--cell-h')) || 104};
}
/** 自由排列模式下拖动图标 */
function bindIconDrag(ico, appId){
  ico.addEventListener('pointerdown', e => {
    if(e.button !== 0 || S.alignIcons || WM.mobile()) return;
    const r = ico.getBoundingClientRect(), ox = r.left, oy = r.top;
    let moved = false;
    ico.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY;
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      ico.style.left = (ox + dx) + 'px'; ico.style.top = (oy + dy) + 'px';
    };
    const up = ev => {
      ico.releasePointerCapture(ev.pointerId);
      ico.removeEventListener('pointermove', move); ico.removeEventListener('pointerup', up);
      if(!moved) return;
      const cell = cellSize(); const layerRect = $('#iconLayer').getBoundingClientRect();
      let x = ico.offsetLeft, y = ico.offsetTop;
      if(S.snapGrid){
        x = Math.round((x - 14) / cell.w) * cell.w + 14;
        y = Math.round((y - 14) / cell.h) * cell.h + 14;
      }
      x = Math.max(0, Math.min(x, layerRect.width - cell.w)); y = Math.max(0, Math.min(y, layerRect.height - cell.h));
      ico.style.left = x + 'px'; ico.style.top = y + 'px';
      S.iconPos[appId] = {x:x, y:y}; saveSettings();
    };
    ico.addEventListener('pointermove', move); ico.addEventListener('pointerup', up);
  });
}
/** 桌面空白处框选图标 */
function bindMarquee(){
  const desk = $('#desk');
  desk.addEventListener('pointerdown', e => {
    if(e.button !== 0 || e.target.closest('.icon') || e.target.closest('.wm-window')) return;
    const box = $('#marquee'), sx = e.clientX, sy = e.clientY; let moved = false;
    $$('.icon').forEach(x => x.classList.remove('sel'));
    desk.setPointerCapture(e.pointerId);
    const move = ev => {
      if(Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 6) moved = true;
      if(!moved) return;
      const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY);
      const w = Math.abs(ev.clientX - sx), h = Math.abs(ev.clientY - sy);
      box.style.display = 'block'; box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px';
      $$('.icon').forEach(ico => {
        const r = ico.getBoundingClientRect();
        ico.classList.toggle('sel', r.left < x + w && r.right > x && r.top < y + h && r.bottom > y);
      });
    };
    const up = ev => {
      desk.releasePointerCapture(ev.pointerId);
      desk.removeEventListener('pointermove', move); desk.removeEventListener('pointerup', up);
      box.style.display = 'none';
    };
    desk.addEventListener('pointermove', move); desk.addEventListener('pointerup', up);
  });
  /* 桌面右键 */
  desk.addEventListener('contextmenu', e => {
    if(e.target.closest('.wm-window')) return;
    e.preventDefault(); desktopMenu(e.clientX, e.clientY);
  });
  /* 右键点在通知条上：先清掉通知，避免通知挡住桌面菜单（真实体验修正） */
  document.addEventListener('contextmenu', e => {
    if(e.target.closest('#toasts')){ e.preventDefault(); e.stopPropagation(); $('#toasts').innerHTML = ''; }
  }, true);
  /* 点击空白关闭菜单/开始菜单 */
  desk.addEventListener('pointerdown', e => { if(!e.target.closest('#ctxMenu')) hideMenu(); }, true);
}

let menuStack = [];
function showMenu(x, y, items, parent){
  const box = $('#ctxMenu');
  if(!parent){ menuStack = []; box.innerHTML = ''; }
  const list = el('div', {class:'menu-list'});
  items.forEach(it => {
    if(it.sep){ list.appendChild(el('div', {class:'sep'})); return; }
    if(it.head){ list.appendChild(el('div', {class:'head', text:it.head})); return; }
    const mi = el('button', {class:'mi', disabled:!!it.disabled, role:'menuitem'},
      el('span', {class:'check', text: it.checked ? '✓' : ''}),
      el('span', {class:'ic', html: it.icon ? svgIcon(it.icon) : ''}),
      el('span', {text:it.label}),
      it.kbd ? el('span', {class:'k', text:it.kbd}) : null,
      it.submenu ? el('span', {class:'arrow', html:svgIcon('external')}) : null);
    if(it.submenu){
      mi.addEventListener('mouseenter', () => {
        /* 子菜单：贴右侧展开，超出屏幕则向左翻 */
        const old = $$('.submenu', box); old.forEach(n => n.remove());
        const sub = el('div', {class:'menu-list submenu'},
          it.submenu.map(s => s.sep ? el('div', {class:'sep'})
            : el('button', {class:'mi', disabled:!!s.disabled, onclick:() => { hideMenu(); s.action && s.action(); }},
                el('span', {class:'check', text: s.checked ? '✓' : ''}),
                el('span', {class:'ic', html: s.icon ? svgIcon(s.icon) : ''}),
                el('span', {text:s.label}))));
        sub.style.cssText = 'position:fixed;z-index:8610;';
        box.appendChild(sub);
        const r = mi.getBoundingClientRect(); const sr = sub.getBoundingClientRect();
        let sx = r.right - 4, sy = r.top - 6;
        if(sx + sr.width > window.innerWidth - 6) sx = r.left - sr.width + 4;
        if(sy + sr.height > window.innerHeight - 6) sy = window.innerHeight - sr.height - 6;
        sub.style.left = Math.max(4, sx) + 'px'; sub.style.top = Math.max(4, sy) + 'px';
      });
    }else{
      mi.addEventListener('click', () => { hideMenu(); it.action && it.action(); });
    }
    list.appendChild(mi);
  });
  if(!parent){ box.appendChild(list); box.style.display = 'block';
    const r = box.getBoundingClientRect();
    box.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
    box.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
  }
}

    '<div class="dow">五</div><div class="dow">六</div><div class="dow">日</div>' + cells.join('') + '</div>' +

let ST = null;
let POLL = null, pollMs = 0;
const PREV = {};
/** 探测真实状态变化并推送桌面通知（只在 live 模式做） */
function detectChanges(s){
  if(!s) return;
  const watch = [
    ['output_connected', v => notify(v ? 'ok' : 'warn', v ? '数字人已连接' : '数字人已断开',
      v ? '输出窗口已完成 WebRTC 连接，可以开始播报。' : '直播输出窗口已关闭或断开，请在“数字人直播画面”窗口重新连接。')],
    ['recording', v => notify(v ? 'ok' : 'info', v ? '已开始录制' : '录制已停止', v ? '直播画面正在录制并保存。' : '录制文件已保存到服务器的 record 目录。')],
    ['autopilot', v => notify(v ? 'ok' : 'info', v ? '自动话术已启动' : '自动话术已暂停', v ? '数字人会按话术队列自动讲解并随机化间隔。' : '自动播报已停止，安全操作不受套餐限制。')],
    ['live_state', v => { const names = {idle:'待机', preparing:'准备中', ready:'就绪', rehearsal:'彩排中', live:'直播中', stopping:'停播中', ended:'已结束'};
      notify(v === 'live' ? 'ok' : (v === 'ended' ? 'info' : 'info'), '直播状态：' + (names[v] || v), '状态机已从「' + (names[PREV.live_state] || PREV.live_state || '未知') + '」切换。'); }]
  ];
  watch.forEach(([key, fn]) => {
    const cur = s[key];
    if(PREV[key] !== undefined && PREV[key] !== cur){ try{ fn(cur); }catch(e){} }
    PREV[key] = cur;
  });
}
/** 拉取一次状态，并推送给所有已打开的原生面板 */

}
