        '<button class="btn" id="ctRec">' + svgIcon('monitor') + '<span>开始录制</span></button>' +
        '<button class="btn danger" id="ctEmergency">' + svgIcon('alert') + '<span>紧急停止</span></button>' +
      '</div></div>' +

    '<div class="grid2" style="margin-top:12px">' +
      '<div class="card"><h3>' + svgIcon('control') + '文本驱动播报</h3>' +
        '<div class="field"><span>要播报的文本（支持多句，按行分隔）</span>' +
          '<textarea id="ctText" placeholder="例如：欢迎来到直播间，我是 AI 数字人主播。"></textarea></div>' +
        '<div class="row"><select id="ctMode" title="播报模式"><option value="echo">复读（原声朗读）</option><option value="chat">对话（走大模型）</option></select>' +
          '<label class="chk"><input type="checkbox" id="ctBreak"> 打断当前播报</label>' +
          '<button class="btn primary" id="ctSend" style="margin-left:auto">' + svgIcon('play') + '<span>提交播报</span></button></div>' +
        '<div class="hint" style="margin-top:8px" id="ctSpeakMsg">播报需要数字人输出窗口已连接；未连接时接口会返回错误提示。</div></div>' +

      '<div class="card"><h3>' + svgIcon('subtitle') + '模拟评论判定</h3>' +
        '<div class="field"><span>输入一句观众评论（开播前自检 / 演示 / 排障）</span>' +
          '<input type="text" id="ctSimText" placeholder="例如：这个多少钱？发什么快递？"></div>' +
        '<div class="row"><button class="btn sm ghost" data-quick="这个多少钱？有优惠券吗">价格</button>' +
          '<button class="btn sm ghost" data-quick="都有什么尺码？什么面料">规格</button>' +
          '<button class="btn sm ghost" data-quick="什么时候发货？多久能到">发货</button>' +
          '<button class="btn sm ghost" data-quick="支持退货吗？有运费险吗">售后</button>' +
          '<button class="btn sm ghost" data-quick="今天天气怎么样">未命中示例</button></div>' +
        '<div class="row" style="margin-top:9px"><label class="chk"><input type="checkbox" id="ctSimSpeak"> 同时让数字人播报</label>' +
          '<button class="btn primary" id="ctSimRun" style="margin-left:auto">' + svgIcon('check') + '<span>模拟一条评论</span></button></div>' +
        '<div id="ctSimOut" style="margin-top:10px"></div></div>' +
    '</div>' +

    '<div class="grid2" style="margin-top:12px">' +
      '<div class="card"><h3>' + svgIcon('clock') + '最近播报与应答</h3><dl class="kv" id="ctLast"></dl></div>' +
      '<div class="card"><h3>' + svgIcon('cli') + '最近操作历史<span class="hint" style="margin-left:auto">来自服务端 status.history</span></h3>' +
        '<div class="log" id="ctHistory">加载中…</div></div>' +
    '</div>';

  const refs = {
    stats:$('#ctStats', pane), liveState:$('#ctLiveState', pane), last:$('#ctLast', pane), history:$('#ctHistory', pane),
    simOut:$('#ctSimOut', pane), speakMsg:$('#ctSpeakMsg', pane), text:$('#ctText', pane),
    autoBtn:$('#ctAuto', pane), rec:$('#ctRec', pane), simSpeak:$('#ctSimSpeak', pane)
  };
  /* 渲染（由全局轮询推送状态，避免每个窗口各自轮询） */
  function render(s){
    if(!s || !pane.isConnected) return;
    refs.liveState.textContent = '直播状态：' + stateName(s.live_state);
    refs.liveState.className = 'badge ' + (s.live_state === 'live' ? 'ok' : s.live_state === 'ended' ? '' : 'info');
    const cur = (s.sales && s.sales.current_product) || null;
    const wf = s.workflow || {};
    refs.stats.innerHTML = [
      ['数字人输出', s.output_connected ? '已连接' : '未连接', s.output_connected],
      ['播报中', s.speaking ? '正在播报' : '静默', s.speaking],
      ['自动话术', s.autopilot ? '运行中' : '已暂停', s.autopilot],
      ['录制', s.recording ? '录制中' : '未录制', s.recording],
      ['当前商品', cur ? cur.name : '未选择', !!cur],
      ['开播检查', (wf.required_passed || 0) + '/' + (wf.required_total || 0) + ' 项必做通过', !!wf.ready],
      ['大模型', (s.llm && s.llm.label ? s.llm.label : '未配置') + (s.llm && s.llm.api_key_configured ? ' · Key 已配置' : ' · Key 未配置'), !!(s.llm && s.llm.api_key_configured)],
      ['累计播报', (s.stats ? s.stats.scripts_played : 0) + ' 段 · 人工介入 ' + (s.stats ? s.stats.manual_interventions : 0) + ' 次', true]
    ].map(([lab, val, ok]) => '<div class="stat"><div class="lab">' + esc(lab) + '</div><div class="val sm">' +
      (ok ? '<span class="badge ok" style="margin-right:6px">●</span>' : '<span class="badge" style="margin-right:6px">○</span>') + esc(val) + '</div></div>').join('');
    refs.last.innerHTML = [
      ['最后播报', s.last_spoken_text || '—'], ['最后应答', s.last_reply || '—'],
      ['话术条数', (s.scripts || []).length + ' 条'], ['循环间隔', (s.gap_target_seconds || 0) + ' 秒'],
      ['直播开始', s.live_started_at ? new Date(s.live_started_at * 1000).toLocaleString('zh-CN') : '—'],
      ['连接时间', s.output_registered_at ? new Date(s.output_registered_at * 1000).toLocaleString('zh-CN') : '—']
    ].map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('');
    const his = s.history || [];
    refs.history.innerHTML = his.length
      ? his.slice(0, 12).map(h => '<span class="' + (h.status === 'error' ? 'er' : '') + '">' + esc(fmtDT(new Date((h.time || 0) * 1000))) + ' [' + esc(h.type || '') + '] ' + esc(h.text || '') + '</span>').join('\n')
      : '暂无操作记录。';
    refs.autoBtn.querySelector('span').textContent = s.autopilot ? '自动话术运行中' : '启动自动话术';
    refs.rec.querySelector('span').textContent = s.recording ? '停止录制' : '开始录制';
    refs.speakMsg.textContent = s.output_connected
      ? '输出窗口已连接，提交后会推送给数字人播报。'
      : '数字人输出窗口未连接：请先点右上角「打开并连接直播画面」，在画面窗口里点「启动直播画面」。';
  }
  win.onStatus = render;
  if(ST) render(ST);

  /* —— 交互：每个按钮都调用真实接口（demo 模式走本地演示数据层） —— */
  const acts = {
    ctRefresh:async b => { busy(b, true); try{ await refreshStatus(true); }catch(e){} finally{ busy(b, false); } },
    ctOpenStage:() => { openApp('stage'); setTimeout(() => toast('info', '请在画面窗口点击「启动直播画面」', '该按钮会建立 WebRTC 连接并把输出窗口登记到工作台。'), 600); },
    ctSpeakTest:async b => { busy(b, true); try{ await Data.speak('这是一段测试话术：画面、声音和口型检查正常，请值守人员确认后再正式开播。', 'echo', false);
      toast('ok', '测试话术已提交', '请观察直播画面是否开始播报'); await refreshStatus(false); }catch(e){ apiFail(e, '播报'); } finally{ busy(b, false); } },
    ctInterrupt:async b => { busy(b, true); try{ await Data.interrupt(); toast('ok', '已打断播报', '安全操作不受套餐限制'); await refreshStatus(false); }catch(e){ apiFail(e, '打断'); } finally{ busy(b, false); } },
    ctAuto:async b => { busy(b, true); try{ const on = !(ST && ST.autopilot); await Data.autopilot(on); toast('ok', on ? '自动话术已启动' : '自动话术已暂停', on ? '注意保持真人值守并可随时接管' : ''); await refreshStatus(false); }catch(e){ apiFail(e, '自动话术'); } finally{ busy(b, false); } },
    ctAutoStop:async b => { busy(b, true); try{ await Data.autopilot(false); toast('ok', '自动话术已暂停', ''); await refreshStatus(false); }catch(e){ apiFail(e, '自动话术'); } finally{ busy(b, false); } },
    ctRec:async b => { busy(b, true); try{ const stop = !!(ST && ST.recording); await Data.recording(stop ? 'stop' : 'start');
      toast('ok', stop ? '录制已停止' : '已开始录制', stop ? '录制文件已保存' : '录制中请确认磁盘空间充足'); await refreshStatus(false); }catch(e){ apiFail(e, '录制'); } finally{ busy(b, false); } },
    ctEmergency:async b => { confirmBox('紧急停止', '将立即停止自动话术、字幕回应并打断当前播报。确定执行吗？', async () => {
      busy(b, true); try{ await Data.emergencyStop(); notify('warn', '已执行紧急停止', '自动话术与字幕回应已关闭，当前播报已打断。'); await refreshStatus(false); }
      catch(e){ apiFail(e, '紧急停止'); } finally{ busy(b, false); } }, true); },
    ctSend:async b => {
      const text = refs.text.value.trim(); if(!text){ toast('warn', '请输入文本', '文本为空时不会提交'); return; }
      busy(b, true);
      try{ await Data.speak(text, $('#ctMode', pane).value, $('#ctBreak', pane).checked);
        toast('ok', '已提交播报', '共 ' + text.split(/\r?\n/).filter(Boolean).length + ' 句'); refs.text.value = ''; await refreshStatus(false);
      }catch(e){ apiFail(e, '播报'); } finally{ busy(b, false); }
    },
    ctSimRun:async b => {
      const text = $('#ctSimText', pane).value.trim(); if(!text){ toast('warn', '请输入一句评论', '例如：这个多少钱？'); return; }
      busy(b, true); refs.simOut.innerHTML = '<div class="hint">判定中…</div>';
      try{
        const r = await Data.simulate(text, refs.simSpeak.checked);
        refs.simOut.innerHTML =
          '<div class="card" style="box-shadow:none;background:var(--surface-2)">' +
          '<div class="row" style="margin-bottom:8px"><span class="badge info">' + esc(r.route_label || '未判定') + '</span>' +
          (r.intent_label ? '<span class="badge">意图：' + esc(r.intent_label) + '</span>' : '') +
          (r.keyword ? '<span class="badge">命中词：' + esc(r.keyword) + '</span>' : '') +
          '<span class="badge ' + (r.offline_ready ? 'ok' : 'warn') + '">' + (r.offline_ready ? '断网可播' : '需联网/大模型') + '</span>' +
          '<span class="badge">' + esc(r.elapsed_ms) + ' ms</span>' +
          '<span class="badge ' + (r.spoken ? 'ok' : '') + '">' + (r.spoken ? '已播报' : '仅判定未播报') + '</span></div>' +
          '<dl class="kv"><dt>输入</dt><dd>' + esc(r.input) + '</dd>' +
          '<dt>将播报</dt><dd>' + esc(r.response || '（无应答文本）') + '</dd>' +
          (r.product ? '<dt>当前商品</dt><dd>' + esc(r.product) + '</dd>' : '') +
          (r.note ? '<dt>说明</dt><dd>' + esc(r.note) + '</dd>' : '') + '</dl></div>';
        await refreshStatus(false);
      }catch(e){ refs.simOut.innerHTML = '<div class="banner warn">' + svgIcon('alert') + '<span>判定失败：' + esc(e.message) + '</span></div>'; }
      finally{ busy(b, false); }
    }
  };
  Object.keys(acts).forEach(id => { const b = document.getElementById(id); if(b) b.addEventListener('click', () => acts[id](b)); });
  $$('[data-quick]', pane).forEach(b => b.addEventListener('click', () => { $('#ctSimText', pane).value = b.dataset.quick; }));
  return {refresh:() => refreshStatus(true), onStatus:render};
};

/* ── 13.2 开播 SOP 检查：真实预检项 + 一键开播/安全下播 ── */
PanelRegistry.sop = function(pane, win){
  pane.innerHTML =
    '<div class="pane-head"><h2>开播 SOP 检查中心</h2><div class="sp">' +
      '<button class="btn ghost" id="sopReload">' + svgIcon('refresh') + '<span>重新预检</span></button>' +
      '<button class="btn primary" id="sopStart">' + svgIcon('play') + '<span>一键开播</span></button>' +
      '<button class="btn danger" id="sopStop">' + svgIcon('stop') + '<span>安全下播</span></button></div></div>' +
    '<div id="sopBody"><div class="empty">正在读取检查项…</div></div>';
  const body = $('#sopBody', pane);
  function render(s){
    if(!s || !pane.isConnected) return;
    const wf = s.workflow || {checks:[], blockers:[], warnings:[]};
    const cur = (s.sales && s.sales.current_product) || null;
    const group = (level, title, cls) => {
      const list = (wf.checks || []).filter(c => (c.level || 'blocker') === level);
      if(!list.length) return '';
      return '<div class="card"><h3>' + svgIcon(level === 'blocker' ? 'alert' : level === 'warning' ? 'zap' : 'info') + esc(title) +
        '<span class="badge ' + cls + '" style="margin-left:auto">' + list.filter(c => c.passed).length + '/' + list.length + '</span></h3>' +
        '<ul class="chk-list">' + list.map(c =>
          '<li class="' + (c.passed ? 'pass' : (c.level === 'blocker' ? 'block' : 'warn')) + '">' +
          '<span class="m">' + (c.passed ? '✓' : '!') + '</span><span class="t"><b>' + esc(c.label) + '</b>' +
          (c.passed ? '' : '<span>' + esc(c.action || '') + '</span>') + '</span></li>').join('') + '</ul></div>';
    };
    body.innerHTML =
      '<div class="stats">' +
        '<div class="stat"><div class="lab">必做项通过率</div><div class="val">' + (wf.score === undefined ? '—' : wf.score + '%') + '</div></div>' +
        '<div class="stat"><div class="lab">必做项</div><div class="val">' + (wf.required_passed || 0) + ' / ' + (wf.required_total || 0) + '</div></div>' +
        '<div class="stat"><div class="lab">阻塞项</div><div class="val">' + ((wf.blockers || []).length) + '</div></div>' +
        '<div class="stat"><div class="lab">建议项待办</div><div class="val">' + ((wf.warnings || []).length) + '</div></div>' +
        '<div class="stat"><div class="lab">能否开播</div><div class="val sm">' + (wf.ready ? '<span class="badge ok">可以开播</span>' : '<span class="badge err">存在阻塞</span>') + '</div></div>' +
      '</div>' +
      '<div class="progress" style="margin:12px 0"><i style="width:' + (wf.score || 0) + '%"></i></div>' +
      '<div class="card"><h3>' + svgIcon('catalog') + '当前讲解商品</h3><dl class="kv">' +
        (cur ? '<dt>商品</dt><dd>' + esc(cur.name) + '</dd><dt>平台商品ID</dt><dd>' + esc(cur.platform_product_id || '未填写') + '</dd>' +
               '<dt>已核对价格</dt><dd>' + esc(cur.price || '未填写') + '</dd><dt>卖点</dt><dd>' + esc(cur.selling_points || '未填写') + '</dd>'
             : '<dt>状态</dt><dd>未选择当前商品（在商品库中设为当前商品）</dd>') + '</dl></div>' +
      group('blocker', '必做检查项（未通过不可开播）', 'err') +
      group('warning', '建议检查项（不阻塞开播）', 'warn') +
      group('optional', '可选检查项', '') +
      '<div class="card"><h3>' + svgIcon('info') + '开播前后的纪律</h3><div class="hint">' +
        '① 平台挂载商品必须与工作台“当前商品”一致；佣金字段不会口播。<br>' +
        '② 保留 LiveTalking 水印并按平台要求标明 AI 生成，全程真人值守、可随时接管。<br>' +
        '③ 防录播看的是“固定周期重复”：间隔 ≥15 秒并打乱顺序，最稳是关闭循环、逐轮人工继续。<br>' +
        '④ 修改商品、价格、话术后，相关检查项会自动撤销，必须重新核对。' +
      '</div></div>';
  }
  win.onStatus = render; if(ST) render(ST);
  const on = (id, fn) => { const b = document.getElementById(id); if(b) b.addEventListener('click', () => fn(b)); };
  on('sopReload', async b => { busy(b, true); try{ await refreshStatus(false); toast('ok', '已重新预检', '检查项已按最新配置重新计算'); }catch(e){ apiFail(e, '预检'); } finally{ busy(b, false); } });
  on('sopStart', async b => {
    busy(b, true);
    try{
      const r = await Data.workflowStart();
      if(r && r.success === false) toast('warn', '开播未完成', r.error || '请检查工作台状态');
      else notify('ok', '一键开播已启动', '自动内容与场次记录已启动；请确认平台侧已开始直播。');
      await refreshStatus(false);
    }catch(e){ apiFail(e, '一键开播'); } finally{ busy(b, false); }
  });
  on('sopStop', b => confirmBox('安全下播', '将停止自动内容并结束当前场次，确定吗？', async () => {
    busy(b, true); try{ const r = await Data.workflowStop();
      toast(r && r.success === false ? 'warn' : 'ok', '已安全下播', r && r.error ? r.error : '自动模块已关闭');
      await refreshStatus(false); }catch(e){ apiFail(e, '安全下播'); } finally{ busy(b, false); } }));
  return {refresh:() => refreshStatus(false), onStatus:render};
};

/* ── 13.3 日志与诊断：/health + /api/system/access + 操作历史 + 前端错误 ── */
PanelRegistry.diagnostics = function(pane, win){
  pane.innerHTML =
    '<div class="pane-head"><h2>日志与诊断</h2><div class="sp">' +
      '<button class="btn ghost" id="dgReload">' + svgIcon('refresh') + '<span>重新检测</span></button>' +
      '<button class="btn" id="dgCopy">' + svgIcon('copy') + '<span>复制诊断信息</span></button>' +
      '<button class="btn" id="dgExport">' + svgIcon('download') + '<span>导出报告</span></button></div></div>' +
    '<div class="grid2">' +
      '<div class="card"><h3>' + svgIcon('cpu') + '服务健康（GET /health）</h3><div class="log" id="dgHealth">检测中…</div></div>' +
      '<div class="card"><h3>' + svgIcon('monitor') + '访问地址（GET /api/system/access）</h3><div id="dgAccess"></div></div>' +
    '</div>' +
    '<div class="card"><h3>' + svgIcon('clock') + '服务端操作历史</h3><div class="log" id="dgHistory">加载中…</div></div>' +
    '<div class="card"><h3>' + svgIcon('cli') + '前端日志（本页 console 与异常）</h3><div class="log" id="dgClients">正在采集…</div></div>' +
    '<div class="card"><h3>' + svgIcon('info') + '环境信息</h3><dl class="kv" id="dgEnv"></dl></div>';
  const refs = {health:$('#dgHealth', pane), access:$('#dgAccess', pane), history:$('#dgHistory', pane), clients:$('#dgClients', pane), env:$('#dgEnv', pane)};
  async function loadHealth(){
    refs.health.textContent = '检测中…';
    try{ const h = await Data.health(); refs.health.textContent = JSON.stringify(h, null, 2); }
    catch(e){ refs.health.innerHTML = '<span class="er">健康检查失败：' + esc(e.message) + '</span>'; }
  }
  async function loadAccess(){
    try{
      const a = await Data.access();
      refs.access.innerHTML = '<dl class="kv">' +
        '<dt>本机地址</dt><dd>' + esc(a.desktop_url || location.href) + ' <button class="btn sm ghost" data-copy="' + esc((a.desktop_url||'').replace('/live_console.html','/desktop.html')) + '">复制</button></dd>' +
        '<dt>监听端口</dt><dd>' + esc(a.port || '—') + '</dd>' +
        '<dt>同网段手机访问</dt><dd>' + ((a.lan_urls && a.lan_urls.length)
          ? a.lan_urls.map(u => '<div>' + esc(u.replace('/live_console.html','/desktop.html')) + ' <button class="btn sm ghost" data-copy="' + esc(u.replace('/live_console.html','/desktop.html')) + '">复制</button></div>').join('')
          : (MODE === 'demo' ? '离线演示模式无此信息' : '未检测到局域网地址')) + '</dd>' +
        '<dt>分享限制</dt><dd>' + (a.same_network_only ? '仅同一局域网可直接访问；外网请用“外网分享给别人看.cmd”' : '—') + '</dd></dl>' +
        '<div class="hint" style="margin-top:8px">局域网 http 访问时浏览器会禁用麦克风/摄像头；本机 127.0.0.1 不受限。</div>';
      $$('[data-copy]', refs.access).forEach(b => b.addEventListener('click', () => copyText(b.dataset.copy, '地址')));
    }catch(e){ refs.access.innerHTML = '<div class="hint">读取失败：' + esc(e.message) + '</div>'; }
  }
  function render(s){
    if(!s) return;
    const his = s.history || [];
    refs.history.innerHTML = his.length
      ? his.map(h => '<span class="' + (h.status === 'error' ? 'er' : h.status === 'warning' ? 'wa' : '') + '">' +
          esc(fmtDT(new Date((h.time || 0) * 1000))) + ' [' + esc(h.type || '') + '] ' + esc(h.text || '') + '</span>').join('\n')
      : '暂无操作记录。';
  }
  win.onStatus = render; if(ST) render(ST);
  function renderEnv(){
    const con = navigator.connection || {};
    refs.env.innerHTML = [
      ['运行模式', MODE === 'live' ? '连接本地服务（真实接口）' : '离线演示（不访问接口）'],
      ['页面地址', location.href],
      ['浏览器', navigator.userAgent],
      ['屏幕 / 窗口', window.screen.width + '×' + window.screen.height + ' / ' + window.innerWidth + '×' + window.innerHeight],
      ['语言 / 在线', navigator.language + ' / ' + (navigator.onLine ? '在线' : '离线')],
      ['网络类型', con.effectiveType ? con.effectiveType + '（' + (con.downlink || '?') + ' Mbps）' : '浏览器未提供'],
      ['已打开窗口', WM.wins.size + ' 个'],
      ['本地存储项', (function(){ let n = 0; try{ for(const k in localStorage) if(k.indexOf('ailive.') === 0) n++; }catch(e){} return n; })() + ' 项（ailive.*）']
    ].map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('');
  }
  function renderClientLogs(){
    refs.clients.innerHTML = CLIENT_LOGS.length
      ? CLIENT_LOGS.slice(-60).map(l => '<span class="' + (l.level === 'error' ? 'er' : l.level === 'warn' ? 'wa' : '') + '">' +
          esc(l.time) + ' [' + esc(l.level) + '] ' + esc(l.text) + '</span>').join('\n')
      : '本页暂无前端错误或警告（已捕获 console.warn/error 与未处理异常）。';
  }
  renderClientLogs(); renderEnv(); loadHealth(); loadAccess();
  /* 诊断报告：把面板里的关键信息拼成可交付的文本 */
  function report(){
    const a = (ST && ST.workflow) || {};
    return [
      'AI 数字人桌面版 诊断报告',
      '生成时间：' + new Date().toLocaleString('zh-CN'),
      '运行模式：' + (MODE === 'live' ? 'live（真实服务 ' + location.host + '）' : 'demo（离线演示）'),
      '页面地址：' + location.href,
      '浏览器：' + navigator.userAgent,
      '窗口数：' + WM.wins.size,
      '直播状态：' + ((ST && ST.live_state) || '—') + '　输出连接：' + ((ST && ST.output_connected) ? '是' : '否'),
      '开播检查：' + ((a.required_passed || 0) + '/' + (a.required_total || 0)) + '　阻塞项：' + ((a.blockers || []).length),
      '服务健康：' + refs.health.textContent.slice(0, 600),
      '访问地址：' + refs.access.textContent.slice(0, 400),
      '前端日志：',
      CLIENT_LOGS.slice(-40).map(l => l.time + ' [' + l.level + '] ' + l.text).join('\n') || '（无）'
    ].join('\n');
  }
  const on = (id, fn) => { const b = document.getElementById(id); if(b) b.addEventListener('click', () => fn(b)); };
  on('dgReload', async b => { busy(b, true); renderClientLogs(); renderEnv(); await loadHealth(); await loadAccess(); try{ await refreshStatus(false); }catch(e){} renderClientLogs(); busy(b, false); toast('ok','已重新检测','健康、地址、历史与前端日志均已刷新'); });
  on('dgCopy', b => copyText(report(), '诊断报告'));
  on('dgExport', b => { downloadText('AI数字人桌面版-诊断报告-' + Date.now() + '.txt', report()); toast('ok', '报告已导出', '文件已保存到浏览器下载目录'); });
  return {refresh:async () => { await loadHealth(); await loadAccess(); }, onStatus:render};
};

  function wpPreview(id){

      mist:'linear-gradient(140deg,#eef7ff,#cfe4f7 60%,#bcd8f0)',
      paper:'linear-gradient(150deg,#f7fafc,#eef4f9 55%,#e6eef6)',
      deepsea:'linear-gradient(160deg,#0d2f4a,#123c5c 50%,#0a2338)',
      carbon:'repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px),linear-gradient(160deg,#101a24,#152736 55%,#0c141d)',
      none:'linear-gradient(180deg,#e8f2fa,#d5e6f4)'
    };
    return map[id] || map.aurora;
  }
  /** 绑定本页所有控件的交互（每次重绘后重新绑定） */
  function wire(){
    $$('[data-sw]', pane).forEach(node => {
      const key = node.dataset.sw;
      const flip = () => { S[key] = !S[key]; saveSettings(); applySettings(); node.classList.toggle('on', !!S[key]);
        node.setAttribute('aria-checked', String(!!S[key])); toast('ok', '已' + (S[key] ? '开启' : '关闭'), labelOf(key)); };
      node.addEventListener('click', flip);
      node.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); } });
    });
    $$('[data-seg]', pane).forEach(seg => {
      const key = seg.dataset.seg;
      $$('button', seg).forEach(b => b.addEventListener('click', () => {
        S[key] = b.dataset.v; saveSettings(); applySettings();
        $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); toast('ok', '已切换', labelOf(key) + '：' + b.textContent);
      }));
    });
    $$('[data-sw2]', pane).forEach(box => {
      const key = box.dataset.sw2;
      $$('.sw', box).forEach(b => b.addEventListener('click', () => {
        S[key] = b.dataset.v; saveSettings(); applySettings();
        $$('.sw', box).forEach(x => x.classList.toggle('on', x === b)); toast('ok', '已应用', '主色已更新');
      }));
    });
    $$('[data-wp] [data-v]', pane).forEach(b => b.addEventListener('click', () => {
      S.wallpaper = b.dataset.v; saveSettings(); applySettings();
      $$('[data-wp] .wp-opt', pane).forEach(x => x.classList.toggle('on', x === b));
      toast('ok', '壁纸已更换', '当前壁纸：' + (WALLPAPERS.find(w => w.id === S.wallpaper) || {}).name);
    }));
  }
  function labelOf(key){
    return ({theme:'主题模式',accent:'主色',iconSize:'图标大小',animations:'界面动画',maxOnDblTitle:'双击标题栏最大化',
      snapEdges:'边缘吸附',confirmClose:'关闭前确认',taskbarPos:'任务栏位置',showClock:'时钟显示',dblClickOpen:'单击打开图标',
      alignIcons:'自动排列图标',snapGrid:'对齐网格',toasts:'弹出提示'}[key]) || key;
  }
  draw();
  return {refresh:draw};
};

/* ═══════════════════ 14. 前端日志采集（给“日志与诊断”用） ═══════════════════ */
const CLIENT_LOGS = [];
(function hookConsole(){
  ['warn','error'].forEach(level => {
    const orig = console[level].bind(console);
    console[level] = function(){
      try{ CLIENT_LOGS.push({time:fmtDT(new Date()), level:level, text:Array.prototype.map.call(arguments, a => typeof a === 'string' ? a : (a && a.message) || String(a)).join(' ')});
        while(CLIENT_LOGS.length > 200) CLIENT_LOGS.shift(); }catch(e){}
      orig.apply(null, arguments);
    };
  });
  window.addEventListener('error', e => CLIENT_LOGS.push({time:fmtDT(new Date()), level:'error', text:(e.message || '未知错误') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)}));
  window.addEventListener('unhandledrejection', e => CLIENT_LOGS.push({time:fmtDT(new Date()), level:'error', text:'未处理的 Promise 拒绝：' + ((e.reason && e.reason.message) || e.reason || '')}));
})();

      buttons:[{text:'知道了', primary:true, action:closeModal}]});
  });
  /* 全局点击：关闭菜单 / 开始菜单 / 通知面板 / 日历 */
  document.addEventListener('pointerdown', e => {
    if(!e.target.closest('#ctxMenu')) hideMenu();
    if(!e.target.closest('#startMenu') && !e.target.closest('#startBtn') && !e.target.closest('#tbSearch')) closeStart();

    if(!e.target.closest('#calendarPop') && !e.target.closest('#clock')) closeCalendar();
  }, true);

  document.addEventListener('keydown', e => {

    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    if(e.key === 'Escape'){ hideMenu(); closeStart(); openNotes(false); closeCalendar(); if($('#modalLayer').classList.contains('open')) closeModal(); return; }
    if(e.ctrlKey && e.key === 'Escape'){ e.preventDefault(); openStart(); return; }

    if(e.ctrlKey && e.shiftKey){
      const k = e.key.toLowerCase();
      if(k === 's'){ e.preventDefault(); openApp('settings'); }
      else if(k === 'l'){ e.preventDefault(); openApp('logs'); }
      else if(k === 'm'){ e.preventDefault(); WM.minimizeAll(); }
      else if(k === 'w'){ e.preventDefault(); const top = WM.order.filter(id => WM.wins.get(id)).pop(); if(top) WM.close(top); }
    }
    if(typing) return;
  });
  /* 窗口尺寸变化：重新约束窗口并重排图标 */
  let rzTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => { layoutIcons(); applyWindowConstraints(); if($('#calendarPop').classList.contains('open')) renderCalendar(); }, 160);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(S.theme === 'auto') applySettings(); });
  window.addEventListener('online', () => notify('ok', '网络已恢复', '本地服务通常不受影响；外网分享隧道请查看分享窗口。', true));
  window.addEventListener('offline', () => notify('warn', '网络已断开', '本地 127.0.0.1 服务仍可用；离线语音缓存可保证高频话术照常播报。', true));
  window.addEventListener('beforeunload', () => { try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} });
}

/* ═══════════════════ 16. 启动流程 ═══════════════════ */
const BOOT_AT = Date.now();
function bootStep(text, pct){
  const box = $('#bootSteps');
  box.insertAdjacentHTML('beforeend', '<div><i>✓</i>' + esc(text) + '</div>');
  $('#bootBar').style.width = pct + '%';
}
function bootFail(text){ $('#bootSteps').insertAdjacentHTML('beforeend', '<div style="color:#ffb4b4">✗ ' + esc(text) + '</div>'); }
async function boot(){
  $('#bootFoot').textContent = 'LiveTalking · 本机浏览器桌面外壳 v' + APP_VERSION;
  bootStep('初始化桌面外壳', 12);
  renderIcons(); renderPinned(); renderStartGrid(); buildStartMenu(); bindMarquee(); bindGlobal(); applySettings();
  tickClock(); setInterval(tickClock, 1000);

  if(canServe && FORCE !== 'demo'){
    $('#bootSub').textContent = '正在连接本地服务…';
    try{
      /* 注意：必须先切到 live 再调 Data.*，否则 Data.account() 会走 demo 分支拿到空账号 */
      MODE = 'live';
      bootStep('连接本地服务 ' + location.host, 34);
      ACCOUNT = await Promise.race([apiGet('/api/auth/me'), new Promise((_, rej) => setTimeout(() => rej(new Error('账号接口超时')), 6000))]);
      bootStep('读取运行状态（GET /api/live/status）', 62);
      ST = await Data.status();
      bootStep('已连接：' + (ST.output_connected ? '数字人输出已连接' : '数字人输出未连接') + '，直播状态：' + (ST.live_state || '—'), 86);
      if(ST && ST.llm) PROVIDERS = [];
    }catch(e){
      MODE = 'demo';
      bootFail('未能连接本地服务（' + (e && e.message ? e.message : e) + '），已降级为离线演示模式');
    }
  }else{
    bootStep('以 file:// 打开或强制演示模式 → 离线演示', 60);
    MODE = 'demo';
  }
  /* 登录态兜底：登录已关闭或未登录时不阻断，只提示 */
  if(MODE === 'live' && ACCOUNT && ACCOUNT.auth_enabled && ACCOUNT.authenticated === false){
    bootStep('注意：当前未登录（部分窗口会被服务端拦截）', 90);
  }
  /* 首次状态：live 走真实接口，demo 走本地演示数据；两条路径都要有初始状态，否则面板状态区是空的 */
  if(!ST){ try{ ST = await Data.status(); }catch(e){ ST = null; } }
  updateModeChip();
  startPolling();
  bootStep('构建桌面与窗口系统', 100);
  $('#bootSub').textContent = MODE === 'live' ? '服务已就绪' : '离线演示模式';
  setTimeout(() => {
    $('#boot').classList.add('hide');
    setTimeout(() => $('#boot').remove(), 340);
    if(MODE === 'live'){
      notify('ok', '桌面已就绪', '已连接本地服务；控制中心可直接操作数字人（真实接口）。');
    }else{
      notify('warn', '离线演示模式', '未连接本地服务：窗口内容为演示数据。启动“一键启动AI数字人.cmd”后从 8010 端口打开即为完整功能。', true);
      toast('warn', '离线演示模式', '这里不会调用任何接口；正式功能请从 http://127.0.0.1:8010/desktop.html 打开', 8000);
    }
    (S.autoOpen || []).forEach((id, i) => setTimeout(() => { if(APP_MAP[id]) openApp(id); }, 120 + i * 90));
  }, MODE === 'live' ? 320 : 520);
}
boot().catch(e => { bootFail('启动失败：' + e.message); console.error(e); });
</script>
