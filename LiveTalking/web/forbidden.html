<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>没有访问权限 - AI 数字人直播工作台</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <script src="/common.js"></script>
  <script src="/auth.js"></script>
  <style>
    .deny-wrap { max-width: 620px; margin: 8vh auto 0; padding: 0 18px 56px; }
    .deny-card { text-align: center; }
    .deny-icon { font-size: 46px; color: var(--danger); line-height: 1; }
    .deny-title { margin: 14px 0 6px; font-size: 20px; font-weight: 700; }
    .deny-fact { display: grid; gap: 6px; margin: 18px auto 0; max-width: 420px; text-align: left; }
    .deny-fact > div { display: flex; gap: 10px; font-size: 13px; line-height: 1.6; }
    .deny-fact > div > span { flex: 0 0 84px; color: var(--text-secondary); }
    .deny-fact > div > strong { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    .deny-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  </style>
</head>
<body>
  <nav id="lt-nav-container"></nav>
  <main class="deny-wrap">
    <section class="card deny-card">
      <div class="card-body">
        <div class="deny-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h1 class="deny-title">这个页面需要更高权限</h1>
        <p class="hint" id="denyMessage">你的账号可以正常使用直播工作台，但打不开这个管理页面。</p>
        <div class="deny-fact">
          <div><span>当前账号</span><strong id="denyUser">—</strong></div>
          <div><span>当前套餐</span><strong id="denyPlan">—</strong></div>
          <div><span>需要权限</span><strong id="denyFeature">—</strong></div>
        </div>
        <div class="deny-actions">
          <a class="btn btn-primary" href="/live_console.html"><i class="bi bi-broadcast"></i> 返回直播工作台</a>
          <a class="btn btn-outline" href="/upgrade.html" id="denyUpgrade"><i class="bi bi-gem"></i> 升级会员</a>
          <a class="btn btn-outline" href="/affiliate_tutorial.html" target="_blank" rel="noopener"><i class="bi bi-book"></i> 查看教程</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    const $ = (sel) => document.querySelector(sel);
    const params = new URLSearchParams(location.search);
    const feature = params.get('feature') || '';

    Auth.load().then((state) => {
      const user = state.user || {};
      $('#denyUser').textContent = user.display_name || user.username || '未登录';
      $('#denyPlan').textContent = Auth.planLabel();
      $('#denyFeature').textContent = feature
        ? (Auth.featureLabel(feature) + '（仅管理员）')
        : '管理员权限';
      const meta = state.features[feature];
      if (meta && meta.plan === 'pro') {
        $('#denyMessage').textContent = '“' + Auth.featureLabel(feature) + '”属于专业版功能，购买或兑换激活码后即可使用。';
      } else if (user.is_admin) {
        $('#denyMessage').textContent = '你已是管理员，但这个页面属于其它管理模块，请联系系统维护人员确认。';
      }
      if (!user.is_paid) {
        $('#denyUpgrade').style.display = '';
      } else {
        $('#denyUpgrade').style.display = 'none';
      }
    }).catch(() => {
      $('#denyMessage').textContent = '无法读取当前登录状态，请返回登录页重新登录。';
    });
  </script>
</body>
</html>
